  function getMediaDropzoneSetting(key){

  function cleanMediaDropzoneEndpoint(value){return String(value||'').trim().replace(/\/+$/,'');}
  function cleanMediaDropzoneId(value){return String(value||'').replace(/[^a-zA-Z0-9._-]/g,'').slice(0,96);}
  function initMediaDropzoneUploadAdapter(){
    const endpoint=cleanMediaDropzoneEndpoint(getMediaDropzoneSetting('KGG_MEDIA_DROPZONE_ENDPOINT')||getMediaDropzoneSetting('kggMediaDropzoneEndpoint'));
    window.KGGMediaDropzone={
      setEndpoint(url){try{localStorage.setItem('kggMediaDropzoneEndpoint',cleanMediaDropzoneEndpoint(url));}catch(e){}},
      setUploadToken(token){try{localStorage.setItem('kggMediaDropzoneUploadToken',String(token||'').trim());}catch(e){}},
      clear(){try{localStorage.removeItem('kggMediaDropzoneEndpoint');localStorage.removeItem('kggMediaDropzoneUploadToken');}catch(e){}}
    };
    if(!endpoint)return;
    if(window.KGGMediaUploadAdapter&&!window.KGGMediaUploadAdapter.isMock)return;
    window.KGGMediaUploadAdapter={
      name:'kgg-media-dropzone-kv-v1',
      isMock:false,
      async upload(blob,context){
        const manifest=context&&context.manifest||{};
        const id=cleanMediaDropzoneId(manifest.id)||makeMediaId();
        const ttlSeconds=Math.max(60,Math.min(MEDIA_UPLOAD_LONG_TTL_SECONDS,Number(context&&context.ttlSeconds)||MEDIA_UPLOAD_TTL_SECONDS));
        const token=getMediaDropzoneSetting('KGG_MEDIA_DROPZONE_UPLOAD_TOKEN')||getMediaDropzoneSetting('kggMediaDropzoneUploadToken');
        const headers={'Content-Type':'application/octet-stream','X-KGG-Media-Id':id,'X-KGG-Media-Mime':manifest.mime||'application/octet-stream','X-KGG-Media-Bytes':String(blob&&blob.size||0)};
        if(token)headers['X-KGG-Upload-Token']=token;
        const res=await fetch(endpoint+'/upload?ttl='+encodeURIComponent(ttlSeconds),{method:'POST',headers,body:blob,cache:'no-store'});
        if(!res.ok)throw new Error('Medien-Upload fehlgeschlagen ('+res.status+').');
        const data=await res.json();
        if(data&&data.id&&data.deleteToken)mediaDropzoneRuntimeTokens[data.id]=data.deleteToken;
        return data;
      },
      scheduleDelete(media,options){
        const delay=Math.max(1000,Number(options&&options.delayMs)||((Number(media&&media.ttlSeconds)||MEDIA_UPLOAD_TTL_SECONDS)*1000));
        setTimeout(()=>{this.delete(media);},delay);
      },
      async delete(media){
        const id=cleanMediaDropzoneId(media&&media.id);
        if(!id)return false;
        const deleteToken=(media&&media.deleteToken)||mediaDropzoneRuntimeTokens[id]||'';
        const deleteUrl=(media&&media.deleteUrl)||endpoint+'/media/'+encodeURIComponent(id);
        try{
          const res=await fetch(deleteUrl,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({deleteToken}),cache:'no-store'});
          return res.ok||res.status===404||res.status===410;
        }catch(err){console.warn('Media delete fehlgeschlagen:',err);return false;}
      }
    };
  }

  function bytesToBase64Url(input){
    const bytes=input instanceof Uint8Array?input:new Uint8Array(input);
    let binary='';
    for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function ensureMediaShape(media){
    const src=media||{};
    return {
      id:src.id||makeMediaId(),
      type:src.type||src.kind||'image',
      name:src.name||src.originalName||'uebungsbild.jpg',
      mime:src.mime||'image/jpeg',
      width:Number(src.width)||0,
      height:Number(src.height)||0,
      originalSize:Number(src.originalSize)||0,
      compressedSize:Number(src.compressedSize)||0,
      encryptedSize:Number(src.encryptedSize)||0,
      status:src.status||'local-encrypted',
      encrypted:src.encrypted!==false,
      storage:src.storage||'indexeddb-local',
      downloadUrl:src.downloadUrl||'',
      deleteUrl:src.deleteUrl||'',
      deleteToken:src.deleteToken||'',
      ttlSeconds:Number(src.ttlSeconds)||MEDIA_UPLOAD_TTL_SECONDS,
      retrySeconds:Number(src.retrySeconds)||MEDIA_RETRY_SECONDS,
      createdAt:src.createdAt||new Date().toISOString(),
      crypto:src.crypto||null
    };
  }
  function ensureExerciseMediaList(ex){return Array.isArray(ex&&ex.media)?ex.media.map(ensureMediaShape):[];}
  function openMediaDb(){
    if(mediaDbPromise)return mediaDbPromise;
    mediaDbPromise=new Promise((resolve,reject)=>{
      if(!('indexedDB' in window)){reject(new Error('IndexedDB nicht verfuegbar'));return;}
      const req=indexedDB.open(mediaDbName,1);
      req.onupgradeneeded=()=>{const db=req.result; if(!db.objectStoreNames.contains(mediaStoreName))db.createObjectStore(mediaStoreName,{keyPath:'id'});};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('Media-DB konnte nicht geoeffnet werden'));
    });
    return mediaDbPromise;
  }
  function putEncryptedMediaBlob(record){
    return openMediaDb().then(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(mediaStoreName,'readwrite');
      tx.objectStore(mediaStoreName).put(record);
      tx.oncomplete=()=>resolve(record);
      tx.onerror=()=>reject(tx.error||new Error('Media-Blob konnte nicht gespeichert werden'));
    }));
  }
  function getEncryptedMediaBlob(id){
    return openMediaDb().then(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(mediaStoreName,'readonly');
      const req=tx.objectStore(mediaStoreName).get(id);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error||new Error('Media-Blob konnte nicht gelesen werden'));
    }));
  }
  function deleteEncryptedMediaBlob(id){
    return openMediaDb().then(db=>new Promise(resolve=>{
      const tx=db.transaction(mediaStoreName,'readwrite');
      tx.objectStore(mediaStoreName).delete(id);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    })).catch(()=>false);
  }
  function isMediaReferencedElsewhere(id,owner){
    const sid=String(id||'');
    if(!sid)return false;
    const ownerId=owner&&(owner.localId||owner.id);
    const lists=[...(state.plan||[]),...bank];
    return lists.some(ex=>{
      if(!ex)return false;
      if(owner&&String(ex.localId||ex.id)===String(ownerId))return false;
      return ensureExerciseMediaList(ex).some(media=>String(media.id)===sid);
    });
  }
  function deleteUnsharedMediaBlob(media,owner){
    if(media&&media.id&&!isMediaReferencedElsewhere(media.id,owner))deleteEncryptedMediaBlob(media.id);
  }
  function loadImageFromBlob(blob){
    return new Promise((resolve,reject)=>{
      const url=URL.createObjectURL(blob);
      const img=new Image();
      img.onload=()=>{URL.revokeObjectURL(url); resolve(img);};
      img.onerror=()=>{URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht gelesen werden'));};
      img.src=url;
    });
  }
  async function compressImageFile(file){
    const img=await loadImageFromBlob(file);
    const maxSide=Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height,1);
    const scale=Math.min(1,MEDIA_IMAGE_MAX_DIM/maxSide);
    const width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
    const height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    const canvas=document.createElement('canvas');
    canvas.width=width; canvas.height=height;
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,width,height); ctx.drawImage(img,0,0,width,height);
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Bild konnte nicht komprimiert werden')),'image/jpeg',MEDIA_IMAGE_QUALITY));
    return {blob,width,height,mime:'image/jpeg'};
  }
  async function encryptMediaBlob(blob){
    if(!window.crypto||!crypto.subtle)throw new Error('Web Crypto ist in diesem Browser nicht verfuegbar');
    const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const plain=await blob.arrayBuffer();
    const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
    const rawKey=await crypto.subtle.exportKey('raw',key);
    return {blob:new Blob([cipher],{type:'application/octet-stream'}),encryptedSize:cipher.byteLength,key:bytesToBase64Url(rawKey),iv:bytesToBase64Url(iv)};
  }
  async function prepareImageMediaFile(file){
    if(!file||!String(file.type||'').startsWith('image/'))throw new Error('Bitte ein Bild auswaehlen');
    const id=makeMediaId();
    const compressed=await compressImageFile(file);
    const encrypted=await encryptMediaBlob(compressed.blob);
    const now=new Date().toISOString();
    const manifest=ensureMediaShape({
      id,
      type:'image',
      name:file.name||'uebungsbild.jpg',
      mime:compressed.mime,
      width:compressed.width,
      height:compressed.height,
      originalSize:file.size||0,
      compressedSize:compressed.blob.size||0,
      encryptedSize:encrypted.encryptedSize,
      status:'local-encrypted',
      encrypted:true,
      storage:'indexeddb-local',
      ttlSeconds:MEDIA_UPLOAD_TTL_SECONDS,
      retrySeconds:MEDIA_RETRY_SECONDS,
      createdAt:now,
      crypto:{alg:'AES-GCM',iv:encrypted.iv,key:encrypted.key}
    });
    await putEncryptedMediaBlob({id,blob:encrypted.blob,manifest,createdAt:now});
    return manifest;
  }
  function mediaUploadAdapter(){
    const adapter=window.KGGMediaUploadAdapter;
    return adapter&&typeof adapter.upload==='function'?adapter:null;

  function currentMediaShareTtlSeconds(){
    return Math.max(MEDIA_UPLOAD_TTL_SECONDS,Number(patientShareTtlSeconds)||MEDIA_UPLOAD_TTL_SECONDS);

  function scheduleTemporaryMediaDelete(adapter,media){
    if(!adapter)return;
    const delay=Math.max(1,Number(media.ttlSeconds)||MEDIA_UPLOAD_TTL_SECONDS)*1000;
    if(typeof adapter.scheduleDelete==='function'){
      try{adapter.scheduleDelete(media,{delayMs:delay});}catch(err){console.warn('Media scheduleDelete fehlgeschlagen:',err);}
      return;
    }
    if(typeof adapter.delete==='function'){
      setTimeout(()=>{try{adapter.delete(media);}catch(err){console.warn('Media delete fehlgeschlagen:',err);}},delay);
    }
  }
  async function uploadOneMediaItem(adapter,media,options){
    const ttlSeconds=Number(options&&options.ttlSeconds)||MEDIA_UPLOAD_TTL_SECONDS;
    const force=!!(options&&options.force);
    if(media.downloadUrl&&media.status==='ready'&&!force&&(Number(media.ttlSeconds)||0)>=ttlSeconds)return media;
    const record=await getEncryptedMediaBlob(media.id);
    if(!record||!record.blob)throw new Error('Verschluesselte Bilddatei fehlt lokal.');
    const uploadManifest=ensureMediaShape({...media,ttlSeconds,retrySeconds:MEDIA_RETRY_SECONDS});
    const result=await adapter.upload(record.blob,{manifest:uploadManifest,ttlSeconds});
    if(!result||!result.downloadUrl)throw new Error('Upload lieferte keinen Download-Link.');
    const uploadedAt=new Date().toISOString();
    const expiresAt=result.expiresAt||new Date(Date.now()+ttlSeconds*1000).toISOString();
    const updated=ensureMediaShape({...media,downloadUrl:result.downloadUrl,deleteUrl:result.deleteUrl||media.deleteUrl||'',deleteToken:result.deleteToken||media.deleteToken||'',storage:result.storage||'temporary-web-encrypted',status:'ready',uploadedAt,expiresAt,ttlSeconds,retrySeconds:MEDIA_RETRY_SECONDS});
    scheduleTemporaryMediaDelete(adapter,updated);
    return updated;
  }
  function publicMediaBundleItem(media){
    return {
      id:media.id,
      type:'image',
      mime:media.mime,
      name:media.name,
      width:media.width,
      height:media.height,
      bytes:media.encryptedSize||0,
      encrypted:true,
      status:media.downloadUrl?'ready':'upload-pending',
      downloadUrl:media.downloadUrl||'',
      expiresInSeconds:media.ttlSeconds||MEDIA_UPLOAD_TTL_SECONDS,
      retrySeconds:media.retrySeconds||MEDIA_RETRY_SECONDS,
      crypto:media.crypto||null
    };
  }
  async function blobToBase64Url(blob){
    return bytesToBase64Url(await blob.arrayBuffer());
  }
  async function mediaItemsForBundle(exercises){
    const seen=new Set();
    const items=[];
    for(const ex of (exercises||[])){
      for(const media of ensureExerciseMediaList(ex)){
        if(media.type!=='image'||!media.id||seen.has(media.id))continue;
        seen.add(media.id);
        const record=await getEncryptedMediaBlob(media.id);
        if(!record||!record.blob)throw new Error('Verschluesselte Bilddatei fehlt lokal: '+(media.name||media.id));
        const item=publicMediaBundleItem(media);
        item.status='ready';
        item.downloadUrl='';
        item.dataEncoding='base64url';
        item.data=await blobToBase64Url(record.blob);
        item.encryptedBytes=record.blob.size||media.encryptedSize||0;
        items.push(item);
      }
    }
    return items;
  }
  async function uploadMediaBundle(adapter,exercises,ttlSeconds){
    const bundleItems=await mediaItemsForBundle(exercises);
    if(!bundleItems.length){lastPatientMediaBundleManifest=null; return null;}
    const plain={kind:'kgg-media-bundle-v1',version:1,createdAt:new Date().toISOString(),items:bundleItems};
    const encrypted=await encryptMediaBlob(new Blob([JSON.stringify(plain)],{type:'application/json'}));
    const bundleId='bundle_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const result=await adapter.upload(encrypted.blob,{manifest:{id:bundleId,type:'bundle',mime:'application/octet-stream'},ttlSeconds});
    if(!result||!result.downloadUrl)throw new Error('Medien-Bundle lieferte keinen Download-Link.');
    const bundle={
      id:result.id||bundleId,
      schema:'kgg-media-bundle-v1',
      count:bundleItems.length,
      downloadUrl:result.downloadUrl,
      deleteUrl:result.deleteUrl||'',
      deleteToken:result.deleteToken||'',
      expiresInSeconds:ttlSeconds,
      retrySeconds:MEDIA_RETRY_SECONDS,
      encrypted:true,
      crypto:{alg:'AES-GCM',iv:encrypted.iv,key:encrypted.key}
    };
    scheduleTemporaryMediaDelete(adapter,{id:bundle.id,deleteUrl:bundle.deleteUrl,deleteToken:bundle.deleteToken,ttlSeconds});
    lastPatientMediaBundleManifest=bundle;
    return bundle;
  }
  async function prepareMediaUploadsForPatientShare(options){
    lastPatientMediaBundleManifest=null;
    const sourcePlan=options&&options.plan;
    const exercises=sourcePlan&&Array.isArray(sourcePlan.exercises)?sourcePlan.exercises:state.plan;
    const items=allPlanMediaItems(exercises);
    if(!items.length)return {ok:true,count:0};
    const adapter=mediaUploadAdapter();
    if(!adapter)return {ok:false,count:items.length,message:'Medien-Upload fehlt. Plan bleibt offen.'};
    const ttlSeconds=Number(options&&options.ttlSeconds)||currentMediaShareTtlSeconds();
    let bundle=null;
    try{
      bundle=await uploadMediaBundle(adapter,exercises,ttlSeconds);
    }catch(err){
      console.warn('Medien-Bundle konnte nicht erstellt werden:',err);
      return {ok:false,count:items.length,message:err&&err.message?err.message:'Medien-Bundle fehlgeschlagen. Plan bleibt offen.'};
    }
    if(!sourcePlan){
      syncStatePlanToStore('ui_prepare_media_uploads_for_patient_share');
      save();
    }
    return {ok:true,count:items.length,uploaded:items.length,bundle};
  }
  function normalizeSideMode(value){
    const raw=String(value||'BI').trim().toUpperCase().replace(/\s+/g,'');
    if(['L','LI','LINKS','LEFT','R','RE','RECHTS','RIGHT'].includes(raw))return 'LR';
    if(['LR','L/R','LI/RE','LINKS/RECHTS','LINKSRECHTS','LEFT/RIGHT','BEIDSEITIGGETRENNT'].includes(raw))return 'LR';
    if((raw.includes('LINKS')&&raw.includes('RECHTS'))||(raw.includes('LI')&&raw.includes('RE')))return 'LR';
    if(['BI','BID','BEIDE','BEIDSEITIG','BILATERAL'].includes(raw))return 'BI';
    return 'BI';
  }
  function sideModeLabel(value){return ({BI:'beidseitig',LR:'links/rechts getrennt'})[normalizeSideMode(value)]||'beidseitig';}
  function normalizeSetCount(value){const n=Number(value)||3; return Math.max(1,Math.min(5,n));}
  function normalizeMeasureMode(value){
    const raw=String(value||'').trim().toLowerCase();
    if(['zeit','time','dauer','sek','sek.','sec','s'].includes(raw))return 'zeit';
    return 'wdh';
  }
  function measureUnitLabel(measure){return normalizeMeasureMode(measure)==='zeit'?'Sek.':'Wdh';}
  function cleanFreeUnitLabel(value){
    return String(value||'').trim().replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').replace(/^[.@:;,\-\s]+|[.@:;,\-\s]+$/g,'');
  }
  function normalizeLoadUnitInfo(value,fallback){
    const fallbackUnit=fallback||'kg';
    const raw=cleanFreeUnitLabel(value);
    if(!raw)return {unit:fallbackUnit,custom:false,explicit:false};
    const lower=raw.toLowerCase().replace(/\./g,'').replace(/\s+/g,' ');
    const compact=lower.replace(/\s+/g,'');
    if(['kg','kgs','kilo','kilos','kilogramm','kilogram'].includes(lower))return {unit:'kg',custom:false,explicit:true};
    if(['bw','bodyweight','body weight','koerpergewicht','körpergewicht','eigengewicht'].includes(lower)||compact==='bodyweight')return {unit:'BW',custom:false,explicit:true};
    if(['hub','huebe','hübe'].includes(lower))return {unit:'Hub',custom:false,explicit:true};
    if(['stufe'].includes(lower))return {unit:'Stufe',custom:false,explicit:true};
    if(['watt','w'].includes(lower))return {unit:'Watt',custom:false,explicit:true};
    if(['stufe/watt','stufe watt','stufe+watt','stufewatt'].includes(lower)||compact==='stufe/watt')return {unit:'Stufe/Watt',custom:false,explicit:true};

  function resetBankRowSwipe(row){
    if(!row)return;
    row.classList.remove('bank-swipe-dragging','bank-swipe-armed','bank-swipe-left','bank-swipe-right');

  function startBankRowSwipeDelete(ev){
    if(ev.button!=null&&ev.button!==0)return;
    if(ev.target&&ev.target.closest&&ev.target.closest('[data-edit],input,textarea,select,a'))return;
    const row=ev.currentTarget;
    const id=row&&row.dataset&&row.dataset.bankId;
    if(!row||!id)return;
    const startX=ev.clientX,startY=ev.clientY;
    const swipe={row,id,startX,startY,active:false,dx:0,pointerId:ev.pointerId};
    const threshold=()=>Math.min(128,Math.max(74,row.offsetWidth*0.34));
    const cleanup=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cancel);};
    const move=e=>{
      const dx=e.clientX-startX,dy=e.clientY-startY;
      if(!swipe.active){
        if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.2){cleanup();return;}
        if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.25)return;
        swipe.active=true;
        row.classList.add('bank-swipe-dragging');
        try{row.setPointerCapture&&row.setPointerCapture(swipe.pointerId);}catch(err){}
      }
      if(!swipe.active)return;
      e.preventDefault();
      const max=row.offsetWidth*0.86;
      swipe.dx=Math.max(-max,Math.min(max,dx));
      const strength=Math.min(1,Math.abs(swipe.dx)/threshold());
      row.classList.toggle('bank-swipe-left',swipe.dx<0);
      row.classList.toggle('bank-swipe-right',swipe.dx>0);
      row.classList.toggle('bank-swipe-armed',Math.abs(swipe.dx)>=threshold());
      row.style.setProperty('--bank-swipe-strength',String(strength));
      row.style.transform='translateX('+swipe.dx+'px)';
      row.style.opacity=String(1-strength*0.12);
    };
    const up=e=>{
      cleanup();
      if(!swipe.active){resetBankRowSwipe(row);return;}
      e.preventDefault();
      bankSwipeSuppressClickUntil=Date.now()+380;
      const shouldAsk=Math.abs(swipe.dx)>=threshold();
      row.style.transition='transform .2s cubic-bezier(.2,.9,.2,1), opacity .16s ease, box-shadow .16s ease';
      row.style.transform='translateX(0)';
      row.style.opacity='1';
      setTimeout(()=>{resetBankRowSwipe(row); if(shouldAsk)openBankDeleteModal(id);},210);
    };
    const cancel=()=>{cleanup(); if(swipe.active){row.style.transition='transform .18s ease, opacity .18s ease';row.style.transform='translateX(0)';row.style.opacity='1';setTimeout(()=>resetBankRowSwipe(row),190);}else resetBankRowSwipe(row);};
    document.addEventListener('pointermove',move,{passive:false});
    document.addEventListener('pointerup',up,{passive:false,once:true});
    document.addEventListener('pointercancel',cancel,{passive:true,once:true});
  }

  function bindPlanReorderButtons(list){

        if(!isTabletLayout())return;

        const startX=ev.clientX,startY=ev.clientY,pointerId=ev.pointerId;

          document.removeEventListener('pointerup',upBefore);
          document.removeEventListener('pointercancel',upBefore);
        };

            button:0,

            clientX:startX,
            clientY:startY,
            pointerId:pointerId,
            preventDefault:function(){},
            stopPropagation:function(){}

  function resetPlanCardSwipe(card){
    if(!card)return;

  function startPlanCardSwipeDelete(ev){
    if(ev.button!=null&&ev.button!==0)return;
    const pendingTabletReorder=(animatedReorder&&isTabletLayout()&&animatedReorder.card===ev.currentTarget&&!animatedReorder.active)?animatedReorder:null;
    if(animatedReorder&&!pendingTabletReorder)return;
    const interactiveTarget=ev.target&&ev.target.closest?ev.target.closest('button,input,textarea,select,a'):null;
    const actionSwipeTarget=interactiveTarget&&interactiveTarget.closest&&interactiveTarget.closest('.planCardActions');
    if(interactiveTarget&&!actionSwipeTarget)return;
    const card=ev.currentTarget;
    const id=card&&card.dataset&&card.dataset.planId;
    if(!card||!id)return;
    const startX=ev.clientX,startY=ev.clientY;
    const swipe={card,id,startX,startY,active:false,dx:0,pointerId:ev.pointerId,cancelTimer:null};
    const threshold=()=>Math.min(132,Math.max(78,card.offsetWidth*0.34));

    const move=e=>{
      const dx=e.clientX-startX,dy=e.clientY-startY;

        if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.2){cleanup();return;}
        if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.25)return;
        if(pendingTabletReorder&&animatedReorder===pendingTabletReorder){
          clearTimeout(pendingTabletReorder.timer);
          cleanupAnimatedReorder(false);
        }
        swipe.active=true;
        document.body.classList.add('kggPlanCardSwiping');
        clearPhoneScrollStateForPlanGesture(420);
        card.classList.add('swipe-dragging');
        try{card.setPointerCapture&&card.setPointerCapture(swipe.pointerId);}catch(err){}
      }
      if(!swipe.active)return;
      clearPhoneScrollStateForPlanGesture(420);
      e.preventDefault(); if(e.stopPropagation)e.stopPropagation();

      swipe.dx=Math.max(-max,Math.min(max,dx));
      const strength=Math.min(1,Math.abs(swipe.dx)/threshold());
      card.classList.toggle('swipe-left',swipe.dx<0);
      card.classList.toggle('swipe-right',swipe.dx>0);
      card.classList.toggle('swipe-armed',Math.abs(swipe.dx)>=threshold());
      card.style.setProperty('--swipe-strength',String(strength));
      card.style.setProperty('--kgg-plan-swipe-x',swipe.dx+'px');
      card.style.transform='translateX(var(--kgg-plan-swipe-x,0px))';
      card.style.opacity=String(1-strength*0.16);
    };

      cleanup();
      if(!swipe.active){resetPlanCardSwipe(card);return;}
      e.preventDefault(); if(e.stopPropagation)e.stopPropagation(); card.dataset.swipeSuppressClickUntil=String(Date.now()+360);
      clearPhoneScrollStateForPlanGesture(520);
      document.body.classList.remove('kggPlanCardSwiping');
      const shouldDelete=Math.abs(swipe.dx)>=threshold();
      if(shouldDelete){
        const dir=swipe.dx<0?-1:1;
        card.classList.add('swipe-removing');
        card.style.transition='transform .18s cubic-bezier(.2,.9,.2,1), opacity .18s ease';
        card.style.setProperty('--kgg-plan-swipe-x',(dir*(card.offsetWidth+96))+'px');
        card.style.transform='translateX(var(--kgg-plan-swipe-x,0px))';
        card.style.opacity='0';
        setTimeout(()=>{document.body.classList.remove('kggPlanCardSwiping');removeExercise(id);},190);
        return;
      }
      card.style.transition='transform .22s cubic-bezier(.2,.9,.2,1), opacity .18s ease, box-shadow .18s ease';
      card.style.setProperty('--kgg-plan-swipe-x','0px');
      card.style.transform='translateX(var(--kgg-plan-swipe-x,0px))';
      card.style.opacity='1';
      setTimeout(()=>resetPlanCardSwipe(card),230);
    };
    const cancel=()=>{
      if(swipe.active){
        clearTimeout(swipe.cancelTimer);
        swipe.cancelTimer=setTimeout(()=>{cleanup();resetPlanCardSwipe(card);},900);
        return;
      }
      cleanup();
      resetPlanCardSwipe(card);
    };
    document.addEventListener('pointermove',move,{passive:false});
    document.addEventListener('pointerup',up,{passive:false,once:true});
    document.addEventListener('pointercancel',cancel,{passive:true,once:true});
  }

  let animatedReorder=null;
  function startAnimatedReorderPress(ev){

  function fixedContainingBlockOffset(el){
    let node=el&&el.parentElement;
    while(node&&node!==document.documentElement){

      const contain=cs.contain||'';

      const createsFixedBlock=
        cs.transform!=='none'||
        cs.perspective!=='none'||
        cs.filter!=='none'||
        backdrop!=='none'||
        contain.includes('paint')||
        contain.includes('layout')||
        willChange.includes('transform');
      if(createsFixedBlock){
        const r=node.getBoundingClientRect();
        return {left:r.left,top:r.top};

      node=node.parentElement;
    }
    return {left:0,top:0};

  function activateAnimatedReorder(press,initialEv){

  function assertCrossDataSafeSyncDocument(doc){
    const allowedPolicyKeys=new Set(['patients','secrets','debugPayloads','rawData']);
    const blockedKeyPattern=new RegExp(['patient','gemini','api'+'key','api'+'_'+'key','secret','token','raw'+'payload','base64'+'payload','qrraw'].join('|'));
    const blocked=[];
    const visit=(value,path)=>{
      if(!value||typeof value!=='object')return;
      Object.keys(value).forEach(key=>{
        const lower=String(key).toLowerCase();
        const policyKey=(path==='sync.privacy'||path.endsWith('.privacy'))&&allowedPolicyKeys.has(key);
        if(policyKey){
          if(value[key]!==false)blocked.push(path+'.'+key);
        }else if(blockedKeyPattern.test(lower)){
          blocked.push(path+'.'+key);
        }
        visit(value[key],path+'.'+key);
      });
    };
    visit(doc,'sync');
    if(blocked.length)throw new Error('Sync-Safe blockiert geschuetzte Felder: '+blocked.slice(0,3).join(', '));
    return doc;
  }

  async function createKggPdfThumbnailDataUrl(imageBlob){
    const img=await loadImageFromBlob(imageBlob);
    const targetW=150,targetH=110;
    const canvas=document.createElement('canvas');
    canvas.width=targetW; canvas.height=targetH;
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,targetW,targetH);
    const iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1;
    const scale=Math.min(targetW/iw,targetH/ih);
    const dw=Math.max(1,Math.round(iw*scale));
    const dh=Math.max(1,Math.round(ih*scale));
    const dx=Math.round((targetW-dw)/2),dy=Math.round((targetH-dh)/2);
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    try{ctx.filter='grayscale(1) contrast(1.08)';}catch(e){}
    ctx.drawImage(img,dx,dy,dw,dh);
    try{
      const data=ctx.getImageData(0,0,targetW,targetH);
      for(let i=0;i<data.data.length;i+=4){
        const grey=Math.round((data.data[i]*0.299)+(data.data[i+1]*0.587)+(data.data[i+2]*0.114));
        data.data[i]=grey; data.data[i+1]=grey; data.data[i+2]=grey; data.data[i+3]=255;
      }
      ctx.putImageData(data,0,0);
    }catch(e){}
    return canvas.toDataURL('image/jpeg',.68);
  }
  async function loadKggPdfExerciseThumbnail(sourceExercise){

      return {
        kind:'kgg-pdf-exercise-thumbnail',
        sourceId:String(media.id||''),
        mime:'image/jpeg',
        width:150,

      };
    }catch(err){
      console.warn('PDF-Uebungsbild wird ausgelassen:',err);

    }
  }

  function drawKggTableScaffold(doc,ex,x,y,w,h,options){
    const largePrint=!!(options&&options.largePrint);
    const side=normalizeSideMode(ex&&ex.side||'BI');
    const loadUnit=String(ex&&ex.loadUnit||'kg')||'kg';
    const metricUnit=String(ex&&ex.metricUnit||'Wdh')||'Wdh';
    const isLR=side==='LR';
    const tagW=largePrint?15.0:10.8;
    const painW=largePrint?32.0:22.5;
    const headH=largePrint?Math.max(14.6,Math.min(16.0,h*.32)):Math.max(8.6,Math.min(10.2,h*.18));
    const rowH=(h-headH)/6;
    const setW=w-tagW-painW;
    const groupW=setW/3;
    pdfResetInk(doc);
    doc.setLineWidth(largePrint?0.28:0.18);
    doc.rect(x,y,w,h);
    doc.rect(x,y,tagW,headH);
    pdfSetFont(doc,largePrint?7.4:4.7,'bold');
    pdfText(doc,'Tag',x+tagW/2,y+headH*.62,{align:'center'});
    for(let s=0;s<3;s++){
      const gx=x+tagW+s*groupW;
      doc.rect(gx,y,groupW,headH);
      pdfSetFont(doc,largePrint?7.5:4.8,'bold');
      pdfText(doc,pdfSpaceLabel('Satz '+(s+1),'S'+(s+1),groupW,isLR?18:16),gx+groupW/2,y+(largePrint?5.5:3.1),{align:'center'});
      const subCount=isLR?4:2;
      const subW=groupW/subCount;
      for(let c=1;c<subCount;c++)doc.line(gx+c*subW,y+(largePrint?7.4:4.2),gx+c*subW,y+headH);
      pdfSetFont(doc,largePrint?7.0:3.55,'bold');
      const labels=isLR?['li '+loadUnit,'li '+metricUnit,'re '+loadUnit,'re '+metricUnit]:[loadUnit,metricUnit];
      labels.forEach((label,idx)=>pdfText(doc,pdfShort(label,9),gx+subW*(idx+.5),y+headH-(largePrint?2.4:1.7),{align:'center'}));
    }
    const painX=x+tagW+setW;
    doc.rect(painX,y,painW,headH);
    pdfSetFont(doc,largePrint?7.2:4.2,'bold');
    pdfText(doc,'Schmerz',painX+painW/2,y+(largePrint?5.3:3.2),{align:'center'});
    pdfSetFont(doc,largePrint?7.0:3.4,'bold');
    pdfText(doc,'1-10',painX+painW/2,y+headH-(largePrint?2.4:1.7),{align:'center'});
    for(let t=0;t<6;t++){
      const ry=y+headH+t*rowH;
      doc.rect(x,ry,tagW,rowH);
      pdfSetFont(doc,largePrint?7.0:4.8,'bold');
      pdfText(doc,pdfSpaceLabel('Tag '+(t+1),'T'+(t+1),tagW,13),x+tagW/2,ry+rowH*.62,{align:'center'});
      for(let s=0;s<3;s++){
        const gx=x+tagW+s*groupW;
        doc.rect(gx,ry,groupW,rowH);
        const subCount=isLR?4:2;
        const subW=groupW/subCount;
        for(let c=1;c<subCount;c++)doc.line(gx+c*subW,ry,gx+c*subW,ry+rowH);
      }
      doc.rect(painX,ry,painW,rowH);
      const pad=largePrint?1.4:0.9,gap=largePrint?0.38:0.32;
      const boxW=(painW-pad*2-gap*9)/10;
      const boxH=Math.min(rowH-(largePrint?1.6:1.2),boxW*1.05);
      const by=ry+(rowH-boxH)/2;
      for(let n=0;n<10;n++)doc.rect(painX+pad+n*(boxW+gap),by,boxW,boxH);
    }
    pdfResetInk(doc);
  }


  function drawKggExerciseBox(doc,slot,x,y,w,h,options){
    const largePrint=!!(options&&options.largePrint);
    const ex=slot||{};
    pdfResetInk(doc);
    if(ex.empty){
      try{doc.setDrawColor(115);}catch(e){}
      doc.setLineWidth(largePrint?0.18:0.14);
      try{doc.roundedRect(x,y,w,h,1.4,1.4);}catch(e){doc.rect(x,y,w,h);}

      return;
    }
    doc.setLineWidth(largePrint?0.34:0.28);
    try{doc.roundedRect(x,y,w,h,1.6,1.6);}catch(e){doc.rect(x,y,w,h);}
    const labelW=largePrint?11.4:7.4,labelH=largePrint?10.0:6.8;
    const thumb=ex.pdfThumbnail&&ex.pdfThumbnail.dataUrl?ex.pdfThumbnail:null;
    const canDrawThumb=!!(thumb&&typeof doc.addImage==='function');
    const thumbW=canDrawThumb?(largePrint?Math.min(38,Math.max(32,w*.19)):Math.min(23.5,Math.max(18,w*.18))):0;
    const thumbH=canDrawThumb?(largePrint?Math.min(27.5,Math.max(22,h*.30)):Math.min(17.2,Math.max(12,h*.20))):0;
    const thumbX=x+w-thumbW-(largePrint?3.0:2.2);
    const thumbY=y+(largePrint?2.7:2.1);
    const textMax=largePrint?(canDrawThumb?58:82):(canDrawThumb?46:62);
    try{doc.setFillColor(0);}catch(e){}
    doc.rect(x,y,labelW,labelH,'F');
    try{doc.setTextColor(255);}catch(e){}
    pdfSetFont(doc,largePrint?9.0:5.9,'bold');
    pdfText(doc,String(ex.slotNo||ex.slotIndex||''),x+labelW/2,y+(largePrint?7.2:4.9),{align:'center'});
    try{doc.setTextColor(0);}catch(e){}
    if(canDrawThumb){
      try{
        doc.setLineWidth(largePrint?0.16:0.12);
        try{doc.setDrawColor(185);}catch(e){}
        doc.rect(thumbX-.45,thumbY-.45,thumbW+.9,thumbH+.9);
        doc.addImage(thumb.dataUrl,'JPEG',thumbX,thumbY,thumbW,thumbH);
      }catch(err){console.warn('PDF-Thumbnail konnte nicht gezeichnet werden:',err);}
      pdfResetInk(doc);
    }
    pdfSetFont(doc,largePrint?14.0:7.1,'bold');
    const titleText=(ex.exNo||'EX')+' · '+(ex.name||'Übung');
    if(largePrint){
      const titleLines=pdfSplitTwoLines(titleText,textMax,canDrawThumb?52:70);
      pdfText(doc,titleLines[0],x+labelW+3.2,y+8.9);
      if(titleLines[1])pdfText(doc,titleLines[1],x+labelW+3.2,y+15.6);
    }else{
      pdfText(doc,pdfShort(titleText,textMax),x+labelW+2.3,y+5.0);
    }
    const sideLabel=sideModeLabel(ex.side||'BI');
    const startParts=[];
    if(ex.startLoad)startParts.push('Startlast '+ex.startLoad+' '+(ex.loadUnit||'kg'));
    if(ex.startMetric)startParts.push('Startwert '+ex.startMetric+' '+(ex.metricUnit||'Wdh'));
    const meta=[(ex.sets||3)+' Sätze',sideLabel].concat(startParts).concat([(ex.loadUnit||'kg'),(ex.metricUnit==='Wdh'?'Wiederholungen':(ex.metricUnit||'Wdh'))]).join(' · ');
    pdfSetFont(doc,largePrint?8.6:4.55,'normal');
    pdfText(doc,pdfShort(meta,largePrint?(canDrawThumb?92:118):(canDrawThumb?64:95)),x+labelW+(largePrint?3.2:2.3),y+(largePrint?23.2:9.1));
    pdfSetFont(doc,largePrint?6.2:3.35,'normal');
    pdfText(doc,pdfShort(ex.machineLine||'',largePrint?(canDrawThumb?112:146):(canDrawThumb?82:128)),x+labelW+(largePrint?3.2:2.3),y+(largePrint?29.0:12.5));
    const tableY=y+(largePrint?36.0:15.2);
    drawKggTableScaffold(doc,ex,x+(largePrint?2.0:1.6),tableY,w-(largePrint?4.0:3.2),h-(tableY-y)-(largePrint?2.0:1.5),{largePrint});
    pdfResetInk(doc);
  }


  function drawKggPdfLayoutV1(doc,snapshot){
    const size=getPdfPageSize(doc);
    const target=snapshot.layoutTarget||{};
    const largeSingleRow=target.grid==='1x3';
    const layout={pageW:size.w,pageH:size.h,margin:largeSingleRow?6.0:5.4,headerH:largeSingleRow?23.0:17.5,gap:largeSingleRow?2.8:2.6};
    const gridTop=layout.margin+layout.headerH+(largeSingleRow?3.2:3.1);
    const footerH=largeSingleRow?4.6:3.8;
    const gridH=layout.pageH-gridTop-layout.margin-footerH;
    const cols=largeSingleRow?1:2,rows=3;
    const slotLimit=cols*rows;
    const boxW=(layout.pageW-(layout.margin*2)-(layout.gap*(cols-1)))/cols;
    const boxH=(gridH-(layout.gap*(rows-1)))/rows;
    const pages=(snapshot.pages&&snapshot.pages.length?snapshot.pages:[{pageNo:1,pageCount:1,slots:[]}]);
    const pageOrientation=(target.orientation||'landscape');
    pages.forEach((page,pageIdx)=>{
      if(pageIdx>0)doc.addPage('a4',pageOrientation);
      pdfResetInk(doc);
      drawKggCornerMarkers(doc,layout);
      drawKggPdfHeader(doc,snapshot,page,layout);
      const slots=(page.slots||page.exercises||[]).slice(0,slotLimit);
      while(slots.length<slotLimit)slots.push({empty:true});
      slots.forEach((slot,slotIdx)=>{
        const col=slotIdx%cols;
        const row=Math.floor(slotIdx/cols);
        const x=layout.margin+col*(boxW+layout.gap);
        const y=gridTop+row*(boxH+layout.gap);
        drawKggExerciseBox(doc,slot,x,y,boxW,boxH,{largePrint:largeSingleRow});
      });
      pdfResetInk(doc);
      pdfSetFont(doc,largeSingleRow?4.4:3.75,'normal');
      const template=(snapshot.layoutTarget&&snapshot.layoutTarget.templateId)||'TPL-BASIS-A-CLASSIC-L6-v2';
      pdfText(doc,'KGG|'+template+'|'+(page.pageNo||pageIdx+1)+'/'+(snapshot.pageCount||pages.length)+'|#EX-Layout|'+(snapshot.createdAt||'').slice(0,10),layout.pageW-layout.margin,layout.pageH-2.2,{align:'right'});
      pdfSetFont(doc,largeSingleRow?3.9:3.3,'normal');
      pdfText(doc,PDF_RUNTIME_FINGERPRINT,layout.margin,layout.pageH-2.2);
    });
  }

  function createScaledPdfDoc(doc,scale,options){
    const s=Number(scale)||1;
    const opts=options||{};
    const virtualW=Number(opts.virtualW)||297,virtualH=Number(opts.virtualH)||210;
    const pageOrientation=opts.orientation||(virtualW>virtualH?'landscape':'portrait');
    const scaled={
      internal:{pageSize:{width:virtualW,height:virtualH,getWidth:()=>virtualW,getHeight:()=>virtualH}},
      addPage:(_format,orientation)=>{doc.addPage([virtualW*s,virtualH*s],orientation||pageOrientation);return scaled;},
      setFont:(family,style)=>{doc.setFont(family,style);return scaled;},
      setFontSize:size=>{doc.setFontSize(Number(size||0)*s);return scaled;},
      setLineWidth:width=>{doc.setLineWidth(Number(width||0)*s);return scaled;},
      setDrawColor:(...args)=>{doc.setDrawColor(...args);return scaled;},
      setTextColor:(...args)=>{doc.setTextColor(...args);return scaled;},
      setFillColor:(...args)=>{doc.setFillColor(...args);return scaled;},
      rect:(x,y,w,h,style)=>{doc.rect(x*s,y*s,w*s,h*s,style);return scaled;},
      roundedRect:(x,y,w,h,rx,ry,style)=>{try{doc.roundedRect(x*s,y*s,w*s,h*s,(rx||0)*s,(ry||0)*s,style);}catch(e){doc.rect(x*s,y*s,w*s,h*s,style);}return scaled;},
      line:(x1,y1,x2,y2)=>{doc.line(x1*s,y1*s,x2*s,y2*s);return scaled;},
      text:(text,x,y,opts)=>{doc.text(String(text==null?'':text),x*s,y*s,opts||{});return scaled;}
    };
    return scaled;
  }

  function drawKggLargePrintPdfLayout(doc,snapshot){
    const size=getPdfPageSize(doc);
    const layout={pageW:size.w,pageH:size.h,margin:10,gap:7};
    const patient=snapshot.patient||{};
    const exercises=(snapshot.pages||[]).flatMap(page=>(page.slots||page.exercises||[])).filter(ex=>ex&&!ex.empty);
    let pageNo=0,y=0;
    const startPage=()=>{
      if(pageNo>0)doc.addPage('a4','landscape');
      pageNo+=1;
      y=layout.margin;
      pdfResetInk(doc);
      doc.setLineWidth(.45);
      try{doc.roundedRect(layout.margin,y,layout.pageW-layout.margin*2,21,2,2);}catch(e){doc.rect(layout.margin,y,layout.pageW-layout.margin*2,21);}
      pdfSetFont(doc,18,'bold');
      pdfText(doc,'KGG Trainingsplan - Grossdruck',layout.margin+5,y+8.2);
      pdfSetFont(doc,9,'normal');
      const line='Patient/in: '+pdfShort(patient.displayName||patient.name||'Patient/in',42)+'   Start: '+pdfShort(patient.startDate||'-',16);
      pdfText(doc,line,layout.margin+5,y+16.2);
      y+=29;
    };
    const drawCard=(ex,index)=>{
      const cardH=34;
      if(y+cardH>layout.pageH-layout.margin-6)startPage();
      const x=layout.margin,w=layout.pageW-layout.margin*2;
      doc.setLineWidth(.35);
      try{doc.roundedRect(x,y,w,cardH,2,2);}catch(e){doc.rect(x,y,w,cardH);}
      pdfSetFont(doc,15,'bold');
      pdfText(doc,(index+1)+'. '+pdfShort(ex.name||'Uebung',56),x+5,y+8.5);
      const side=sideModeLabel(ex.side||'BI');
      const meta=[];
      meta.push('Saetze: '+(ex.sets||3));
      meta.push('Ausfuehrung: '+side);
      if(ex.startLoad)meta.push('Startlast: '+ex.startLoad+' '+(ex.loadUnit||'kg'));
      if(ex.startMetric)meta.push('Startwert: '+ex.startMetric+' '+(ex.metricUnit||'Wdh'));
      meta.push('Eintragen: kg / Wiederholungen oder Zeit / Schmerz 1-10');
      pdfSetFont(doc,9.6,'normal');
      pdfText(doc,pdfShort(meta.join('  |  '),118),x+5,y+18.3);
      pdfSetFont(doc,8.2,'normal');
      pdfText(doc,'Trainingstage 1 bis 6 - bitte Werte nach jedem Training notieren.',x+5,y+27.2);
      y+=cardH+layout.gap;
    };
    startPage();
    if(!exercises.length){
      pdfSetFont(doc,14,'bold');
      pdfText(doc,'Keine Uebungen im Plan.',layout.margin+5,y+12);
    }else{
      exercises.forEach(drawCard);
    }
    pdfResetInk(doc);
    pdfSetFont(doc,6.5,'normal');
    pdfText(doc,PDF_RUNTIME_FINGERPRINT,layout.margin,layout.pageH-3.2);
  }

  function pdfBytesFromBinaryString(pdf){
    const bytes=new Uint8Array(pdf.length);
    for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
    return bytes;
  }
  function pdfBlobFromDoc(doc){
    if(!doc)return null;
    if(typeof doc.output==='function'){
      try{
        const blob=doc.output('blob');
        if(blob instanceof Blob)return blob;
      }catch(e){}
      try{
        const buffer=doc.output('arraybuffer');
        if(buffer)return new Blob([buffer],{type:'application/pdf'});
      }catch(e){}
      try{
        const text=doc.output();
        if(typeof text==='string')return new Blob([pdfBytesFromBinaryString(text)],{type:'application/pdf'});
      }catch(e){}
    }
    if(typeof doc._buildPdf==='function'){
      try{return new Blob([pdfBytesFromBinaryString(doc._buildPdf())],{type:'application/pdf'});}catch(e){}
    }
    return null;
  }
  function downloadPdfBlob(blob,filename){
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename||'kgg_trainingsplan.pdf';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
  }
  function pdfBlobToBase64(blob){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
      reader.onerror=()=>reject(reader.error||new Error('PDF konnte nicht gelesen werden.'));
      reader.readAsDataURL(blob);
    });
  }
  function nativePdfBridge(){
    return window.KGGNativePdf&&window.KGGNativePdf.available?window.KGGNativePdf:null;
  }
  async function sendPdfToNative(action){
    if(!currentPdfPreview||!currentPdfPreview.blob)return false;
    const bridge=nativePdfBridge();
    if(!bridge)return false;
    try{
      const base64=await pdfBlobToBase64(currentPdfPreview.blob);
      if(action==='download'&&typeof bridge.download==='function')return !!bridge.download(currentPdfPreview.filename,base64);
      if(action==='print'&&typeof bridge.print==='function')return !!bridge.print(currentPdfPreview.filename,base64);
      if(typeof bridge.open==='function')return !!bridge.open(currentPdfPreview.filename,base64);
    }catch(err){console.warn('Native PDF-Aktion fehlgeschlagen:',err);}
    return false;
  }
  let currentPdfPreview=null;
  let pdfPreviewFallbackTimer=null;
  function setPdfPreviewFallbackVisible(isVisible){
    const fallback=$('pdfPreviewFallback');
    if(fallback)fallback.classList.toggle('hidden',!isVisible);
  }
  function shouldUsePdfMobileBridge(){
    return !!(window.matchMedia && (window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(max-width: 700px)').matches));
  }
  function setPdfMobileBridgeVisible(isVisible){
    const bridge=$('pdfPreviewMobileBridge');
    const modal=$('pdfPreviewModal');
    if(bridge)bridge.classList.toggle('hidden',!isVisible);
    if(modal)modal.classList.toggle('pdfPreviewModalMobile',isVisible);
  }
  function openPdfPreview(result){
    if(!result||!result.blob)return;
    if(currentPdfPreview&&currentPdfPreview.url)URL.revokeObjectURL(currentPdfPreview.url);
    if(pdfPreviewFallbackTimer)clearTimeout(pdfPreviewFallbackTimer);
    const url=URL.createObjectURL(result.blob);
    currentPdfPreview={url,blob:result.blob,filename:result.filename||'kgg_trainingsplan.pdf'};
    const frame=$('pdfPreviewFrame');
    const useMobileBridge=shouldUsePdfMobileBridge();
    setPdfPreviewFallbackVisible(false);
    setPdfMobileBridgeVisible(useMobileBridge);
    if(frame){frame.src=useMobileBridge?'about:blank':url;frame.onerror=()=>setPdfPreviewFallbackVisible(true);}
    const notice=$('pdfPreviewNotice');
    if(notice)notice.textContent=useMobileBridge?'PDF bereit. Öffnen oder herunterladen.':'PDF bereit. Drucken oder herunterladen.';
    $('pdfPreviewModal').classList.add('open');
    if(!useMobileBridge){
      pdfPreviewFallbackTimer=setTimeout(()=>{
        if(currentPdfPreview)setPdfPreviewFallbackVisible(true);
      },1200);
    }
  }
  function closePdfPreview(){
    if(pdfPreviewFallbackTimer)clearTimeout(pdfPreviewFallbackTimer);
    pdfPreviewFallbackTimer=null;
    $('pdfPreviewModal').classList.remove('open');
    const frame=$('pdfPreviewFrame');
    if(frame)frame.src='about:blank';
    setPdfPreviewFallbackVisible(false);
    setPdfMobileBridgeVisible(false);
    if(currentPdfPreview&&currentPdfPreview.url)URL.revokeObjectURL(currentPdfPreview.url);
    currentPdfPreview=null;
  }
  async function printCurrentPdfPreview(){
    if(await sendPdfToNative('print'))return;
    if(shouldUsePdfMobileBridge()){
      openCurrentPdfPreviewTab();
      return;
    }
    const frame=$('pdfPreviewFrame');
    try{
      if(frame&&frame.contentWindow){frame.contentWindow.focus();frame.contentWindow.print();return;}
    }catch(e){}
    if(currentPdfPreview&&currentPdfPreview.url){
      const win=window.open(currentPdfPreview.url,'_blank');
      if(win)setTimeout(()=>{try{win.focus();win.print();}catch(e){}},600);
    }
  }
  async function downloadCurrentPdfPreview(){
    if(await sendPdfToNative('download'))return;
    if(currentPdfPreview)downloadPdfBlob(currentPdfPreview.blob,currentPdfPreview.filename);
  }
  function openPdfUrlCrossBrowser(url){
    if(!url)return false;
    try{
      const win=window.open('','_blank');
      if(win){
        try{win.opener=null;}catch(e){}
        win.location.href=url;
        return true;
      }
    }catch(e){}
    try{
      const a=document.createElement('a');
      a.href=url;
      a.target='_blank';
      a.rel='noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>a.remove(),1000);
      return true;
    }catch(e){}
    return false;
  }
  async function openCurrentPdfPreviewTab(){
    if(!currentPdfPreview||!currentPdfPreview.url)return;
    if(await sendPdfToNative('open'))return;
    if(!openPdfUrlCrossBrowser(currentPdfPreview.url)){
      downloadPdfBlob(currentPdfPreview.blob,currentPdfPreview.filename);
    }
  }

  async function buildPdfFromCurrentPlan(){
    savePendingToBank('ui_make_pdf');
    const plan=getCurrentPlanForOutput('ui_make_pdf');
    const snapshot=buildKggPdfSnapshot(plan,state.largePdfMode?{layout:'large-single-row'}:null);
    await attachKggPdfExerciseThumbnails(snapshot,plan);
    window.KGGLatestPdfSnapshot=snapshot;
    let JsPdfCtor=null;
    try{JsPdfCtor=await ensureJsPdfForPdfTest();}catch(e){console.warn('KGG jsPDF Testloader:',e);}
    if(!JsPdfCtor){
      alert('jsPDF-Testeinbindung konnte nicht geladen werden. PDF wird lokal im Browser erzeugt, sobald jsPDF verfuegbar ist. Der aktuelle Plan-Snapshot wurde nur intern vorbereitet.');
      console.info('KGG PDF Snapshot Adapter:',snapshot);
      return snapshot;
    }
    const pdfMode=state.largePdfMode?'grossdruck':'standard';
    const doc=new JsPdfCtor({orientation:state.largePdfMode?'portrait':'landscape',unit:'mm',format:'a4'});
    const patientName=snapshot.patient&&snapshot.patient.displayName||snapshot.patient&&snapshot.patient.name||'patient';
    const safeName=String(patientName).replace(/[^a-z0-9äöüß_-]+/ig,'_').replace(/^_+|_+$/g,'')||'patient';
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\..+$/,'').replace('T','_');
    try{doc.setProperties({title:'KGG Trainingsplan '+safeName,subject:PDF_RUNTIME_FINGERPRINT+' '+pdfMode,creator:VERSION});}catch(e){}
    drawKggPdfLayoutV1(doc,snapshot);
    const filename='kgg_trainingsplan_'+safeName+'_'+VERSION+'_'+pdfMode+'_'+stamp+'.pdf';
    const blob=pdfBlobFromDoc(doc);
    if(!blob)doc.save(filename);

  function decodePatientPayloadFromHash(){
    const hash=String(location.hash||'');
    const publicMatch=hash.match(/^#KGGH2:(.+)$/i);
    if(publicMatch){
      try{return convertKggH2PayloadToPatientPayload(decodeKggJsonBase64Url(publicMatch[1]));}
      catch(err){console.warn('KGGH2 Patienten-Link konnte nicht gelesen werden:',err); return {error:true};}
    }
    const match=hash.match(/^#kgg=(.+)$/);
    if(!match)return null;
    try{
      const encoded=decodeURIComponent(match[1]).replace(/-/g,'+').replace(/_/g,'/');
      const padded=encoded+'='.repeat((4-encoded.length%4)%4);
      return JSON.parse(decodeURIComponent(escape(atob(padded))));
    }catch(err){
      console.warn('Patienten-Link konnte nicht gelesen werden:',err);
      return {error:true};
    }
  }
  function base64UrlToBytes(value){
    const text=String(value||'').replace(/-/g,'+').replace(/_/g,'/');
    const padded=text+'='.repeat((4-text.length%4)%4);
    const binary=atob(padded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return bytes;
  }
  function patientMediaDb(){

      req.onsuccess=()=>resolve(req.result);

  async function patientFetchEncryptedMedia(media){
    if(window.KGGPatientMediaFetchAdapter&&typeof window.KGGPatientMediaFetchAdapter.fetch==='function')return window.KGGPatientMediaFetchAdapter.fetch(media);
    if(!media.downloadUrl)throw new Error('Bild ist noch nicht bereit');
    const res=await fetch(media.downloadUrl,{cache:'no-store'});
    if(!res.ok)throw new Error('Bild konnte nicht geladen werden');
    return res.blob();

  async function patientDecryptMedia(media,encryptedBlob){
    if(!window.crypto||!crypto.subtle)throw new Error('Web Crypto nicht verfuegbar');
    const info=media.crypto||{};
    if(!info.key||!info.iv)throw new Error('Medienschluessel fehlt');
    const key=await crypto.subtle.importKey('raw',base64UrlToBytes(info.key),{name:'AES-GCM'},false,['decrypt']);
    const encrypted=await encryptedBlob.arrayBuffer();
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64UrlToBytes(info.iv)},key,encrypted);
    return new Blob([plain],{type:media.mime||'image/jpeg'});
  }

    const limit=Math.max(320,Number(maxSide)||2200);
    const scale=Math.min(1,limit/Math.max(1,srcW,srcH));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(srcW*scale));
    canvas.height=Math.max(1,Math.round(srcH*scale));
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(src.width*scale));
    canvas.height=Math.max(1,Math.round(src.height*scale));
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.fillStyle='#fff';

  function safeBase64JsonDecode(value){

  function safeJsonRepair(text){

    let start=-1,end=-1;
    if(firstArr>=0&&(firstObj<0||firstArr<firstObj)){start=firstArr;end=s.lastIndexOf(']');}
    else {start=firstObj;end=s.lastIndexOf('}');}
    if(start>=0&&end>start)s=s.slice(start,end+1);
    s=s.replace(/,\s*([}\]])/g,'$1');
    s=s.replace(/}\s*{/g,'},{').replace(/]\s*\[/g,'],[');

      try{return {ok:true,json:JSON.parse(candidate),source:candidate,repaired:candidate!==original};}

          setScanStatus(parsed.type==='KGGCFG2'?'QR erkannt: verschluesselter API-Key / Konfig-Transfer. Transfer-Code wird abgefragt ...':'QR erkannt: API-Key / Konfig-Transfer wird lokal gespeichert ...');

            scanState.jobs.splice(idx,1);
            scanState.activeIndex=Math.max(0,Math.min(scanState.activeIndex,scanState.jobs.length-1));
          }
          const ok=await applyKggConfigTransferParsed(parsed);
          return {type:ok?'configTransfer':'configTransferCancelled',json:parsed.json};
        }
        if(parsed&&(parsed.type==='KGGSYNC1'||parsed.type==='KGGSYNC2')){
          setScanStatus(parsed.type==='KGGSYNC2'?'QR erkannt: Sync-Verbindung mit Daten wird gelesen ...':'QR erkannt: Sync-Kopplung wird gespeichert ...');
          const idx=scanState.jobs.indexOf(job);

            scanState.jobs.splice(idx,1);
            scanState.activeIndex=Math.max(0,Math.min(scanState.activeIndex,scanState.jobs.length-1));
          }
          if(parsed.type==='KGGSYNC2'){
            await applyNativeSyncBundle(parsed.json);
            return {type:'syncBundle',json:parsed.json};
          }
          applyNativeSyncInvite(parsed.json);
          return {type:'syncInvite',json:parsed.json};
        }
        if(job.pages.length||job.result){job=scanNewJob('qr');}
        setScanStatus('QR erkannt: Patientenplan wird gelesen ...');
        job.type='qr';
        job.pages.push(scanFileMeta(file));

        job.pages.push(scanFileMeta(file));
        job.warnings.push('QR erkannt, aber nicht parsebar: '+(err&&err.message||err));

  async function processPaperJob(job){
    if(job.result&&job.type==='qr')return job.result;
    if(!job.pages.length)throw new Error(job.label+': keine Bilder.');
    const texts=[]; const raw=[]; const warnings=[];
    for(let i=0;i<job.pages.length;i++){
      const page=job.pages[i];
      if(!page.file){warnings.push('Bilddatei nicht mehr im Speicher: '+page.name); continue;}
      setScanStatus(job.label+': Seite '+(i+1)+' wird ausgelesen …');
      const result=await callGeminiPaperFallback(page.file);
      if(result.planText)texts.push(result.planText);
      raw.push(result.rawText||'');
      if(result.quality&&result.quality.warnings)warnings.push(...result.quality.warnings);
    }
    const planText=texts.join(', ').replace(/(?:,\s*){2,}/g,', ').trim();
    const quality=scanPaperQuality(planText,{raw});

  function scanSetsFromNumberSequence(nums,source){

    const metricUnit=scanUnitLabel(source&&source.unit||source&&source.metricUnit||source&&source.metric_unit,(source&&source.measure)==='Sek.'?'Sek.':'Wdh');
    const loadUnit=scanUnitLabel(source&&source.weightUnit||source&&source.loadUnit||source&&source.weight_unit,/sek|zeit|time/i.test(metricUnit)?'keine':'kg');
    const isTime=/zeit|sek|sec|min|time/i.test(metricUnit)||/keine/i.test(loadUnit);
    const pains=scanFindPainValues(source||{});
    const sets=[];
    if(side==='LR'&&values.length>=12){
      for(let i=0;i<3;i++){
        const b=i*4;
        sets.push({
          li:{load:scanValueToString(values[b]),metric:scanValueToString(values[b+1])},
          re:{load:scanValueToString(values[b+2]),metric:scanValueToString(values[b+3])},
          pain:scanValueToString(pains[i]||values[12+i]||'')

    }
    if(isTime){
      for(let i=0;i<3;i++){

        if(metric)sets.push({metric,pain:scanValueToString(pains[i]||'')});
      }
      return sets;
    }
    if(values.length>=9){
      for(let i=0;i<3;i++){
        const b=i*3;
        sets.push({load:scanValueToString(values[b]),metric:scanValueToString(values[b+1]),pain:scanValueToString(values[b+2]||pains[i]||'')});
      }
      return sets;
    }
    if(values.length>=6){
      for(let i=0;i<3;i++){

  function kggScanPlanExerciseToText(name,sets,source){

  function updateTabletLayoutHandle(){
    const handle=$('tabletLayoutResizeHandle'), app=document.querySelector('.app');
    if(!handle||!app||!isTabletLayout()){return;}
    const rect=app.getBoundingClientRect();
    const appStyle=getComputedStyle(app);
    const gap=parseFloat(appStyle.columnGap)||0;
    const visibleRect=el=>{
      if(!el)return null;
      const style=getComputedStyle(el);
      if(style.display==='none'||style.visibility==='hidden'||style.opacity==='0')return null;
      const r=el.getBoundingClientRect();
      return (r.width>2&&r.height>2)?r:null;
    };
    const gridFirstCol=()=>{
      const first=String(appStyle.gridTemplateColumns||'').trim().split(/\s+/)[0]||'';
      const px=parseFloat(first);
      return Number.isFinite(px)&&px>2?px:null;
    };
    const leftRects=[$('bankArea'),$('inputWrap'),$('scanHub'),document.querySelector('.scanHub')]
      .map(visibleRect)
      .filter(Boolean)
      .filter(r=>r.left>=rect.left-4&&r.right<=rect.right+4);
    const measuredLeftEdge=leftRects.length?Math.max(...leftRects.map(r=>r.right)):null;
    const cssLeft=gridFirstCol();
    const storedLeft=parseFloat(String(tabletLayoutState.leftCol||'').replace('px',''));
    const fallbackLeft=Number.isFinite(cssLeft)?cssLeft:(Number.isFinite(storedLeft)?storedLeft:Math.min(Math.max(rect.width*.42,360),660));
    const leftEdge=Number.isFinite(measuredLeftEdge)?measuredLeftEdge:rect.left+fallbackLeft;
    const rightRects=[$('rightPlanStack'),$('currentPlanBlock'),$('baseToggle'),$('recentToggle'),$('packageLayoutSlot')]
      .map(visibleRect)
      .filter(Boolean)
      .filter(r=>r.left>=leftEdge-12&&r.left<=rect.right+4);
    const rightEdge=rightRects.length?Math.min(...rightRects.map(r=>r.left)):Math.min(rect.right,rect.left+fallbackLeft+gap);
    const handleWidth=handle.getBoundingClientRect().width||58;
    const center=(rightEdge>leftEdge+2)?((leftEdge+rightEdge)/2):leftEdge+Math.max(0,gap/2);
    handle.style.left=Math.round(center-(handleWidth/2))+'px';
    handle.style.top=Math.round(rect.top+8)+'px';

  function positionTabletAnchoredOverlay(kind){
    if(!isTabletLayout())return false;
    const cfg=tabletPanelConfig(kind);
    if(!cfg)return false;
    const panel=$(cfg.panelId), anchor=$(cfg.anchorId), app=document.querySelector('.app');
    if(!panel||!anchor||!app||panel.classList.contains('hidden'))return false;
    const appRect=app.getBoundingClientRect();
    const anchorRect=anchor.getBoundingClientRect();
    const vv=window.visualViewport||null;
    const viewTop=vv?vv.offsetTop:0;
    const viewHeight=vv?vv.height:window.innerHeight;
    const viewBottom=viewTop+viewHeight;
    const margin=12;
    const availableWidth=Math.max(280,appRect.width-(margin*2));
    const minW=Math.min(cfg.minWidth||360,availableWidth);
    const maxW=Math.min(cfg.maxWidth||620,availableWidth);
    let width=clampNumber(Math.max(anchorRect.width,minW),minW,maxW);
    let left=(cfg.align==='right')?(anchorRect.right-width):anchorRect.left;
    left=clampNumber(left,appRect.left+margin,appRect.right-width-margin);

    panel.style.setProperty('--kgg-overlay-width',Math.round(width)+'px');
    panel.style.setProperty('--kgg-overlay-left',Math.round(left)+'px');
    panel.style.setProperty('--kgg-overlay-max-height','min(72vh,520px)');

    const measured=panel.getBoundingClientRect();
    const wantedHeight=Math.max(160,Math.min(measured.height||panel.scrollHeight||320,Math.min(520,viewHeight-(margin*2))));
    const belowTop=anchorRect.bottom+8;
    const aboveTop=anchorRect.top-wantedHeight-8;
    const enoughBelow=(belowTop+wantedHeight)<=Math.min(viewBottom-margin,appRect.bottom-margin);
    const enoughAbove=aboveTop>=Math.max(viewTop+margin,appRect.top+margin);
    let direction=cfg.preferred||'below';
    if(direction==='below'&&!enoughBelow&&enoughAbove)direction='above';
    if(direction==='above'&&!enoughAbove&&enoughBelow)direction='below';
    if(!enoughBelow&&!enoughAbove)direction=((anchorRect.top-appRect.top)>(appRect.bottom-anchorRect.bottom))?'above':'below';
    let top;
    let maxHeight;
    if(direction==='above'){
      maxHeight=Math.max(160,Math.min(520,anchorRect.top-Math.max(viewTop+margin,appRect.top+margin)-8));
      top=Math.max(viewTop+margin,anchorRect.top-Math.min(wantedHeight,maxHeight)-8);
    }else{
      top=belowTop;
      maxHeight=Math.max(160,Math.min(520,Math.min(viewBottom-margin,appRect.bottom-margin)-top));
    }
    top=clampNumber(top,viewTop+margin,Math.max(viewTop+margin,viewBottom-margin-120));

    panel.style.setProperty('--kgg-overlay-top',Math.round(top)+'px');
    panel.style.setProperty('--kgg-overlay-max-height',Math.round(maxHeight)+'px');

    document.body.classList.add('kggTabletOverlayActive');
    return true;

  function wrapKggQrPrintText(text,maxChars){
    const words=String(text||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
    const lines=[];
    let line='';
    words.forEach(word=>{
      if(word.length>maxChars){
        if(line){lines.push(line);line='';}
        for(let i=0;i<word.length;i+=maxChars)lines.push(word.slice(i,i+maxChars));
        return;
      }
      const next=line?line+' '+word:word;
      if(next.length>maxChars&&line){lines.push(line);line=word;}
      else line=next;
    });
    if(line)lines.push(line);
    return lines.length?lines:[''];
  }
  function buildKggAdminMenuQrPrintPdf(){
    const current=window.KGG_ADMIN_MENU_QR_CURRENT||{};
    const value=String(current.value||($('kggAdminMenuQrLink')&&$('kggAdminMenuQrLink').value)||'').trim();
    if(!value)throw new Error('missing_qr_value');
    const JsPdfCtor=findJsPdfConstructor();
    if(!JsPdfCtor)throw new Error('missing_pdf_runtime');
    if(typeof window.qrcode!=='function')throw new Error('missing_qr_runtime');
    const doc=new JsPdfCtor({orientation:'portrait',unit:'mm',format:'a4'});
    try{doc.setProperties({title:'KGG Kolleg:innen-App QR',subject:'KGG APK QR',creator:VERSION});}catch(e){}
    const title=String(current.title||'Kolleg:innen-App APK QR');
    const hint=String(current.hint||'QR-Code scannen oder Link oeffnen.');
    try{doc.setFont('helvetica','bold');}catch(e){}
    doc.setFontSize(18); doc.setTextColor(7,16,39); doc.text(title,16,20);
    try{doc.setFont('helvetica','normal');}catch(e){}
    doc.setFontSize(10); doc.setTextColor(80,94,112);
    wrapKggQrPrintText(hint,92).slice(0,3).forEach((line,index)=>doc.text(line,16,29+(index*5)));
    const qr=window.qrcode(0,'M');
    qr.addData(value);
    qr.make();
    const count=qr.getModuleCount();
    const size=124;
    const x=(210-size)/2;
    const y=48;
    const cell=size/count;
    doc.setDrawColor(225,231,239);
    doc.setFillColor(255,255,255);
    doc.rect(x-5,y-5,size+10,size+10,'F');
    doc.rect(x-5,y-5,size+10,size+10,'S');
    doc.setFillColor(0,0,0);
    for(let row=0;row<count;row++){
      for(let col=0;col<count;col++){
        if(qr.isDark(row,col))doc.rect(x+(col*cell),y+(row*cell),cell+.03,cell+.03,'F');
      }
    }
    doc.setFontSize(8); doc.setTextColor(52,64,84);
    wrapKggQrPrintText(value,92).slice(0,5).forEach((line,index)=>doc.text(line,16,188+(index*4.5)));
    doc.setFontSize(9); doc.setTextColor(102,112,133);
    doc.text('Keine Admin-Funktionen, keine API-Keys, keine Patientendaten.',16,222);
    const filename='kgg_kolleginnen_app_qr_'+new Date().toISOString().slice(0,10)+'.pdf';
    const blob=pdfBlobFromDoc(doc);
    if(!blob)throw new Error('missing_pdf_blob');
    return {blob,filename};
  }

  function installKggV383UiFlowStability(){
    let phoneTapSuppressUntil=0;

    const pointFromEvent=ev=>{
      const point=ev&&ev.touches&&ev.touches[0]||ev&&ev.changedTouches&&ev.changedTouches[0]||ev||{};
      return {x:Number(point.clientX)||0,y:Number(point.clientY)||0};
    };
    trackPhoneTouchStart=function(ev){
      if(!isPhoneLayout())return;
      const point=pointFromEvent(ev);
      phoneTapSuppressUntil=0;
      kggPhoneTouchStart={x:point.x,y:point.y,moved:false};
    };
    trackPhoneTouchMove=function(ev){
      if(!isPhoneLayout())return;
      const point=pointFromEvent(ev);
      if(kggPhoneTouchStart){
        const dx=Math.abs(point.x-kggPhoneTouchStart.x);
        const dy=Math.abs(point.y-kggPhoneTouchStart.y);
        if(dx>7||dy>7)kggPhoneTouchStart.moved=true;
      }
      if(kggPhoneTouchStart&&kggPhoneTouchStart.moved)markPhoneUserScrolling();
    };
    trackPhoneTouchEnd=function(){
      if(kggPhoneTouchStart&&kggPhoneTouchStart.moved){
        phoneTapSuppressUntil=Date.now()+170;

      return true;
    };
    initPhoneScrollGuard=function(){
      if(window.__kggPhoneScrollGuardBound)return;

      window.addEventListener('scroll',markPhoneUserScrolling,{passive:true});
      if(window.PointerEvent){
        document.addEventListener('pointerdown',ev=>{if(ev.pointerType==='touch')trackPhoneTouchStart(ev);},{passive:true});
        document.addEventListener('pointermove',ev=>{if(ev.pointerType==='touch')trackPhoneTouchMove(ev);},{passive:true});
        document.addEventListener('pointerup',ev=>{if(ev.pointerType==='touch')trackPhoneTouchEnd(ev);},{passive:true});
        document.addEventListener('pointercancel',ev=>{if(ev.pointerType==='touch')trackPhoneTouchEnd(ev);},{passive:true});
      }else{
        document.addEventListener('touchstart',trackPhoneTouchStart,{passive:true});

      input.addEventListener('input',()=>{phoneBankBrowseMode=false;document.body.classList.remove('kggPhoneDbBrowseMode');});
    }
    const oldApplySelectedExerciseToText=applySelectedExerciseToText;
    applySelectedExerciseToText=function(ex,options){
      const next={...(options||{})};
      if(isPhoneLayout()&&phoneBankBrowseMode)next.keepFocus=false;
      return oldApplySelectedExerciseToText(ex,next);
    };
    if($('bankToggle'))$('bankToggle').onclick=openOrCloseBankFromBrowseTap;
    if($('dbTitle')){
      $('dbTitle').onclick=openOrCloseBankFromBrowseTap;
      $('dbTitle').onkeydown=null;
      $('dbTitle').addEventListener('keydown',ev=>{
        if(ev.key==='Enter'||ev.key===' '){
          ev.preventDefault();
          ev.stopImmediatePropagation();
          openOrCloseBankFromBrowseTap(ev);
        }
      },true);
    }
    if($('baseToggle'))$('baseToggle').onclick=ev=>{
      if(guardPhoneScrollToggle(ev))return;
      const base=$('baseFields');
      const opening=base.classList.contains('hidden');
      if(isTabletLayout()){
        if(opening)openTabletAnchoredPanel('base'); else closeTabletAnchoredPanel('base');
      }else{
        base.classList.toggle('hidden',!opening);
        setTabletOverlayActiveFlag();
        updateToggleCarets();
      }
    };
    if($('recentToggle'))$('recentToggle').onclick=ev=>{
      if(guardPhoneScrollToggle(ev))return;
      const recent=$('recentList');
      const opening=recent.classList.contains('hidden');
      if(isTabletLayout()){
        if(opening)openTabletAnchoredPanel('recent'); else closeTabletAnchoredPanel('recent');
      }else{
        openPhoneFloatingDrawer('recent');
      }
    };
    const packageToggleBtn=$('packageToggle');
    if(packageToggleBtn)packageToggleBtn.onclick=ev=>{
      if(guardPhoneScrollToggle(ev))return;
      if(isTabletLayout())toggleTabletPackageOverlay();
      else openPhoneFloatingDrawer('package');
    };
    const modalClosers={
      editorModal:typeof closeEditor==='function'?closeEditor:null,
      shareModal:typeof closeFinishModal==='function'?closeFinishModal:null,
      largePdfModal:typeof closeLargePdfModal==='function'?closeLargePdfModal:null,
      longMediaConfirmModal:typeof closeLongMediaConfirmModal==='function'?closeLongMediaConfirmModal:null,
      adminSecretsModal:typeof closeAdminSecretsModal==='function'?closeAdminSecretsModal:null,
      sharedBankModal:typeof closeSharedBankModal==='function'?closeSharedBankModal:null,
      syncPairModal:typeof closeSyncPairModal==='function'?closeSyncPairModal:null
    };
    document.querySelectorAll('.modal').forEach(modal=>{
      if(modal.dataset.kggV383BackdropBound==='1')return;
      modal.dataset.kggV383BackdropBound='1';
      modal.addEventListener('pointerup',ev=>{
        if(ev.target!==modal)return;
        ev.preventDefault();
        ev.stopPropagation();

        if(typeof close==='function')close();
        else modal.classList.remove('open');
      });
    });
    const adminQrModal=$('kggAdminMenuQrModal');
    if(adminQrModal&&!adminQrModal.dataset.kggV383BackdropBound){
      adminQrModal.dataset.kggV383BackdropBound='1';
      adminQrModal.addEventListener('pointerup',ev=>{
        if(ev.target!==adminQrModal)return;
        ev.preventDefault();
        if(typeof closeKggAdminMenuQrModal==='function')closeKggAdminMenuQrModal();
      });
    }
    const oldApplyNativeSyncInvite=applyNativeSyncInvite;
    applyNativeSyncInvite=function(invite){
      setScanStatus('QR erkannt: Sync-Kopplung wird gelesen ...');
      try{
        const entry=oldApplyNativeSyncInvite(invite);
        const peers=syncPeerDisplayEntries().length;
        setScanStatus('Sync-Kopplung gespeichert. Dieses Geraet liest und schreibt im Sync-Raum. '+(peers?'Anderes Geraet gefunden: Synchronisation aktiv.':'Warte auf weitere Geraete mit diesem QR.'));
        return entry;
      }catch(err){
        setScanStatus('Fehler: ungueltige Sync-Daten.');
        throw err;
      }
    };
    const oldApplyNativeSyncBundle=applyNativeSyncBundle;
    applyNativeSyncBundle=async function(bundle){
      setScanStatus('QR erkannt: Sync-Datenpaket wird gelesen ...');
      try{
        const result=await oldApplyNativeSyncBundle(bundle);
        const peers=syncPeerDisplayEntries().length;
        setScanStatus('Sync-Datenpaket gespeichert. Verbindung und Daten wurden lokal uebernommen. '+(peers?'Synchronisation aktiv.':'Warte auf weitere Geraete mit diesem QR.'));
        return result;
      }catch(err){
        setScanStatus('Fehler: Sync-Verbindung nicht moeglich.');
        throw err;
      }
    };
  }
  function installKggV388AndroidFlowFixes(){
    let lastTabletMenuToggleAt=0;
    const menu=tabletMenuBtn;
    const toggle=ev=>{
      if(!isTabletLayout())return;
      const now=Date.now();
      if(now-lastTabletMenuToggleAt<220){
        if(ev){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();}
        return;
      }
      lastTabletMenuToggleAt=now;
      if(ev){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();}
      setTabletSideMenuOpen(!document.body.classList.contains('tabletMenuOpen'));
    };
    const isMenuHit=ev=>{
      if(!menu||!ev)return false;
      const point=ev.touches&&ev.touches[0]?ev.touches[0]:ev;
      const r=menu.getBoundingClientRect();
      const pad=10;
      return point.clientX>=r.left-pad&&point.clientX<=r.right+pad&&point.clientY>=r.top-pad&&point.clientY<=r.bottom+pad;
    };
    if(menu&&menu.dataset.kggV388MenuBound!=='1'){
      menu.dataset.kggV388MenuBound='1';
      menu.addEventListener('pointerdown',toggle,{capture:true});
      menu.addEventListener('click',toggle,{capture:true});
      menu.addEventListener('touchstart',toggle,{capture:true,passive:false});
      menu.addEventListener('keydown',ev=>{
        if(ev.key!=='Enter'&&ev.key!==' ')return;
        toggle(ev);
      },true);
      document.addEventListener('pointerdown',ev=>{
        if(!isTabletLayout()||!isMenuHit(ev))return;
        toggle(ev);
      },true);
      document.addEventListener('touchstart',ev=>{
        if(!isTabletLayout()||!isMenuHit(ev))return;
        toggle(ev);
      },{capture:true,passive:false});
    }
    const close=tabletMenuClose;
    if(close&&close.dataset.kggV388MenuBound!=='1'){
      close.dataset.kggV388MenuBound='1';
      close.addEventListener('click',ev=>{ev.preventDefault();setTabletSideMenuOpen(false);},{capture:true});
    }
    const backdrop=tabletSideBackdrop;
    if(backdrop&&backdrop.dataset.kggV388MenuBound!=='1'){
      backdrop.dataset.kggV388MenuBound='1';
      backdrop.addEventListener('click',ev=>{ev.preventDefault();setTabletSideMenuOpen(false);},{capture:true});
    }
  }
  /* KGG_LOGIC_SMOKE_BOOT_BOUNDARY */
  installKggV383UiFlowStability();
  installKggV388AndroidFlowFixes();
  load(); initLargePdfMode(); renderRuntimeVersionInUi(); renderBuildIdentityInUi(); setTimeout(renderBuildIdentityInUi,500); initPwaAndUpdates(); initAdminModeAccess(); initTabletSoftKeyboardLayout(); initPhoneKeyboardAndDrawers(); initTabletLayoutControls(); initNativeExerciseBankSync(); ensureKGGDataStore().init({appVersion:VERSION}); syncStatePlanToStore('app_init_after_load'); if(state.patient.name) $('patientName').value=state.patient.name; if(state.patient.date) $('planDate').value=state.patient.date; if(state.patient.therapist) $('therapistName').value=state.patient.therapist; if(state.patient.notes) $('planNotes').value=state.patient.notes; syncTextInputFromPlan('app_init_text_master'); render(); setTabletOverlayActiveFlag(); tryApplyKggSetupFromHash().catch(err=>{console.warn('Therapeuten-Setup konnte nicht uebernommen werden:',err);});
})();
