<script id="kgg-v102-phone-cockpit-dock-navigation">
(function(){
  "use strict";
  const PATCH_ID="kgg-v102-phone-cockpit-dock-navigation";

  function countSlots(){try{var state=api&&api.getState?api.getState():{};return Number.isFinite(Number(state&&state.slotCount))?Math.max(0,Math.min(3,Number(state.slotCount))):Array.isArray(state&&state.slots)?state.slots.filter(Boolean).length:0;}catch(error){return 0;}}

    if(!cameraButton){cameraButton=document.getElementById("kggPhoneCockpitCamera");if(!cameraButton){cameraButton=document.createElement("button");cameraButton.type="button";cameraButton.id="kggPhoneCockpitCamera";cameraButton.hidden=true;cameraButton.setAttribute("aria-label","Trainingsplan mit der Kamera scannen");cameraButton.setAttribute("title","Trainingsplan scannen");cameraButton.textContent="📷";dock.appendChild(cameraButton);cameraButton.addEventListener("click",function(){var scan=document.getElementById("scanBtn");if(scan)scan.click();else if(window.KGGScan&&typeof window.KGGScan.pick==="function")window.KGGScan.pick("camera");});}}
    if(!saveAllButton){saveAllButton=document.getElementById("kggPhoneCockpitSaveAll");if(!saveAllButton){saveAllButton=document.createElement("button");saveAllButton.type="button";saveAllButton.id="kggPhoneCockpitSaveAll";saveAllButton.hidden=true;saveAllButton.textContent="Alle Pläne speichern";saveAllButton.setAttribute("aria-label","Alle Cockpit-Pläne speichern");dock.appendChild(saveAllButton);saveAllButton.addEventListener("click",function(){var target=document.querySelector('#kggTherapyCockpitRoot [data-tc-action="finish-all"]');if(target)target.click();});}}

      if(saveAllButton){if(saveAllButton.parentElement!==dock)dock.appendChild(saveAllButton);saveAllButton.hidden=false;}

      if(finishButton&&!finishButton.classList.contains("hidden")){if(finishButton.parentElement!==dock)dock.appendChild(finishButton);finishButton.setAttribute("aria-label","Plan abschließen");}

  }
