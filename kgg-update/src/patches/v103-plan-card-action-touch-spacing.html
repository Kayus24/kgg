<!-- KGG PATCH START kgg-v103-plan-card-action-touch-spacing -->
<!-- Normaler Plan: lesbare schmale Karten; vorhandene Edit/Drag/Swipe-Handler bleiben unveraendert. -->
<style id="kgg-v103-plan-card-action-touch-spacing-style">
  @media (max-width:759px){
    #currentPlanBlock #planList .planCard{
      display:grid!important;
      grid-template-columns:minmax(0,1fr)!important;
      grid-template-rows:auto auto!important;
      gap:4px!important;
      align-items:start!important;
      min-height:0!important;
      padding:8px 10px!important;
    }
    #currentPlanBlock #planList .planCard .planMain{
      grid-column:1!important;
      grid-row:1!important;
      box-sizing:border-box!important;
      width:100%!important;
      min-width:0!important;
      min-height:44px!important;
      padding-right:44px!important;
      align-items:flex-start!important;
      gap:6px!important;
    }
    #currentPlanBlock #planList .planCard .drag{
      flex:0 0 44px!important;
      width:44px!important;
      min-width:44px!important;
      height:44px!important;
      min-height:44px!important;
    }
    #currentPlanBlock #planList .planCard .planThumb{
      width:34px!important;
      min-width:34px!important;
      height:34px!important;
      min-height:34px!important;
    }
    #currentPlanBlock #planList .planCard .planText{
      flex:1 1 auto!important;
      min-width:0!important;
      max-width:100%!important;
    }
    #currentPlanBlock #planList .planCard .planText b{
      display:grid!important;
      grid-template-columns:auto minmax(0,1fr)!important;
      align-items:start!important;
      gap:2px 4px!important;
      min-width:0!important;
      white-space:normal!important;
    }
    #currentPlanBlock #planList .planCard .planIndex{
      grid-column:1!important;
      grid-row:1!important;
    }
    #currentPlanBlock #planList .planCard .planName{
      grid-column:2!important;
      grid-row:1!important;
      min-width:0!important;
      display:-webkit-box!important;
      -webkit-box-orient:vertical!important;
      -webkit-line-clamp:2!important;
      line-clamp:2;
      white-space:normal!important;
      overflow:hidden!important;
      overflow-wrap:anywhere!important;
      word-break:normal!important;
      text-overflow:clip!important;
    }
    #currentPlanBlock #planList .planCard .planBadges{
      grid-column:2!important;
      grid-row:2!important;
      min-width:0!important;
    }
    #currentPlanBlock #planList .planCard .planBadges:empty{
      display:none!important;
    }
    #currentPlanBlock #planList .planCard:has(.planThumb img) .planBadge.media{
      display:none!important;
    }
    #currentPlanBlock #planList .planCard .planMetaLine{
      display:-webkit-box!important;
      -webkit-box-orient:vertical!important;
      -webkit-line-clamp:2!important;
      line-clamp:2;
      white-space:normal!important;
      overflow:hidden!important;
      text-overflow:clip!important;
      overflow-wrap:anywhere!important;
    }
    #currentPlanBlock #planList .planCard .planCardActions{
      position:static!important;
      inset:auto!important;
      grid-column:1!important;
      grid-row:2!important;
      display:flex!important;
      justify-content:flex-end!important;
      align-items:center!important;
      min-height:44px!important;
      width:auto!important;
      padding:0!important;
      gap:8px!important;
      pointer-events:auto!important;
    }
    #currentPlanBlock #planList .planCard .planCardActions [data-planedit]{
      box-sizing:border-box!important;
      flex:0 0 44px!important;
      width:44px!important;
      min-width:44px!important;
      height:44px!important;
      min-height:44px!important;
      padding:0!important;
    }
    #currentPlanBlock #planList .planCard .planDeleteBtn{
      position:absolute!important;
      top:4px!important;
      right:4px!important;
      left:auto!important;
      box-sizing:border-box!important;
      width:44px!important;
      min-width:44px!important;
      height:44px!important;
      min-height:44px!important;
      padding:0!important;
    }
  }
</style>
