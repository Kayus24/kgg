<style id="kgg-v130-plan-card-height-stability-style">

    body.kggTcTabletSplit.kggTcSlots2.kggTcMainPaneCompact:not(.kggTcMainPaneVeryCompact) .app #currentPlanBlock #planList .planCard{
      min-height:84px!important;
    }
  }
</style>
