<!-- KGG PATCH START kgg-v106-phone-cockpit-action-dock -->
<style id="kgg-v106-phone-cockpit-action-dock-style">
  #kggPhoneCockpitDock #kggPhoneCockpitCamera[hidden],
  #kggPhoneCockpitDock #kggPhoneCockpitSaveAll[hidden]{display:none!important;}
  @media(max-width:759px){
    body:has(.modal.open) #kggPhoneCockpitDock,
    body:has(.kgg-tc-modal:not([hidden])) #kggPhoneCockpitDock{display:none!important;}
    body.kggPhoneHasCockpit #kggSharedUndoToast{bottom:calc(76px + env(safe-area-inset-bottom,0px));}
  }
</style>
<script id="kgg-v106-phone-cockpit-action-dock">
(function(){
  "use strict";
  var PATCH_ID="kgg-v106-phone-cockpit-action-dock";
  function install(){
    window.KGG_PATCHES=window.KGG_PATCHES||{};
    window.KGG_PATCHES[PATCH_ID]={
      installed:!!(document.getElementById("kggPhoneCockpitDock")&&document.getElementById("kggPhoneCockpitCamera")&&document.getElementById("kggPhoneCockpitSaveAll")),
      version:1,dependsOn:"kgg-v102-phone-cockpit-dock-navigation",
      contract:"normal: existing Cockpit and Finish buttons; cockpit: Back, camera and save-all through existing hooks; modal actions and undo stay reachable"
    };
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",install,{once:true});else install();
})();
</script>
<!-- KGG PATCH END kgg-v106-phone-cockpit-action-dock -->
