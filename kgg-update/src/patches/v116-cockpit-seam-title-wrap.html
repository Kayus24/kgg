<!-- KGG PATCH START kgg-v116-cockpit-seam-title-wrap -->
<!-- Cockpit Trennkante ohne Titelsprung -->
<style id="kgg-v116-cockpit-seam-title-wrap-style">
@media(min-width:760px){
  body.kggTcMainPanePhone.kggTcSeamDragging .app #createPanel #panelTitle{width:var(--kgg-seam-title-width)!important;max-width:var(--kgg-seam-title-width)!important;}
}
</style>
<script id="kgg-v116-cockpit-seam-title-wrap">
(function(){
  "use strict";
  function install(){
    var button=document.getElementById("kggTherapyCockpitButton");
    if(!button){setTimeout(install,50);return;}
    button.addEventListener("pointerdown",function(){
      var title=document.getElementById("panelTitle");
      if(title&&document.body.classList.contains("kggTcMainPanePhone"))document.body.style.setProperty("--kgg-seam-title-width",title.getBoundingClientRect().width+"px");
    });
    for(var name of ["pointerup","pointercancel","lostpointercapture"]){button.addEventListener(name,function(){document.body.style.removeProperty("--kgg-seam-title-width");});}
    window.KGG_PATCHES=window.KGG_PATCHES||{};
    window.KGG_PATCHES["kgg-v116-cockpit-seam-title-wrap"]={installed:true,version:1,contract:"the main phone title retains its starting wrap while the seam cover expands; release and cancellation restore responsive sizing"};
  }
  install();
})();
</script>
<!-- KGG PATCH END kgg-v116-cockpit-seam-title-wrap -->
