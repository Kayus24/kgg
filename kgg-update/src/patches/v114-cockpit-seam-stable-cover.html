<!-- KGG PATCH START kgg-v114-cockpit-seam-stable-cover -->
<!-- Cockpit Trennkante ohne Leerstreifen -->
<style id="kgg-v114-cockpit-seam-stable-cover-style">
@media(min-width:760px){
  body.kggTherapyCockpitOpen.kggTcTabletSplit #kggTherapyCockpitRoot{padding-left:0!important;}
  body.kggTherapyCockpitOpen.kggTcTabletSplit.kggTcSeamDragging .app.app{display:var(--kgg-main-cover-display,grid)!important;}
}
</style>
<script id="kgg-v114-cockpit-seam-stable-cover">
(function(){
  "use strict";
  function install(){
  var button=document.getElementById("kggTherapyCockpitButton");
  if(!button){setTimeout(install,50);return;}
    button.addEventListener("pointerdown",function(){var app=document.querySelector(".app");if(app&&matchMedia("(min-width:760px)").matches&&document.body.classList.contains("kggTherapyCockpitOpen")){var display=getComputedStyle(app).display;document.body.style.setProperty("--kgg-main-cover-display",display==="none"?"grid":display);}});
    for(var name of ["pointerup","pointercancel","lostpointercapture"]){button.addEventListener(name,function(){document.body.style.removeProperty("--kgg-main-cover-display");});}
  window.KGG_PATCHES=window.KGG_PATCHES||{};
  window.KGG_PATCHES["kgg-v114-cockpit-seam-stable-cover"]={installed:!!button,version:1,contract:"Cockpit seam has no reserved empty stripe; cover drag retains the current main-pane display model and existing cancellation/return hooks"};
  }
  install();
})();
</script>
<!-- KGG PATCH END kgg-v114-cockpit-seam-stable-cover -->
