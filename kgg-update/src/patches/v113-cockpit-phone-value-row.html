<!-- KGG PATCH START kgg-v113-cockpit-phone-value-row -->
<!-- Cockpit Wertezeile auf Smartphone -->
<style id="kgg-v113-cockpit-phone-value-row-style">
@media(max-width:759px){
  #kggTherapyCockpitRoot .kgg-tc-values-head,
  #kggTherapyCockpitRoot .kgg-tc-set-row{grid-template-columns:34px minmax(0,1.08fr) minmax(44px,.96fr) minmax(44px,.96fr)!important;column-gap:4px!important;}
  #kggTherapyCockpitRoot .kgg-tc-values-head{font-size:12px!important;letter-spacing:0!important;}
  #kggTherapyCockpitRoot .kgg-tc-values-head span:nth-child(3){grid-column:3/5!important;}
  #kggTherapyCockpitRoot .kgg-tc-set-no{grid-column:1!important;grid-row:1!important;}
  #kggTherapyCockpitRoot .kgg-tc-prev{grid-column:2!important;grid-row:1!important;font-size:12px!important;min-height:44px!important;padding:3px 2px!important;}
  #kggTherapyCockpitRoot .kgg-tc-field[data-tc-field="load"]{grid-column:3!important;grid-row:1!important;}
  #kggTherapyCockpitRoot .kgg-tc-field[data-tc-field="metric"]{grid-column:4!important;grid-row:1!important;}
  #kggTherapyCockpitRoot .kgg-tc-field{min-height:44px!important;padding:4px 2px!important;align-self:stretch!important;display:flex!important;flex-direction:column!important;justify-content:center!important;}
  #kggTherapyCockpitRoot .kgg-tc-field::after{content:attr(aria-label);display:block;margin-top:2px;color:#607086;font:500 12px/1.1 system-ui,sans-serif;}
  #kggTherapyCockpitRoot .kgg-tc-set-row>.kgg-tc-pad{grid-column:2/5!important;grid-row:2!important;min-width:0!important;}
  #kggTherapyCockpitRoot .kgg-tc-key,#kggTherapyCockpitRoot .kgg-tc-pad-mode{min-height:44px!important;}
}
@media(max-width:359px){
  #kggTherapyCockpitRoot .kgg-tc-pad-keys{grid-template-columns:repeat(3,minmax(44px,1fr))!important;}
}
</style>
<script id="kgg-v113-cockpit-phone-value-row">
(function(){
  "use strict";
  window.KGG_PATCHES=window.KGG_PATCHES||{};
  window.KGG_PATCHES["kgg-v113-cockpit-phone-value-row"]={installed:true,version:1,contract:"phone set number, previous pair and both today values stay in one row; existing inline keypad spans beneath it and units use existing accessible field labels"};
})();
</script>
<!-- KGG PATCH END kgg-v113-cockpit-phone-value-row -->
