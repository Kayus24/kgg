<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KGG UI Lab real bridge fixture</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #f8fafc; color: #0f172a; }
    main { max-width: 42rem; padding: 2rem; background: white; border: 1px solid #cbd5e1; border-radius: 1rem; }
    button { min-height: 44px; padding: .7rem 1rem; border-radius: .6rem; border: 1px solid #334155; background: #e2e8f0; }
    [data-kgg-state] { display: block; margin: 1rem 0; padding: .75rem; border-radius: .5rem; background: #e0f2fe; }
  </style>
</head>
<body data-kgg-state="admin-ready">
  <main>
    <h1>KGG synthetic browser fixture</h1>
    <p data-kgg-state="admin-ready" id="kgg-state">admin-ready</p>
    <button type="button" data-kgg-action="tablet-splitter-control" id="kgg-action">Apply bounded UI action</button>
    <button type="button" data-kgg-action="synthetic-qr-image" id="kgg-qr">Open synthetic preview link</button>
  </main>
  <script>
    const state = document.getElementById('kgg-state');
    const action = document.getElementById('kgg-action');
    const qr = document.getElementById('kgg-qr');
    const params = new URLSearchParams(location.search);
    const flow = params.get('flow');
    const drift = params.get('drift') === '1';
    if (flow === 'pilot') {
      document.body.dataset.kggState = 'pilot-area-ready';
      state.dataset.kggState = 'pilot-area-ready';
      state.textContent = 'pilot-area-ready';
    } else if (flow === 'qr') {
      document.body.dataset.kggState = 'admin-preview-ready';
      state.dataset.kggState = 'admin-preview-ready';
      state.textContent = 'admin-preview-ready';
    }
    if (drift) {
      action.dataset.kggAction = 'drifted-control';
      action.textContent = 'Drifted control (visual fallback required)';
    }
    action.addEventListener('click', () => {
      document.body.dataset.kggState = 'scale-drag-state';
      state.dataset.kggState = 'scale-drag-state';
      state.textContent = 'scale-drag-state';
      action.textContent = 'Action applied';
    });
    qr.addEventListener('click', () => {
      document.body.dataset.kggState = 'linked-preview-ready';
      state.dataset.kggState = 'linked-preview-ready';
      state.textContent = 'linked-preview-ready';
      qr.textContent = 'Preview link opened';
    });
  </script>
</body>
</html>
