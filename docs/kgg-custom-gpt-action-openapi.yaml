openapi: 3.1.0
info:
  title: KGG Public Live Context
  version: 1.3.0
  description: Read-only live Admin and limited Patient-App context. All writes use the separate authenticated API Action.
servers:
  - url: https://raw.githubusercontent.com
security: []
paths:
  /Kayus24/kgg/main/docs/kgg-custom-gpt-resource-manifest.json:
    get:
      operationId: getKggCustomGptResourceManifest
      summary: Get current GPT resource, Action, model and Knowledge hashes.
      responses:
        "200":
          description: GPT resource manifest.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/main/docs/kgg-gpt-context.md:
    get:
      operationId: getKggProjectContext
      summary: Get generated Admin live repository context.
      responses:
        "200":
          description: Admin live context.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-custom-gpt-playbook.md:
    get:
      operationId: getKggCustomGptPlaybook
      summary: Get current Admin Update-Agent playbook.
      responses:
        "200":
          description: Admin playbook.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-custom-gpt-action-schema.md:
    get:
      operationId: getKggCustomGptActionSchema
      summary: Get the canonical guarded payload and approval contract.
      responses:
        "200":
          description: Action contract.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-custom-gpt-negative-examples.md:
    get:
      operationId: getKggCustomGptNegativeExamples
      summary: Get current unsafe-pattern examples.
      responses:
        "200":
          description: Negative examples.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-custom-gpt-preview-runbook.md:
    get:
      operationId: getKggCustomGptPreviewRunbook
      summary: Get exact Preview dispatch and verification sequence.
      responses:
        "200":
          description: Preview runbook.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-custom-gpt-preview-report-template.md:
    get:
      operationId: getKggCustomGptPreviewReportTemplate
      summary: Get evidence fields required for Preview reporting.
      responses:
        "200":
          description: Preview report template.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-gpt-bug-lessons.md:
    get:
      operationId: getKggBugLessons
      summary: Get durable KGG bug lessons.
      responses:
        "200":
          description: Bug lessons.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-gpt-bug-index.json:
    get:
      operationId: getKggBugIndex
      summary: Get compact bug-history routing index.
      responses:
        "200":
          description: Bug index.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/main/docs/kgg-gpt-patch-patterns.md:
    get:
      operationId: getKggPatchPatterns
      summary: Get accepted and rejected patch patterns.
      responses:
        "200":
          description: Patch patterns.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-gpt-area-routes.md:
    get:
      operationId: getKggAreaRoutes
      summary: Get human-readable Admin source routing.
      responses:
        "200":
          description: Area routes.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-gpt-area-routes.json:
    get:
      operationId: getKggAreaRoutesJson
      summary: Get structured Admin source routing.
      responses:
        "200":
          description: Structured area routes.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/main/docs/kgg-gpt-source-index.json:
    get:
      operationId: getKggSourceIndex
      summary: Get current Admin source chunk index and hashes.
      responses:
        "200":
          description: Admin source index.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/main/docs/kgg-gpt-source/{chunk_name}:
    get:
      operationId: getKggSourceChunk
      summary: Get one Admin source chunk selected by the source index.
      parameters:
        - name: chunk_name
          in: path
          required: true
          schema: {type: string, pattern: "^chunk-[0-9]{3}\\.md$"}
      responses:
        "200":
          description: Admin source chunk.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/kgg-update/version.json:
    get:
      operationId: getKggVersion
      summary: Get current generated Admin source version and hash.
      responses:
        "200":
          description: Admin version.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/main/therapist-app/android_update_manifest.json:
    get:
      operationId: getKggAndroidManifest
      summary: Get current Admin and Android release manifest.
      responses:
        "200":
          description: Android release manifest.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/gpt-preview/previews/index.json:
    get:
      operationId: getKggPreviewIndex
      summary: Get current Admin Test-App Preview index.
      responses:
        "200":
          description: Admin Preview index.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/gpt-preview/previews/{request_id}/meta.json:
    get:
      operationId: getKggPreviewMeta
      summary: Get exact Admin Preview metadata.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{5,63}$"}
      responses:
        "200":
          description: Admin Preview metadata.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/main/docs/kgg-patient-gpt-context.md:
    get:
      operationId: getKggPatientContextForAdmin
      summary: Read Patient-App interface and release context for cross-app diagnosis.
      responses:
        "200":
          description: Patient live context.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-patient-custom-gpt-playbook.md:
    get:
      operationId: getKggPatientPlaybookForAdmin
      summary: Read Patient-App ownership and interface rules before cross-app work.
      responses:
        "200":
          description: Patient playbook.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-patient-custom-gpt-action-schema.md:
    get:
      operationId: getKggPatientActionContractForAdmin
      summary: Read the Patient Preview payload contract.
      responses:
        "200":
          description: Patient action contract.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg/main/docs/kgg-patient-gpt-source-index.json:
    get:
      operationId: getKggPatientSourceIndexForAdmin
      summary: Route limited cross-app analysis to current Patient source chunks.
      responses:
        "200":
          description: Patient source index.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg/main/docs/kgg-patient-gpt-source/{chunk_name}:
    get:
      operationId: getKggPatientSourceChunkForAdmin
      summary: Read one Patient source chunk selected by the Patient source index.
      parameters:
        - name: chunk_name
          in: path
          required: true
          schema: {type: string, pattern: "^chunk-[0-9]{3}\\.md$"}
      responses:
        "200":
          description: Patient source chunk.
          content:
            text/plain:
              schema: {type: string}
  /Kayus24/kgg-patient-preview/main/previews/index.json:
    get:
      operationId: getKggPatientPreviewIndexForAdmin
      summary: Read the isolated Patient-App Preview index.
      responses:
        "200":
          description: Patient Preview index.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /Kayus24/kgg-patient-preview/main/previews/{patient_request_id}/meta.json:
    get:
      operationId: getKggPatientPreviewMetaForAdmin
      summary: Read one coordinated Patient-App Preview result.
      parameters:
        - name: patient_request_id
          in: path
          required: true
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{5,63}$"}
      responses:
        "200":
          description: Patient Preview metadata.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
