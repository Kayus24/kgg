openapi: 3.1.0
info:
  title: KGG Blind Repair Lab Source
  version: "1.2.0"
  description: Read-only access to sanitized broken full-app and natural-language UI challenges. Golden source, canonical intent, assertions and sample repairs are intentionally unavailable.
servers:
  - url: https://raw.githubusercontent.com
paths:
  /Kayus24/kgg/gpt-repair-lab/index.json:
    get:
      operationId: getKggRepairLabIndex
      summary: Get the current blind Repair-Lab round and opaque challenge ids.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Sanitized challenge index.
  /Kayus24/kgg/gpt-repair-lab/challenges/{challenge_id}/challenge.json:
    get:
      operationId: getKggRepairChallenge
      summary: Get symptoms, expected visible behavior and payload contract for one challenge.
      x-openai-isConsequential: false
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^repair-[a-f0-9]{16}$"
      responses:
        "200":
          description: Sanitized challenge manifest.
  /Kayus24/kgg/gpt-repair-lab/challenges/{challenge_id}/source/index.json:
    get:
      operationId: getKggRepairSourceIndex
      summary: List exact chunks of the broken full Admin HTML.
      x-openai-isConsequential: false
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^repair-[a-f0-9]{16}$"
      responses:
        "200":
          description: Broken-source chunk index.
  /Kayus24/kgg/gpt-repair-lab/challenges/{challenge_id}/source/{chunk_file}:
    get:
      operationId: getKggRepairSourceChunk
      summary: Read one exact chunk of broken Admin HTML.
      x-openai-isConsequential: false
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^repair-[a-f0-9]{16}$"
        - name: chunk_file
          in: path
          required: true
          schema:
            type: string
            pattern: "^chunk-[0-9]{3}\\.txt$"
      responses:
        "200":
          description: Exact broken-source text chunk.
  /Kayus24/kgg/gpt-repair-lab/results/{round_id}/{challenge_id}/{request_id}.json:
    get:
      operationId: getKggRepairResult
      summary: Read one sanitized evaluator outcome after its workflow run completed.
      description: Contains only status, safe error class and feedback. It never exposes golden source, hidden assertions or sample repairs.
      x-openai-isConsequential: false
      parameters:
        - name: round_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{5,63}$"
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^repair-[a-f0-9]{16}$"
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{5,63}$"
      responses:
        "200":
          description: Sanitized evaluation outcome.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /Kayus24/kgg/gpt-natural-ui-lab/index.json:
    get:
      operationId: getKggNaturalUiLabIndex
      summary: Get the current blind natural-language UI round and opaque challenge ids.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Sanitized natural-language challenge index.
  /Kayus24/kgg/gpt-natural-ui-lab/challenges/{natural_challenge_id}/challenge.json:
    get:
      operationId: getKggNaturalUiChallenge
      summary: Get one noisy user request, screenshot metadata and submission contract.
      x-openai-isConsequential: false
      parameters:
        - name: natural_challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^natural-[a-f0-9]{16}$"
      responses:
        "200":
          description: Solution-free natural-language challenge manifest.
  /Kayus24/kgg/gpt-natural-ui-lab/challenges/{natural_challenge_id}/marked-problem.png:
    get:
      operationId: getKggNaturalUiScreenshot
      summary: Get the marked screenshot for one natural-language UI challenge.
      x-openai-isConsequential: false
      parameters:
        - name: natural_challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^natural-[a-f0-9]{16}$"
      responses:
        "200":
          description: Marked problem screenshot.
          content:
            image/png:
              schema:
                type: string
                format: binary
  /Kayus24/kgg/gpt-natural-ui-lab/challenges/{natural_challenge_id}/source/index.json:
    get:
      operationId: getKggNaturalUiSourceIndex
      summary: List exact chunks of the damaged full Admin HTML.
      x-openai-isConsequential: false
      parameters:
        - name: natural_challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^natural-[a-f0-9]{16}$"
      responses:
        "200":
          description: Damaged-source chunk index.
  /Kayus24/kgg/gpt-natural-ui-lab/challenges/{natural_challenge_id}/source/{natural_chunk_file}:
    get:
      operationId: getKggNaturalUiSourceChunk
      summary: Read one exact damaged-source chunk.
      x-openai-isConsequential: false
      parameters:
        - name: natural_challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^natural-[a-f0-9]{16}$"
        - name: natural_chunk_file
          in: path
          required: true
          schema:
            type: string
            pattern: "^chunk-[0-9]{3}\\.txt$"
      responses:
        "200":
          description: Exact damaged-source text chunk.
  /Kayus24/kgg/gpt-natural-ui-lab/results/{natural_round_id}/{natural_challenge_id}/{natural_request_id}.json:
    get:
      operationId: getKggNaturalUiResult
      summary: Read one sanitized natural-language evaluator outcome.
      description: Contains scores, safe error class and compact feedback, never canonical intent, clean source, assertions or sample repairs.
      x-openai-isConsequential: false
      parameters:
        - name: natural_round_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{5,63}$"
        - name: natural_challenge_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^natural-[a-f0-9]{16}$"
        - name: natural_request_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{5,63}$"
      responses:
        "200":
          description: Sanitized natural-language evaluation outcome.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
components:
  schemas: {}
