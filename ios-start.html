<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KGG Plan"><title>KGG Plan</title><style>body{margin:0;background:#f4f7fb;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{max-width:680px;margin:auto;padding:18px}.card{background:white;border:1px solid #dbe3ef;border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 10px 28px #0f172a12}.btn{display:block;margin-top:12px;padding:14px;border-radius:14px;background:#111827;color:white;text-align:center;text-decoration:none;font-weight:900}.muted{color:#64748b}</style></head><body><main><div class="card"><h1>KGG Plan</h1><p id="msg" class="muted">Plan wird geöffnet…</p><div id="a"></div></div></main><script src="./vendor/fflate-0.8.3.js?v=fflate-0.8.3"></script><script src="./patient-qr-format.js?v=v81-kgg-h3-plan-format"></script><script>function q(){const p=new URLSearchParams(location.search);return p.get('plan')||p.get('kgg')||''}function legacy(s){s=String(s||'').replace(/^KGGH2:/i,'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}function d(s){return window.KGGPlanFormat?window.KGGPlanFormat.decodePlanText(s).raw:legacy(s)}function enc(raw){return btoa(unescape(encodeURIComponent(JSON.stringify(raw)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function go(raw){const code=window.KGGPlanFormat&&typeof window.KGGPlanFormat.encodeKggH3==='function'?window.KGGPlanFormat.encodeKggH3(raw):'KGGH2:'+enc(raw);location.replace('./#'+code)}try{let x=q();if(x){go(d(x))}else{msg.textContent='Kein Plan im Startlink gefunden. Bitte QR-Code oder Planlink erneut öffnen.';a.innerHTML='<a class="btn" href="./">Zur App</a>'}}catch(e){msg.textContent='Plan konnte nicht gelesen werden. Bitte neuen QR-Code öffnen.';a.innerHTML='<a class="btn" href="./">Zur App</a>'}</script></body></html>
