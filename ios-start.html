window.KGGPlanFormat.encodeKggH3==='function'?window.KGGPlanFormat.encodeKggH3(raw):'KGGH2:'+enc(raw);location.replace('./#'+code)}function isStandalone(){return Boolean((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)}function bundleCode(){const h=String(location.hash||'');return /^#kggt=/i.test(h)?h.slice(6):''}function installMode(){return new URLSearchParams(location.search).get('install')==='1'}function showInstallSteps(){document.title='KGG Plan';msg.innerHTML='<b>Fast fertig:</b> Jetzt diese Seite zum Home-Bildschirm hinzufügen.';a.innerHTML='<ol><li>Unten (iPad: oben) auf das <b>Teilen</b>-Symbol <span class="share">⬆︎</span> tippen.</li><li><b>Zum Home-Bildschirm</b> wählen.</li><li><b>Hinzufügen</b> tippen.</li><li>Die App über das neue Symbol <b>KGG Plan</b> öffnen. Dein Plan und deine Werte sind dann dort.</li></ol><p class="muted">Wichtig: Nicht als Favorit oder Lesezeichen speichern.</p>'}function fromBundle(){const code=bundleCode();if(!code||!window.KGGInstallTransfer)return false;const T=window.KGGInstallTransfer;const r=T.importBundle(T.decodeBundle(code));if(!T.hasPlan())return false;msg.textContent=r.skipped?'Plan wird geöffnet…':'Plan und Werte übernommen. App wird geöffnet…';location.replace('./');return true}try{let x=q();if(installMode()&&!isStandalone()){showInstallSteps()}else if(isStandalone()&&(()=>{try{return fromBundle()}catch(e){return false}})()){}else if(x){go(d(x))}else{msg.textContent='Kein Plan im Startlink gefunden. Bitte QR-Code oder Planlink erneut öffnen.';a.innerHTML='<a class="btn" href="./">Zur App</a>'}}catch(e){msg.textContent='Plan konnte nicht gelesen werden. Bitte neuen QR-Code öffnen.';a.innerHTML='<a class="btn" href="./">Zur App</a>'}</script></body></html>
