name: KGG Patient GPT Preview Gate
run-name: KGG Patient GPT Preview Gate | ${{ inputs.mode }} | ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      existing_pr:
        description: Existing same-repository patient PR; empty uses the existing payload workflow
        required: false
        default: ""
        type: string
      expected_head_sha:
        description: Exact tested head for existing_pr
        required: false
        default: ""
        type: string
      mode:
        description: validate_only, publish_preview, create_pr or publish_patient_live
        required: true
        type: choice
        options:
          - validate_only
          - publish_preview
          - create_pr
          - publish_patient_live
      request_id:
        description: Stable patient GPT request id
        required: true
        type: string
      payload_json:
        description: Guarded patient GPT replace-exact payload
        required: true
        type: string
      approval_phrase:
        description: One immediate confirmation; use Zulassen only for patient PR/live modes
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      existing_pr:
        description: Existing same-repository patient PR; empty uses the existing payload workflow
        required: false
        default: ""
        type: string
      expected_head_sha:
        description: Exact tested head for existing_pr
        required: false
        default: ""
        type: string
      mode:
        required: true
        type: string
      request_id:
        required: true
        type: string
      payload_json:
        required: true
        type: string
      approval_phrase:
        required: false
        default: ""
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: kgg-patient-gpt-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  patient-gate:
    if: inputs.existing_pr == ''
    runs-on: ubuntu-latest
    outputs:
      patch_hash: ${{ steps.gate.outputs.patch_hash }}
      patient_version: ${{ steps.gate.outputs.patient_version }}
      preview_url: ${{ steps.gate.outputs.preview_url }}
      recovery_url: ${{ steps.gate.outputs.recovery_url }}
      pr_url: ${{ steps.pull_request.outputs.pr_url }}
    env:
      GH_TOKEN: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN || github.token }}
      PAYLOAD_JSON: ${{ inputs.payload_json }}
    steps:
      - name: Checkout canonical main patient source
        uses: actions/checkout@v4
        with:
          path: base
          ref: main
          fetch-depth: 0
          token: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout complete canonical Patient editor sync contract
        if: inputs.mode != 'validate_only'
        uses: actions/checkout@v4
        with:
          path: editor-contract
          ref: main

      - name: Require verified Patient GPT editor sync for Preview or release writes
        if: inputs.mode != 'validate_only'
        shell: bash
        run: |
          set -euo pipefail
          python editor-contract/release-pipeline/kgg_custom_gpt_resource_audit.py \
            --check \
            --editor-snapshot editor-contract/docs/kgg-patient-custom-gpt-editor-snapshot.json \
            --profile patientProduction \
            --require-live-synced

      - name: Install patient test dependencies
        if: inputs.mode != 'validate_only'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cd base/release-pipeline
          npm ci
          npx playwright install --with-deps chromium

      - name: Write guarded dispatch payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "kgg-patient-gpt-payload.json"
          path.write_text(os.environ["PAYLOAD_JSON"], encoding="utf-8", newline="\n")
          print(path)
          PY

      - name: Prepare isolated patient preview checkout
        if: inputs.mode != 'validate_only'
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone Kayus24/kgg-patient-preview preview

      - name: Validate or apply guarded patient payload
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          cd base
          args=(
            --mode '${{ inputs.mode }}'
            --payload-file "$RUNNER_TEMP/kgg-patient-gpt-payload.json"
            --github-output "$GITHUB_OUTPUT"
            --approval-phrase '${{ inputs.approval_phrase }}'
          )
          if [[ '${{ inputs.mode }}' != 'validate_only' ]]; then
            args+=(--preview-root "$GITHUB_WORKSPACE/preview")
          fi
          python release-pipeline/kgg_patient_gpt_write_gate.py "${args[@]}"

      - name: Refresh patient GPT resources for PR modes
        if: inputs.mode == 'create_pr' || inputs.mode == 'publish_patient_live'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile patientProduction

      - name: Run critical KGG tests
        if: inputs.mode != 'validate_only'
        shell: bash
        env:
          KGG_ALLOW_RELEASE_DRIFT: "1"
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_test_battery.py --level critical

      - name: Run patient PWA and browser regression
        if: inputs.mode != 'validate_only'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_pwa_contract_smoke.py
          python release-pipeline/kgg_update_recovery_smoke.py
          node release-pipeline/kgg_patient_card_progress_smoke.js
          node release-pipeline/kgg_patient_install_prompt_smoke.js
          node release-pipeline/kgg_patient_plan_delete_smoke.js
          node release-pipeline/kgg_patient_summary_smoke.js
          node release-pipeline/kgg_patient_media_sources_playwright.js
          node release-pipeline/kgg_patient_media_stability_playwright.js
          node release-pipeline/kgg_patient_card_state_stability_playwright.js
          node release-pipeline/kgg_patient_transient_flicker_blackbox.js
          node release-pipeline/kgg_patient_gpt_browser_smoke.js
          node release-pipeline/kgg_patient_preview_first_load_smoke.js "$GITHUB_WORKSPACE/preview/previews/${{ inputs.request_id }}"
          node release-pipeline/kgg_patient_preview_storage_isolation_smoke.js \
            "$GITHUB_WORKSPACE/base" \
            "$GITHUB_WORKSPACE/preview/previews/${{ inputs.request_id }}" \
            "${{ inputs.request_id }}"

      - name: Run patient interface regression
        if: inputs.mode != 'validate_only' && steps.gate.outputs.run_patient_scan == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_test_battery.py --suite patient-scan --level regression

      - name: Run patient camera full-frame regression
        if: inputs.mode != 'validate_only' && steps.gate.outputs.run_patient_scan == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          node release-pipeline/kgg_patient_scan_camera_smoke.js --case=live-camera-full-frame

      - name: Upload candidate evidence
        if: inputs.mode != 'validate_only'
        uses: actions/upload-artifact@v4
        with:
          name: kgg-patient-preview-${{ inputs.request_id }}
          path: |
            preview/previews/${{ inputs.request_id }}/
            base/CHANGELOG_PATIENT_APP.md

      - name: Publish isolated patient preview
        if: inputs.mode == 'publish_preview'
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews
          if git diff --cached --quiet; then
            echo "No patient preview changes to publish."
          else
            git commit -m "publish patient preview ${{ inputs.request_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          {
            echo "Patient preview: ${{ steps.gate.outputs.preview_url }}"
            echo "Recovery preview: ${{ steps.gate.outputs.recovery_url }}"
            echo "Patch hash: ${{ steps.gate.outputs.patch_hash }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create accepted patient PR
        id: pull_request
        if: inputs.mode == 'create_pr' || inputs.mode == 'publish_patient_live'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          branch="patient-gpt/${{ inputs.request_id }}-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html service-worker.js update-recovery.html manifest.json \
            manifest-v*.webmanifest collapse-cards.js numpad-ui-fix.js patient-*.js \
            CHANGELOG_PATIENT_APP.md docs/kgg-patient-* \
            docs/kgg-custom-gpt-resource-manifest.json \
            release-pipeline/kgg_patient_preview_storage_isolation_smoke.js \
            release-pipeline/kgg_patient_live_version_smoke.js
          git commit -m "patient app ${{ inputs.request_id }}"
          git push -u origin "$branch"
          body="$(mktemp)"
          cat > "$body" <<BODY
          Guarded Patient-App Custom GPT patch.

          - Preview request: \`${{ inputs.request_id }}\`
          - Patch hash: \`${{ steps.gate.outputs.patch_hash }}\`
          - Patient version: \`v${{ steps.gate.outputs.patient_version }}\`
          - Risk class: \`${{ steps.gate.outputs.risk_class }}\`
          - Accepted preview: \`${{ steps.gate.outputs.preview_url }}\`

          The patch is based on the exact accepted preview and never writes directly to \`main\`.
          BODY
          url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "[patient-app] ${{ inputs.request_id }} v${{ steps.gate.outputs.patient_version }}" \
            --body-file "$body")"
          echo "pr_url=$url" >> "$GITHUB_OUTPUT"
          echo "Patient PR: $url" >> "$GITHUB_STEP_SUMMARY"

  merge-patient-live:
    if: inputs.mode == 'publish_patient_live' && inputs.existing_pr == ''
    needs: patient-gate
    runs-on: ubuntu-latest
    environment: patient-live
    env:
      GH_TOKEN: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN }}
    steps:
      - name: Require configured patient automation token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

      - name: Wait for required checks and merge accepted patient release
        shell: bash
        run: |
          set -euo pipefail
          gh pr checks '${{ needs.patient-gate.outputs.pr_url }}' --required --watch --fail-fast
          gh pr merge '${{ needs.patient-gate.outputs.pr_url }}' --squash
          echo "Merged patient release: ${{ needs.patient-gate.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live patient version
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ needs.patient-gate.outputs.patient_version }}'
          for attempt in {1..12}; do
            worker="$(curl --fail --silent --show-error \
              "https://kayus24.github.io/kgg/service-worker.js?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -Fq "const APP_VERSION = '${expected}';" <<<"$worker"; then
              echo "Live patient version v${expected} verified." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not expose patient version v${expected} in time." >&2
          exit 1

      - name: Verify live visible client version and stale-client update
        uses: actions/checkout@v4
        with:
          path: live-base
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: live-base/release-pipeline/package-lock.json

      - name: Install live client smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd live-base/release-pipeline
          npm ci
          npx playwright install --with-deps chromium

      - name: Run bounded live client version smoke
        shell: bash
        run: |
          set -euo pipefail
          node live-base/release-pipeline/kgg_patient_live_version_smoke.js \
            '${{ needs.patient-gate.outputs.patient_version }}' \
            'https://kayus24.github.io/kgg/' \
            "$GITHUB_WORKSPACE/live-base"

  merge-existing-patient-live:
    name: Release exact accepted patient PR
    if: inputs.mode == 'publish_patient_live' && inputs.existing_pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: patient-live
    concurrency:
      group: kgg-patient-existing-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN || github.token }}
      EXISTING_PR: ${{ inputs.existing_pr }}
      EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
      APPROVAL: ${{ inputs.approval_phrase }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable accepted PR and required checks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL" == 'Zulassen' ]]
          [[ "$EXISTING_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HEAD" ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXISTING_PR" > "$RUNNER_TEMP/patient-pr.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pr=json.loads((Path(os.environ['RUNNER_TEMP'])/'patient-pr.json').read_text())
          assert pr['state']=='open' and not pr['draft'] and not pr['merged']
          assert pr['base']['ref']=='main'
          assert pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert pr['head']['sha']==os.environ['EXPECTED_HEAD']
          sw=Path('service-worker.js').read_text()
          version=re.search(r"const APP_VERSION = '(\d+)';",sw).group(1)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('PATIENT_VERSION='+version+'\n')
          PY
          gh pr checks "$EXISTING_PR" --repo "$GITHUB_REPOSITORY" --required
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare bounded live verification before merging
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix release-pipeline --ignore-scripts
          node release-pipeline/node_modules/playwright/cli.js install --with-deps chromium
          python release-pipeline/kgg_pwa_contract_smoke.py
          python release-pipeline/kgg_update_recovery_smoke.py
      - name: Merge only the tested head through ordinary branch protection
        shell: bash
        run: |
          set -euo pipefail
          gh pr checks "$EXISTING_PR" --repo "$GITHUB_REPOSITORY" --required
          gh pr merge "$EXISTING_PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_HEAD"
          test "$(gh pr view "$EXISTING_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = MERGED
      - name: Verify deployed v94 client and old-client update
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "https://kayus24.github.io/kgg/service-worker.js?release=$GITHUB_RUN_ID-$attempt" | grep -Fq "const APP_VERSION = '$PATIENT_VERSION';"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          node release-pipeline/kgg_patient_live_version_smoke.js "$PATIENT_VERSION" 'https://kayus24.github.io/kgg/' "$GITHUB_WORKSPACE"
          echo "Released PR #$EXISTING_PR at tested $EXPECTED_HEAD; verified v$PATIENT_VERSION" >> "$GITHUB_STEP_SUMMARY"
