name: KGG Approved PR Test APK (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/kgg-approved-pr-test-apk.yml
      - release-pipeline/kgg_verified_pr_provenance.py
      - release-pipeline/test_kgg_verified_pr_provenance.py
      - release-pipeline/test_kgg_approved_pr_test_apk.py
  workflow_dispatch:
    inputs:
      source_pr:
        description: Approved open draft PR number
        required: true
        type: string
      source_sha:
        description: Exact immutable PR SHA
        required: true
        type: string
      source_branch:
        description: Expected source branch (independently pinned)
        required: true
        type: string
      base_branch:
        description: Expected base branch (independently pinned)
        required: true
        type: string
      base_sha:
        description: Exact immutable base SHA from the approved CI run
        required: true
        type: string
      verification_run_id:
        description: Exact successful verification run
        required: true
        type: string
      request_id:
        description: Unique test request identifier
        required: true
        type: string
permissions: {}
concurrency:
  group: kgg-approved-pr-test-apk-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify provenance and workflow contract
        run: |
          python -m unittest discover -s release-pipeline -p test_kgg_verified_pr_provenance.py -v
          python -m unittest discover -s release-pipeline -p test_kgg_approved_pr_test_apk.py -v
  verify-source:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_PR: ${{ inputs.source_pr }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_BASE_BRANCH: ${{ inputs.base_branch }}
      SOURCE_BASE_SHA: ${{ inputs.base_sha }}
      VERIFIED_RUN: ${{ inputs.verification_run_id }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Fail closed for untrusted source or malformed inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Kayus24/kgg"
          test "$GITHUB_REF_NAME" = "main"
          [[ "$SOURCE_PR" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]{1,160}$ ]]
          [[ "$SOURCE_BASE_BRANCH" =~ ^[A-Za-z0-9._/-]{1,160}$ ]]
          [[ "$SOURCE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIED_RUN" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$REQUEST_ID" =~ ^[a-z0-9][a-z0-9-]{5,63}$ ]]
      - uses: actions/checkout@v4
        with:
          path: trusted
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify live GitHub PR and green SHA-bound CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$RUNNER_TEMP/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > "$RUNNER_TEMP/run.json"
          python trusted/release-pipeline/kgg_verified_pr_provenance.py \
            --pr-file "$RUNNER_TEMP/pr.json" --run-file "$RUNNER_TEMP/run.json" \
            --pr-number "$SOURCE_PR" --sha "$SOURCE_SHA" \
            --branch "$SOURCE_BRANCH" --base-branch "$SOURCE_BASE_BRANCH" \
            --base-sha "$SOURCE_BASE_SHA" \
            --run-id "$VERIFIED_RUN" > "$RUNNER_TEMP/attestation.json"
          jq -e '.status=="PASS" and .publishingAuthorized==false' "$RUNNER_TEMP/attestation.json" >/dev/null
  build-test-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-source
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_PR: ${{ inputs.source_pr }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_BASE_SHA: ${{ inputs.base_sha }}
      VERIFIED_RUN: ${{ inputs.verification_run_id }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Ensure immutable source checkout
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
      - name: Install existing PDF test dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run KGG critical and UI regressions
        working-directory: source
        env:
          KGG_ALLOW_RELEASE_DRIFT: "1"
        run: |
          set -euo pipefail
          python release-pipeline/build_therapist_source.py --check
          python release-pipeline/kgg_test_battery.py --level critical
          python release-pipeline/kgg_test_battery.py --suite ui-stability --level regression
      - name: Prepare existing browser regression tools
        working-directory: source/release-pipeline
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify cockpit phone dock twice in fresh browsers
        working-directory: source
        run: |
          node release-pipeline/kgg_ticket_037_real_plan_smoke.js --case=phone-cockpit-entry-390
          node release-pipeline/kgg_ticket_037_real_plan_smoke.js --case=phone-cockpit-entry-390
      - name: Generate exact test APK context
        shell: bash
        run: |
          set -euo pipefail
          hash="$(printf 'approved-pr|%s|%s|%s' "$SOURCE_PR" "$SOURCE_SHA" "$VERIFIED_RUN" | sha256sum | cut -d ' ' -f1)"
          version="$(python -c 'import json;print(json.load(open("source/kgg-update/version.json"))["versionName"])')"
          python source/release-pipeline/kgg_preview_context.py \
            --request-id "$REQUEST_ID" --patch-hash "$hash" \
            --base-sha "$SOURCE_BASE_SHA" --commit-sha "$SOURCE_SHA" \
            --web-version "$version" --required-test critical \
            --required-test 'ui-stability regression' --required-test phone-cockpit-entry-390 \
            --output "$RUNNER_TEMP/kgg-preview-context.json"
      - name: Build Android test APK only
        working-directory: source/android-wrapper
        run: gradle -PKGG_PREVIEW_CONTEXT_FILE="$RUNNER_TEMP/kgg-preview-context.json" assemblePreviewDebug
      - name: Stage untrusted APK data for isolated validation job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          cp -- source/android-wrapper/app/build/outputs/apk/preview/debug/app-preview-debug.apk "$RUNNER_TEMP/stage/app-preview-debug.apk"
          cp -- source/kgg-update/version.json "$RUNNER_TEMP/stage/version.json"
          cp -- "$RUNNER_TEMP/kgg-preview-context.json" "$RUNNER_TEMP/stage/kgg-preview-context.json"
      - name: Upload short-lived untrusted staging artifact (NOT approved)
        uses: actions/upload-artifact@v4
        with:
          name: untrusted-pr-${{ inputs.source_pr }}-${{ github.run_id }}-staging
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/stage/
  finalize-test-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: build-test-apk
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_PR: ${{ inputs.source_pr }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_BASE_BRANCH: ${{ inputs.base_branch }}
      SOURCE_BASE_SHA: ${{ inputs.base_sha }}
      VERIFIED_RUN: ${{ inputs.verification_run_id }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Guard trusted default branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Kayus24/kgg"
          test "$GITHUB_REF_NAME" = "main"
      - uses: actions/checkout@v4
        with:
          path: trusted
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reverify live approval on independent fresh trusted runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$RUNNER_TEMP/pr-final.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > "$RUNNER_TEMP/run-final.json"
          python trusted/release-pipeline/kgg_verified_pr_provenance.py \
            --pr-file "$RUNNER_TEMP/pr-final.json" --run-file "$RUNNER_TEMP/run-final.json" \
            --pr-number "$SOURCE_PR" --sha "$SOURCE_SHA" \
            --branch "$SOURCE_BRANCH" --base-branch "$SOURCE_BASE_BRANCH" \
            --base-sha "$SOURCE_BASE_SHA" \
            --run-id "$VERIFIED_RUN" > "$RUNNER_TEMP/attestation-final.json"
          jq -e '.status=="PASS" and .publishingAuthorized==false' "$RUNNER_TEMP/attestation-final.json" >/dev/null
      - name: Read original version from independently pinned source SHA (GitHub REST)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/contents/kgg-update/version.json?ref=$SOURCE_SHA" \
            > "$RUNNER_TEMP/github-source-version.json"
      - name: Download untrusted APK as data only (never execute)
        uses: actions/download-artifact@v4
        with:
          name: untrusted-pr-${{ inputs.source_pr }}-${{ github.run_id }}-staging
          path: ${{ runner.temp }}/staged
      - name: Validate staged data shape without executing PR content
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find "$RUNNER_TEMP/staged" -type l -print -quit)"
          test "$(find "$RUNNER_TEMP/staged" -type f | wc -l)" -eq 3
          for name in app-preview-debug.apk version.json kgg-preview-context.json; do
            test -f "$RUNNER_TEMP/staged/$name"
            test ! -L "$RUNNER_TEMP/staged/$name"
          done
          test "$(stat -c%s "$RUNNER_TEMP/staged/app-preview-debug.apk")" -gt 1024
          python trusted/release-pipeline/kgg_verified_pr_provenance.py \
            --verify-artifact --artifact-dir "$RUNNER_TEMP/staged" \
            --github-version-file "$RUNNER_TEMP/github-source-version.json" \
            --pr-number "$SOURCE_PR" --sha "$SOURCE_SHA" \
            --base-sha "$SOURCE_BASE_SHA" --run-id "$VERIFIED_RUN" \
            --request-id "$REQUEST_ID" > "$RUNNER_TEMP/artifact-integrity.json"
          jq -e '.status=="PASS" and .artifactSignatureVerified==true and .apkApplicationId=="de.kgg.preview" and .embeddedPreviewContextVerified==true and .publishingAuthorized==false' \
            "$RUNNER_TEMP/artifact-integrity.json" >/dev/null
      - name: Upload approved test APK artifact only; no release or channel write
        uses: actions/upload-artifact@v4
        with:
          name: approved-pr-${{ inputs.source_pr }}-test-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/staged/app-preview-debug.apk
            ${{ runner.temp }}/staged/version.json
            ${{ runner.temp }}/staged/kgg-preview-context.json
            ${{ runner.temp }}/attestation-final.json
            ${{ runner.temp }}/artifact-integrity.json
