name: TEMP harden pain Playwright

on:
  push:
    branches:
      - fix/patient-continuous-training-days-v75
    paths:
      - .github/workflows/tmp-harden-pain-playwright.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Harden test lifecycle only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('release-pipeline/kgg_patient_pain_vertical_playwright.js')
          text=path.read_text(encoding='utf-8')
          old='''async function setCardOpen(page, card, index, open) {\n  const isOpen = await card.evaluate(el => el.classList.contains("kggOpen"));\n  if (isOpen !== open) await card.locator("h3").click();\n  await page.waitForFunction(({ index, open }) => Boolean(document.querySelectorAll("#list .ex")[index]?.classList.contains("kggOpen")) === open, { index, open });\n}\n'''
          new='''async function setCardOpen(page, _card, index, open) {\n  for (let attempt=0; attempt<4; attempt+=1) {\n    const card=page.locator("#list .ex").nth(index);\n    await card.waitFor({state:"attached",timeout:5000});\n    const isOpen=await card.evaluate(el=>el.classList.contains("kggOpen"));\n    if (isOpen===open) return;\n    const header=card.locator("h3");\n    await header.waitFor({state:"attached",timeout:5000});\n    await header.evaluate(element=>element.click());\n    try {\n      await page.waitForFunction(({index,open})=>Boolean(document.querySelectorAll("#list .ex")[index]?.classList.contains("kggOpen"))===open,{index,open},{timeout:1500});\n      return;\n    } catch (error) {\n      await page.waitForTimeout(60);\n    }\n  }\n  const diagnostic=await page.evaluate(({index,open})=>({\n    index,open,\n    cardCount:document.querySelectorAll("#list .ex").length,\n    classes:document.querySelectorAll("#list .ex")[index]?.className||"",\n    hasHeader:Boolean(document.querySelectorAll("#list .ex")[index]?.querySelector("h3")),\n  }),{index,open});\n  throw new Error(`card open state did not stabilize: ${JSON.stringify(diagnostic)}`);\n}\n'''
          if old not in text:
              raise SystemExit('setCardOpen marker missing')
          text=text.replace(old,new,1)
          old2='''    await modal.waitFor({state:"hidden"});\n    await page.waitForTimeout(30);\n    const restored=await page.evaluate(()=>({scrollY:window.scrollY,bodyPosition:getComputedStyle(document.body).position,active:document.activeElement?.className||""}));\n    assert(Math.abs(restored.scrollY-before.scrollY)<=1,"closing modal did not restore scroll position");\n    assert(restored.bodyPosition!=="fixed","closing modal did not unlock body");\n    assert(String(restored.active).includes("kggPainVerticalToggle"),"focus did not return to pain trigger");\n'''
          new2='''    await modal.waitFor({state:"hidden"});\n    await page.waitForFunction(expected=>{\n      const active=String(document.activeElement?.className||"");\n      return Math.abs(window.scrollY-expected)<=1&&getComputedStyle(document.body).position!=="fixed"&&active.includes("kggPainVerticalToggle");\n    },before.scrollY,{timeout:2000});\n    const restored=await page.evaluate(()=>({scrollY:window.scrollY,bodyPosition:getComputedStyle(document.body).position,active:document.activeElement?.className||""}));\n    assert(Math.abs(restored.scrollY-before.scrollY)<=1,`closing modal did not restore scroll position: ${JSON.stringify({before:before.scrollY,restored})}`);\n    assert(restored.bodyPosition!=="fixed","closing modal did not unlock body");\n    assert(String(restored.active).includes("kggPainVerticalToggle"),"focus did not return to pain trigger");\n'''
          if old2 not in text:
              raise SystemExit('scroll restore marker missing')
          text=text.replace(old2,new2,1)
          path.write_text(text,encoding='utf-8',newline='\n')
          PY
          node --check release-pipeline/kgg_patient_pain_vertical_playwright.js
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile patientProduction
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Commit test and generated resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-pipeline/kgg_patient_pain_vertical_playwright.js docs
          git commit -m 'test: stabilize patient pain modal browser lifecycle'
          git push origin HEAD:fix/patient-continuous-training-days-v75
