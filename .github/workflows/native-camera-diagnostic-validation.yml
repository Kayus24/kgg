name: Native camera diagnostic validation

on:
  pull_request:
    branches: [main]
    types: [reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: native-camera-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify base and real Git patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=8c7689833e4e0247a1acdab297352357e09219d7
          ACTUAL="$(git merge-base origin/main HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/kgg-native-camera-artifact"
          git diff --binary --full-index "$EXPECTED"...HEAD -- android-wrapper \
            > "$RUNNER_TEMP/kgg-native-camera-artifact/native-camera-diagnostic.valid.patch"
          test -s "$RUNNER_TEMP/kgg-native-camera-artifact/native-camera-diagnostic.valid.patch"
          git worktree add --detach "$RUNNER_TEMP/kgg-base" "$EXPECTED"
          git -C "$RUNNER_TEMP/kgg-base" apply --check \
            "$RUNNER_TEMP/kgg-native-camera-artifact/native-camera-diagnostic.valid.patch"
          git -C "$RUNNER_TEMP/kgg-base" apply \
            "$RUNNER_TEMP/kgg-native-camera-artifact/native-camera-diagnostic.valid.patch"
          git -C "$RUNNER_TEMP/kgg-base" diff --check
          echo "base=$ACTUAL" | tee "$RUNNER_TEMP/kgg-native-camera-artifact/patch-check.txt"
          sha256sum "$RUNNER_TEMP/kgg-native-camera-artifact/native-camera-diagnostic.valid.patch" \
            >> "$RUNNER_TEMP/kgg-native-camera-artifact/patch-check.txt"

      - name: Verify Preview-only and privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f android-wrapper/app/src/preview/AndroidManifest.xml
          test -f android-wrapper/app/src/preview/java/de/kgg/app/KggNativeCameraDiagnosticActivity.java
          test -f android-wrapper/app/src/preview/java/de/kgg/app/KggPreviewCameraDiagnosticApplication.java
          test ! -e android-wrapper/app/src/main/java/de/kgg/app/KggNativeCameraDiagnosticActivity.java
          grep -q 'previewImplementation "androidx.camera:camera-core' android-wrapper/app/build.gradle
          grep -q 'android:exported="false"' android-wrapper/app/src/preview/AndroidManifest.xml
          grep -q 'PreviewView.ScaleType.FIT_CENTER' android-wrapper/app/src/preview/java/de/kgg/app/KggNativeCameraDiagnosticActivity.java
          grep -q 'getPhysicalCameraInfos' android-wrapper/app/src/preview/java/de/kgg/app/KggNativeCameraDiagnosticActivity.java
          grep -q 'setPhysicalCameraId' android-wrapper/app/src/preview/java/de/kgg/app/KggNativeCameraDiagnosticActivity.java
          grep -q 'closeLiveCamera' android-wrapper/app/src/preview/java/de/kgg/app/KggPreviewCameraDiagnosticApplication.java
          ! grep -Eq 'FileOutputStream|MediaStore\.Images|ImageCapture|takePicture|openOutputStream|SQLite|SharedPreferences' \
            android-wrapper/app/src/preview/java/de/kgg/app/KggNativeCameraDiagnosticActivity.java

      - name: Install regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cd release-pipeline
          npm ci
          npx playwright install --with-deps chromium

      - name: Run five required KGG regressions
        shell: bash
        env:
          KGG_ALLOW_RELEASE_DRIFT: "1"
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/kgg-native-camera-artifact/regressions.log"
          python release-pipeline/kgg_test_battery.py --level critical 2>&1 | tee -a "$LOG"
          python release-pipeline/kgg_test_battery.py --suite ui-stability --level regression 2>&1 | tee -a "$LOG"
          python release-pipeline/kgg_test_battery.py --suite camera-qr --level regression 2>&1 | tee -a "$LOG"
          python release-pipeline/kgg_test_battery.py --suite patient-scan --level regression 2>&1 | tee -a "$LOG"
          python release-pipeline/kgg_test_battery.py --suite native-sync --level regression 2>&1 | tee -a "$LOG"

      - name: Build Android profiles
        shell: bash
        working-directory: android-wrapper
        run: gradle clean assembleAdminDebug assembleKollegenDebug assemblePreviewDebug

      - name: Verify APK separation
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_APK=android-wrapper/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          COLLEAGUE_APK=android-wrapper/app/build/outputs/apk/kollegen/debug/app-kollegen-debug.apk
          PREVIEW_APK=android-wrapper/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          test -s "$ADMIN_APK"
          test -s "$COLLEAGUE_APK"
          test -s "$PREVIEW_APK"
          unzip -p "$PREVIEW_APK" classes.dex | strings | grep -q 'KggNativeCameraDiagnosticActivity'
          for apk in "$ADMIN_APK" "$COLLEAGUE_APK"; do
            for dex in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
              ! unzip -p "$apk" "$dex" | strings | grep -q 'KggNativeCameraDiagnosticActivity'
              ! unzip -p "$apk" "$dex" | strings | grep -q 'KggPreviewCameraDiagnosticApplication'
            done
          done
          cp "$PREVIEW_APK" "$RUNNER_TEMP/kgg-native-camera-artifact/kgg-native-camera-diagnostic-preview.apk"
          sha256sum "$RUNNER_TEMP/kgg-native-camera-artifact"/* \
            > "$RUNNER_TEMP/kgg-native-camera-artifact/SHA256SUMS.txt"

      - name: Upload Preview APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: kgg-native-camera-diagnostic-preview-20260803-a
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/kgg-native-camera-artifact/*
