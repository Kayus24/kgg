name: Temporary continuous day meta fix
on:
  push:
    branches: [fix/patient-continuous-training-days-v75]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align card-settings meta with continuous day flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('patient-card-settings.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='v2_empty_unit_hides_field';","const VERSION='v3_continuous_day_meta';",1)
          old="const meta=$('meta');if(meta&&safe(()=>p))meta.textContent=(p.ex?.length||0)+' '+T('Übungen','exercises')+' · '+(p.days||0)+' '+T('Trainingstage','training days');"
          new="const meta=$('meta');if(meta&&safe(()=>p)){const flow=window.KGGPatientDayFlow,continuous=flow&&typeof flow.isContinuousPlan==='function'?flow.isContinuousPlan():p.extendDays!==false;meta.textContent=(p.ex?.length||0)+' '+T('Übungen','exercises')+' · '+(continuous?T('fortlaufender Trainingsplan','continuous training plan'):(p.days||0)+' '+T('Trainingstage','training days'));}"
          if old not in s: raise SystemExit('patient-card-settings meta writer anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')

          t=Path('release-pipeline/kgg_patient_continuous_days_smoke.js')
          x=t.read_text(encoding='utf-8')
          old="const start=fs.readFileSync(path.join(root,'patient-start-values-day1.js'),'utf8');"
          new=old+"\nconst cardSettings=fs.readFileSync(path.join(root,'patient-card-settings.js'),'utf8');"
          if old not in x: raise SystemExit('smoke import anchor missing')
          x=x.replace(old,new,1)
          anchor="assert(start.includes(\"p.extendDays!==false||Number(p.days||0)>=2\"),'start values cannot advance a continuous one-day horizon to T2');"
          extra=anchor+"\nassert(cardSettings.includes(\"const VERSION='v3_continuous_day_meta'\"),'card settings continuous-day meta version missing');\nassert(cardSettings.includes(\"continuous?T('fortlaufender Trainingsplan','continuous training plan')\"),'card settings still overwrites continuous plan meta with p.days');"
          if anchor not in x: raise SystemExit('smoke assertion anchor missing')
          t.write_text(x.replace(anchor,extra,1),encoding='utf-8',newline='\n')
          PY
          node release-pipeline/check_html_scripts.js index.html
          node release-pipeline/kgg_patient_continuous_days_smoke.js
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile patientProduction
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Commit meta fix and generated resources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patient-card-settings.js release-pipeline/kgg_patient_continuous_days_smoke.js docs/kgg-patient-* docs/kgg-custom-gpt-resource-manifest.json docs/kgg-patient-custom-gpt-editor-snapshot.json
          git commit -m 'fix(patient): keep continuous day meta after UI i18n'
          git push origin HEAD:fix/patient-continuous-training-days-v75
