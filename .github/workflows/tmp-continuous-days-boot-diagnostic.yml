name: Temporary continuous day boot diagnostic
on:
  push:
    branches: [fix/patient-continuous-training-days-v75]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
      - name: Add early boot diagnostics to continuous day browser test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('release-pipeline/kgg_patient_continuous_days_playwright.js')
          s=p.read_text(encoding='utf-8')
          old="    await page.goto(url,{waitUntil:'domcontentloaded'});await waitForRuntime(page);"
          new="    await page.goto(url,{waitUntil:'domcontentloaded'});\n    await page.waitForTimeout(800);\n    const boot=await page.evaluate(()=>({planHidden:document.getElementById('plan')?.classList.contains('hide'),status:document.getElementById('status')?.textContent||'',statusClass:document.getElementById('status')?.className||'',href:location.href,currentPlan:localStorage.getItem('kggCurrentPlanV1')||'',hasDayFlow:Boolean(window.KGGPatientDayFlow)}));\n    if(boot.planHidden)throw new Error('patient core boot failed before service worker: '+JSON.stringify({boot,pageErrors:errors}));\n    await waitForRuntime(page);"
          if old not in s: raise SystemExit('boot anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-pipeline/kgg_patient_continuous_days_playwright.js
          git commit -m 'test(patient): diagnose continuous day boot failures'
          git push origin HEAD:fix/patient-continuous-training-days-v75
