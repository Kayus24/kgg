name: Temporary plan replacement slot patch
on:
  push:
    branches:
      - fix/patient-plan-replace-slot-v73
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-plan-replace-slot-v73
          fetch-depth: 0
      - name: Apply isolated replacement fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8-sig')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('patient-start-scan.js',
            "const VERSION='start-scan-v8-plan-replace';",
            "const VERSION='start-scan-v9-replace-active-slot';")
          replace_once('patient-start-scan.js',
            'Der bisherige Plan bleibt in der Plan-Historie.',
            'Andere gespeicherte Pläne bleiben unverändert.')
          replace_once('patient-start-scan.js',
            'The previous plan remains in plan history.',
            'Other saved plans remain unchanged.')
          replace_once('patient-start-scan.js',
            "if(!state.plans.length){state.plans.push(current);active=0}else state.plans[active]=current;const replacement=clone(nextRaw);",
            "if(!state.plans.length)active=0;const replacement=clone(nextRaw);")
          replace_once('patient-start-scan.js',
            "state.plans.push(replacement);state.active=state.plans.length-1;state.day[state.active]=1;",
            "if(state.plans.length)state.plans[active]=replacement;else state.plans.push(replacement);state.active=active;state.day[active]=1;")

          replace_once('service-worker.js',
            "const CACHE_NAME = 'kgg-handyplan-v72-card-progress-visible';\nconst APP_VERSION = '72';",
            "const CACHE_NAME = 'kgg-handyplan-v73-plan-replace-active-slot';\nconst APP_VERSION = '73';")
          replace_once('service-worker.js',
            "const VERSION_LABEL_SCRIPT = './patient-version-label.js?v=72';",
            "const VERSION_LABEL_SCRIPT = './patient-version-label.js?v=73';")
          replace_once('service-worker.js',
            "const START_SCAN_SCRIPT = './patient-start-scan.js?v=plan-replace-1';",
            "const START_SCAN_SCRIPT = './patient-start-scan.js?v=plan-replace-active-slot-1';")
          replace_once('service-worker.js',
            '<script src="./patient-start-scan.js?v=plan-replace-1"></script>',
            '<script src="./patient-start-scan.js?v=plan-replace-active-slot-1"></script>')
          replace_once('service-worker.js',
            '<script src="./patient-version-label.js?v=72"></script>',
            '<script src="./patient-version-label.js?v=73"></script>')
          replace_once('patient-version-label.js',"const RELEASE='72';","const RELEASE='73';")
          replace_once('update-recovery.html',"const RELEASE='72';","const RELEASE='73';")

          test=Path('release-pipeline/kgg_patient_plan_replace_slot_smoke.js')
          test.write_text(r'''#!/usr/bin/env node
'use strict';
const fs=require('fs');
const path=require('path');
const source=fs.readFileSync(path.join(__dirname,'..','patient-start-scan.js'),'utf8');
function assert(ok,msg){if(!ok)throw new Error(msg)}
assert(source.includes("const VERSION='start-scan-v9-replace-active-slot';"),'replacement module version missing');
assert(source.includes('if(state.plans.length)state.plans[active]=replacement;else state.plans.push(replacement);state.active=active;state.day[active]=1;'),'replacement does not stay in active slot');
assert(!source.includes('state.plans.push(replacement);state.active=state.plans.length-1;'),'replacement still appends a new plan');
assert(source.includes('Andere gespeicherte Pläne bleiben unverändert.'),'German confirmation still claims history append');
assert(source.includes('Other saved plans remain unchanged.'),'English confirmation still claims history append');
console.log('Patient plan replace active-slot smoke: OK');
''',encoding='utf-8')

          gate=Path('.github/workflows/kgg-required-gate.yml')
          g=gate.read_text(encoding='utf-8')
          marker='      - name: Run patient plan delete smoke\n'
          step="      - name: Run patient plan replace active-slot smoke\n        shell: bash\n        run: node release-pipeline/kgg_patient_plan_replace_slot_smoke.js\n"
          if step not in g:
              if marker not in g: raise SystemExit('required-gate insertion marker missing')
              g=g.replace(marker,step+marker,1)
              gate.write_text(g,encoding='utf-8')
          PY
      - name: Run targeted checks
        run: |
          node --check patient-start-scan.js
          node release-pipeline/kgg_patient_plan_replace_slot_smoke.js
          git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-patch-plan-replace-slot-v73.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patient-start-scan.js service-worker.js patient-version-label.js update-recovery.html release-pipeline/kgg_patient_plan_replace_slot_smoke.js .github/workflows/kgg-required-gate.yml .github/workflows/tmp-patch-plan-replace-slot-v73.yml
          git commit -m "fix: replace active patient plan slot (v73)"
          git push origin HEAD:fix/patient-plan-replace-slot-v73
