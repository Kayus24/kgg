name: Temporary continuous day resource refresh
on:
  push:
    branches: [fix/patient-continuous-training-days-v75]
permissions:
  contents: write
jobs:
  resources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh patient resources
        run: |
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --write
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Commit generated resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/kgg-patient-* docs/kgg-custom-gpt-resource-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(patient): refresh v75 runtime resources'
          git push origin HEAD:fix/patient-continuous-training-days-v75
