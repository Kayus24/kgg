name: KGG Admin GPT Patient Preview
run-name: KGG Admin GPT Patient Preview | ${{ inputs.mode }} | ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pre-authorized cross-app test-channel action
        required: true
        type: choice
        options:
          - validate_only
          - publish_preview
      request_id:
        description: Stable patient GPT request id
        required: true
        type: string
      payload_json:
        description: Guarded patient GPT replace-exact payload
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  admin-editor-sync-preflight:
    if: inputs.mode == 'publish_preview'
    name: Require verified Admin GPT editor sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block cross-app Preview writes until the Admin editor is live-synced
        shell: bash
        run: |
          set -euo pipefail
          python release-pipeline/kgg_custom_gpt_resource_audit.py \
            --check \
            --editor-snapshot docs/kgg-custom-gpt-editor-snapshot.json \
            --profile production \
            --require-live-synced

  patient-preview:
    if: always() && (inputs.mode == 'validate_only' || needs.admin-editor-sync-preflight.result == 'success')
    needs: admin-editor-sync-preflight
    uses: ./.github/workflows/kgg-patient-gpt-preview-gate.yml
    with:
      mode: ${{ inputs.mode }}
      request_id: ${{ inputs.request_id }}
      payload_json: ${{ inputs.payload_json }}
      approval_phrase: ""
    secrets: inherit
