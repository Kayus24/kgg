name: Temporary Phase3 Runner V2

on:
  push:
    branches:
      - phase1-admin-editor-sync-candidate

permissions:
  contents: write

jobs:
  phase3:
    if: github.event.head_commit.message == 'phase3-trigger-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-admin-editor-sync-candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 3 Action surface
        run: python .phase3_impl.py
      - name: Regenerate Resource Manifest and Admin target
        run: python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile production
      - name: Verify all Admin editor sync phases and GPT contracts
        shell: bash
        run: |
          set -euo pipefail
          python release-pipeline/test_kgg_custom_gpt_resource_audit.py
          python release-pipeline/test_kgg_admin_editor_sync_candidate.py
          python release-pipeline/test_kgg_admin_editor_sync_preflight.py
          python release-pipeline/test_kgg_admin_editor_sync_pr_gate.py
          python release-pipeline/test_kgg_admin_editor_sync_action_surface.py
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check --editor-snapshot docs/kgg-custom-gpt-editor-snapshot.json --profile production
          python release-pipeline/kgg_custom_gpt_knowledge_pack.py --check
          python release-pipeline/kgg_gpt_eval.py
          ruby -e "require 'yaml'; d=YAML.load_file(ARGV[0]); abort('bad openapi') unless d['openapi']=='3.1.0'" docs/kgg-custom-gpt-action-api-openapi.yaml
      - name: Enforce Phase 3 scope
        shell: bash
        run: |
          set -euo pipefail
          base=a19e8d75442ac1e81349d7da40bc3c18fd1b8d7c
          allowed='^(.phase3_impl.py|.phase3-trigger-v2|.github/workflows/_tmp-phase3-runner-v2.yml|docs/kgg-custom-gpt-action-api-openapi.yaml|docs/kgg-custom-gpt-resource-manifest.json|docs/kgg-custom-gpt-editor-snapshot.json|release-pipeline/test_kgg_admin_editor_sync_action_surface.py)$'
          bad="$(git diff --name-only "$base" -- | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "Unexpected Phase 3 files:" >&2; echo "$bad" >&2; exit 1; }
      - name: Commit generated Phase 3 contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/kgg-custom-gpt-action-api-openapi.yaml docs/kgg-custom-gpt-resource-manifest.json docs/kgg-custom-gpt-editor-snapshot.json release-pipeline/test_kgg_admin_editor_sync_action_surface.py
          git diff --cached --check
          git commit -m 'feat(gpt): expose admin editor sync certification actions'
          git push origin HEAD:phase1-admin-editor-sync-candidate
