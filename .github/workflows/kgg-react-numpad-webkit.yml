name: KGG React NumPad WebKit Compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/kgg-react-numpad-webkit.yml'
      - 'release-pipeline/kgg_patient_react_numpad_header_playwright.js'
      - 'patient-ui/**'
      - 'patient-react-dist/**'
      - 'patient-numpad-visibility-fix.js'
      - 'patient-set-compact-view.js'
      - 'numpad-ui-fix.js'
      - 'index.html'
      - 'service-worker.js'

permissions:
  contents: read

concurrency:
  group: kgg-react-webkit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  webkit-compat:
    name: React NumPad WebKit
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: release-pipeline/package-lock.json
      - name: Install pinned Playwright and WebKit
        shell: bash
        run: |
          cd release-pipeline
          npm ci --ignore-scripts
          npx playwright install --with-deps webkit
      - name: Verify React NumPad in WebKit engine
        shell: bash
        env:
          KGG_REACT_HEADER_BROWSER: webkit
        run: node release-pipeline/kgg_patient_react_numpad_header_playwright.js
