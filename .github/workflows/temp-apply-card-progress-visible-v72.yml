name: Temp apply visible card progress v72

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/patient-card-progress-visible-v72'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply isolated v72 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)} for {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8',newline='\n')

          path='collapse-cards.js'
          replace_once(path,
            "body.kggCardsCollapsed .ex:not(.kggOpen):active{transform:scale(.995)}body.kggCardsCollapsed .ex:not(.kggOpen) .set",
            "body.kggCardsCollapsed .ex:not(.kggOpen):active{transform:scale(.995)}.kggCardProgress{display:none}body.kggCardsCollapsed .ex:not(.kggOpen) .kggCardProgress{display:inline-flex!important;align-items:center;width:max-content;max-width:100%;margin:2px 0 0;padding:3px 8px;border:1px solid #cbd5e1;border-radius:999px;background:#f8fafc;color:#64748b;font-size:11px;font-weight:900;line-height:1.2;white-space:nowrap}body.kggCardsCollapsed .ex:not(.kggOpen) .kggCardProgress.kggProgressPartial{border-color:#fcd34d;background:#fffbeb;color:#92400e}body.kggCardsCollapsed .ex:not(.kggOpen) .kggCardProgress.kggProgressDone{border-color:#86efac;background:#ecfdf5;color:#166534}body.kggCardsCollapsed .ex:not(.kggOpen) .set")
          replace_once(path,
            "function cards(){return[...document.querySelectorAll('#list .ex')]}function collapse(){",
            "function cards(){return[...document.querySelectorAll('#list .ex')]}function progress(c){if(!c)return;let n=[...c.querySelectorAll('.set input.num')].filter(i=>String(i&&i.value!=null?i.value:'').trim()!=='').length,state=n===0?'Open':n===1?'Partial':'Done',b=c.querySelector('.kggCardProgress');if(!b){b=document.createElement('span');b.className='kggCardProgress';let h=c.querySelector('h3');if(h&&h.insertAdjacentElement)h.insertAdjacentElement('afterend',b);else c.insertBefore(b,c.firstChild||null)}b.className='kggCardProgress kggProgress'+state;b.textContent=n===0?tr('○ Offen','○ Open'):n===1?tr('◐ Teilweise','◐ Partial'):tr('✓ Bearbeitet','✓ Done');b.dataset.kggFilledCount=String(n)}function progressAll(){cards().forEach(progress)}function patchProgressPut(){if(window.__kggCollapseProgressPut||typeof put!=='function')return;window.__kggCollapseProgressPut=1;let o=put;window.put=function(){let r=o.apply(this,arguments);setTimeout(progressAll,0);return r}}function collapse(){")
          replace_once(path,
            "cards().forEach((c,i)=>{c.dataset.kggExerciseIndex=i;",
            "cards().forEach((c,i)=>{progress(c);c.dataset.kggExerciseIndex=i;")
          replace_once(path,
            "function apply(){css();floatBtn();langSwitch();texts();days();collapse();taps()}function init(){css();floatBtn();langSwitch();patchRender();patchPad();apply();setTimeout(apply,300);setTimeout(apply,1000);setTimeout(patchPad,300);setTimeout(patchPad,1000)}",
            "function apply(){css();floatBtn();langSwitch();texts();days();collapse();progressAll();taps()}function init(){css();floatBtn();langSwitch();patchRender();patchPad();patchProgressPut();apply();setTimeout(()=>{patchProgressPut();apply()},300);setTimeout(()=>{patchProgressPut();apply()},1000);setTimeout(patchPad,300);setTimeout(patchPad,1000)}")

          replace_once('service-worker.js',"const CACHE_NAME = 'kgg-handyplan-v71-numpad-stay-open';","const CACHE_NAME = 'kgg-handyplan-v72-card-progress-visible';")
          replace_once('service-worker.js',"const APP_VERSION = '71';","const APP_VERSION = '72';")
          replace_once('service-worker.js',"const VERSION_LABEL_SCRIPT = './patient-version-label.js?v=71';","const VERSION_LABEL_SCRIPT = './patient-version-label.js?v=72';")
          replace_once('service-worker.js',"const COLLAPSE_SCRIPT = './collapse-cards.js?v=plan-update-label-1';","const COLLAPSE_SCRIPT = './collapse-cards.js?v=plan-update-label-2-progress-visible';")
          replace_once('service-worker.js','<script src="./collapse-cards.js?v=plan-update-label-1"></script>','<script src="./collapse-cards.js?v=plan-update-label-2-progress-visible"></script>')
          replace_once('service-worker.js','<script src="./patient-version-label.js?v=71"></script>','<script src="./patient-version-label.js?v=72"></script>')
          replace_once('patient-version-label.js',"const RELEASE='71';","const RELEASE='72';")
          replace_once('update-recovery.html',"const RELEASE='71';","const RELEASE='72';")

          test=Path('release-pipeline/kgg_patient_card_progress_smoke.js')
          text=test.read_text(encoding='utf-8')
          needle="console.log('Patient card progress smoke: OK');"
          addition="""const collapseSource=fs.readFileSync(path.join(ROOT,'collapse-cards.js'),'utf8');\nassert(collapseSource.includes('function progress(c)'),'collapse fallback progress renderer missing');\nassert(collapseSource.includes('function patchProgressPut()'),'collapse fallback does not refresh after canonical put/save');\nassert(collapseSource.includes(\"tr('✓ Bearbeitet','✓ Done')\"),'visible done label missing from collapse fallback');\nassert(collapseSource.includes('display:inline-flex!important'),'closed-card badge visibility is not enforced');\nconsole.log('Patient card progress smoke: OK');"""
          if text.count(needle)!=1:
              raise SystemExit('card progress smoke marker mismatch')
          test.write_text(text.replace(needle,addition),encoding='utf-8',newline='\n')
          PY

          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --write || true
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path=Path('docs/kgg-custom-gpt-resource-manifest.json')
          snapshot_path=Path('docs/kgg-patient-custom-gpt-editor-snapshot.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          snapshot=json.loads(snapshot_path.read_text(encoding='utf-8'))
          snapshot['knowledgeSha256']=[item['sha256'] for item in manifest['patientProduction']['knowledge']]
          snapshot_path.write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_custom_gpt_resource_audit.py --write
          rm .github/workflows/temp-apply-card-progress-visible-v72.yml
      - name: Commit v72 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix visible patient card progress badge (v72)'
          git push origin HEAD:${{ github.head_ref }}
