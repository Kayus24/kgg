name: Publish continuous-days v75 preview A
on:
  push:
    branches: [preview-publish/continuous-days-v75-a]
permissions:
  contents: read
jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: cb69bc6b6fbe9a544db26bede50a71365a9492ed
      REQUEST_ID: patient-continuous-days-v75-preview-a
      GH_TOKEN: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN || github.token }}
    steps:
      - name: Checkout preview lab
        uses: actions/checkout@v4
        with:
          ref: preview-publish/continuous-days-v75-a
          path: lab
      - name: Checkout exact accepted patient runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clone isolated preview repository
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone Kayus24/kgg-patient-preview preview
      - name: Assemble exact runtime preview
        shell: bash
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/preview/previews/$REQUEST_ID"
          rm -rf "$dest"
          mkdir -p "$dest/vendor"
          cp source/index.html source/service-worker.js source/update-recovery.html "$dest/"
          cp source/manifest.json source/manifest-v64.webmanifest "$dest/"
          cp source/kgg-icon-192-v63.png source/kgg-icon-512-v63.png source/kgg-icon-maskable-512-v63.png "$dest/"
          cp source/*.js "$dest/"
          cp -R source/vendor/. "$dest/vendor/"
          cp lab/preview-lab/continuous-days-test.html "$dest/continuous-days-test.html"
          printf '{"requestId":"%s","patientVersion":"75","sourceCommit":"%s","requiredGate":"31685911499","continuousDaysGate":"31685911506"}\n' "$REQUEST_ID" "$SOURCE_SHA" > "$dest/preview-provenance.json"
          grep -F "const APP_VERSION = '75';" "$dest/service-worker.js"
          grep -F "kgg-handyplan-v75-continuous-days" "$dest/service-worker.js"
          grep -F "function isContinuousPlan()" "$dest/index.html"
          node source/release-pipeline/check_html_scripts.js "$dest/index.html" "$dest/continuous-days-test.html"
      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd source/release-pipeline
          npm ci
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE/lab"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.61.1 >/dev/null 2>&1
      - name: Recheck exact source feature contract
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node release-pipeline/kgg_patient_continuous_days_smoke.js
          timeout 180s node release-pipeline/kgg_patient_continuous_days_playwright.js
      - name: Test exact assembled preview artifact
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/source/release-pipeline/node_modules
        run: |
          set -euo pipefail
          timeout 180s node lab/preview-lab/continuous-days-preview-smoke.js "$GITHUB_WORKSPACE/preview/previews/$REQUEST_ID"
      - name: Publish isolated preview
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "previews/$REQUEST_ID"
          git commit -m "publish patient continuous-days v75 preview A"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Preview: https://kayus24.github.io/kgg-patient-preview/previews/$REQUEST_ID/" >> "$GITHUB_STEP_SUMMARY"
          echo "Test menu: https://kayus24.github.io/kgg-patient-preview/previews/$REQUEST_ID/continuous-days-test.html" >> "$GITHUB_STEP_SUMMARY"
