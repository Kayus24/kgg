name: KGG Required Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: kgg-required-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-gate:
    name: required-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify bounded schema-fix base
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "fix/admin-editor-response-schema-properties"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "e1693b8716e6c8f7fb30ccd4a1f8d7d90569d55b"

      - name: Apply exactly seven response properties fixes and canonical target refresh
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('docs/kgg-custom-gpt-action-api-openapi.yaml')
          text = path.read_text(encoding='utf-8')
          before = text
          before_ops = re.findall(r'(?m)^\s+operationId:\s+\S+\s*$', before)
          before_conseq = re.findall(r'(?m)^\s+x-openai-isConsequential:\s+\S+\s*$', before)
          before_security = before.count('      security:\n')

          targets = [
              '/repos/Kayus24/kgg/git/ref/heads/main',
              '/repos/Kayus24/kgg/actions/workflows/kgg-gpt-device-test.yml/runs',
              '/repos/Kayus24/kgg/actions/workflows/kgg-gpt-preview-auto.yml/runs',
              '/repos/Kayus24/kgg/actions/workflows/kgg-patient-gpt-preview-from-admin.yml/runs',
              '/repos/Kayus24/kgg-project-memory/contents/coordination/index.json',
              '/repos/Kayus24/kgg-project-memory/contents/coordination/threads/{coordination_request_id}.json',
              '/repos/Kayus24/kgg-project-memory/actions/workflows/kgg-agent-coordination-gate.yml/runs',
          ]

          for target in targets:
              marker = f'  {target}:\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing target path: {target}')
              end = text.find('\n  /repos/', start + len(marker))
              if end < 0:
                  end = len(text)
              block = text[start:end]
              if 'properties: {}' in block:
                  continue
              inline = 'schema: {type: object, additionalProperties: true}'
              multiline = 'schema:\n                type: object\n                additionalProperties: true'
              if block.count(inline) == 1:
                  block = block.replace(inline, 'schema: {type: object, properties: {}, additionalProperties: true}', 1)
              elif block.count(multiline) == 1:
                  block = block.replace(multiline, 'schema:\n                type: object\n                properties: {}\n                additionalProperties: true', 1)
              else:
                  raise SystemExit(f'target path does not have exactly one expected object response schema: {target}')
              text = text[:start] + block + text[end:]

          if re.findall(r'(?m)^\s+operationId:\s+\S+\s*$', text) != before_ops:
              raise SystemExit('operationId inventory changed')
          if re.findall(r'(?m)^\s+x-openai-isConsequential:\s+\S+\s*$', text) != before_conseq:
              raise SystemExit('consequential flags changed')
          if text.count('      security:\n') != before_security:
              raise SystemExit('security block count changed')
          if text.count('properties: {}') - before.count('properties: {}') != 7:
              raise SystemExit('expected exactly seven new properties: {} declarations')

          path.write_text(text, encoding='utf-8')
          diff = subprocess.check_output(['git', 'diff', '--', str(path)], text=True)
          if diff.count('properties: {}') != 7:
              raise SystemExit('OpenAPI diff does not contain exactly seven properties additions/replacements')
          print('editor_response_schema_properties_added=7')
          PY

          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile production

          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path('docs/kgg-custom-gpt-editor-snapshot.json').read_text(encoding='utf-8'))
          if snapshot.get('syncStatus') != 'target-pending-live-editor-sync':
              raise SystemExit('snapshot must remain target-pending-live-editor-sync')
          if 'lastVerifiedAt' in snapshot or 'lastVerifiedMainCommit' in snapshot:
              raise SystemExit('live verification fields must not be present')
          PY

          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}" | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            docs/kgg-custom-gpt-action-api-openapi.yaml \
            docs/kgg-custom-gpt-editor-snapshot.json \
            docs/kgg-custom-gpt-resource-manifest.json | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/kgg-custom-gpt-action-api-openapi.yaml \
            docs/kgg-custom-gpt-editor-snapshot.json \
            docs/kgg-custom-gpt-resource-manifest.json
          git diff --cached --check
          git commit -m 'fix(gpt): add explicit response object properties'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
