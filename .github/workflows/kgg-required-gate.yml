name: KGG Required Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kgg-required-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-gate:
    name: required-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify bounded diff and description limits
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "fix/admin-editor-action-description-limit"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "3ae969b8a08e2f03ec1ac13aef7fc65f84a753fa"
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          text = Path('docs/kgg-custom-gpt-action-api-openapi.yaml').read_text(encoding='utf-8')
          pre = 'Write-free certification preflight after human editor attestation. Server reads main and manifest, requires TARGET_PASS, builds a temporary candidate, requires LIVE_PASS, rechecks main drift, and never creates a branch, commit or PR. Caller controls only request_id; ref is fixed to main.'
          pr = 'Consequential snapshot-PR gate after exact approval "Gut für Main". Server reruns the full preflight, owns UTC time, main SHA and candidate, permits only syncStatus, lastVerifiedAt and lastVerifiedMainCommit, creates only a snapshot PR, never writes main directly and never auto-merges.'
          assert len(pre) == 288 and text.count('description: ' + pre) == 1
          assert len(pr) == 286 and text.count('description: ' + pr) == 1
          assert text.count('operationId: submitKggAdminEditorSyncPreflight') == 1
          assert text.count('operationId: submitKggAdminEditorSyncSnapshotPr') == 1
          assert text.count('enum: [Gut für Main]') == 1
          snapshot = json.loads(Path('docs/kgg-custom-gpt-editor-snapshot.json').read_text(encoding='utf-8'))
          assert snapshot['syncStatus'] == 'target-pending-live-editor-sync'
          assert 'lastVerifiedAt' not in snapshot and 'lastVerifiedMainCommit' not in snapshot
          print('preflight_description_length=288')
          print('snapshot_pr_description_length=286')
          PY

      - name: Run Admin Editor Sync Action Surface tests
        run: python -m unittest release-pipeline/test_kgg_admin_editor_sync_action_surface.py -v

      - name: Run Resource Audit tests and canonical check
        run: |
          python -m unittest release-pipeline/test_kgg_custom_gpt_resource_audit.py -v
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check --editor-snapshot docs/kgg-custom-gpt-editor-snapshot.json --profile production

      - name: Run critical KGG test battery
        env:
          KGG_ALLOW_RELEASE_DRIFT: '1'
        run: python release-pipeline/kgg_test_battery.py --level critical
