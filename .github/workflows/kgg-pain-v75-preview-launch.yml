name: KGG Vertical Pain v75 Preview Launch

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: kgg-pain-v75-preview-launch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN || github.token }}
      REQUEST_ID: patient-vertical-pain-v75-preview-b
      PAYLOAD_JSON: >-
        {"request_id":"patient-vertical-pain-v75-preview-b","base_sha":"${{ github.event.pull_request.head.sha }}","title":"Vertikale Schmerzskala für Übungsschmerzen","summary":"Kennzeichnet den vollständig geprüften vertikalen Übungsschmerz-Regler als reproduzierbaren mobilen Preview-Kandidaten.","version_slug":"vertical-exercise-pain","risk_class":"standard","touched_areas":["patient-ui"],"required_tests":["patient-pwa","patient-browser","ui-stability"],"operations":[{"type":"replace_exact","path":"patient-pain-vertical-scale.js","old_sha256":"adedf8db2ca9c91a1f0c9d7964faef1b8f96dc249edd0d09c30ec1abe176b663","old_text":"const VERSION='vertical-pain-v3-safe-pointer-capture';","new_text":"const VERSION='vertical-pain-v4-mobile-preview-candidate';"}]}
    steps:
      - name: Checkout exact patient PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write one guarded payload
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"kgg-pain-v75-payload.json"
          path.write_text(os.environ["PAYLOAD_JSON"],encoding="utf-8",newline="\n")
          print(path)
          PY

      - name: Validate exact payload first
        shell: bash
        run: |
          python release-pipeline/kgg_patient_gpt_write_gate.py \
            --mode validate_only \
            --payload-file "$RUNNER_TEMP/kgg-pain-v75-payload.json"

      - name: Install patient preview dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cd release-pipeline
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare isolated preview repository
        shell: bash
        run: |
          gh auth setup-git
          gh repo clone Kayus24/kgg-patient-preview "$GITHUB_WORKSPACE/preview"

      - name: Apply identical payload to isolated preview
        id: gate
        shell: bash
        run: |
          python release-pipeline/kgg_patient_gpt_write_gate.py \
            --mode publish_preview \
            --payload-file "$RUNNER_TEMP/kgg-pain-v75-payload.json" \
            --preview-root "$GITHUB_WORKSPACE/preview" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run complete patient candidate regression
        shell: bash
        env:
          KGG_ALLOW_RELEASE_DRIFT: "1"
        run: |
          python release-pipeline/kgg_test_battery.py --level critical
          python release-pipeline/kgg_pwa_contract_smoke.py
          python release-pipeline/kgg_update_recovery_smoke.py
          node release-pipeline/kgg_patient_card_progress_smoke.js
          node release-pipeline/kgg_patient_install_prompt_smoke.js
          node release-pipeline/kgg_patient_plan_delete_smoke.js
          node release-pipeline/kgg_patient_summary_smoke.js
          node release-pipeline/kgg_patient_pain_vertical_smoke.js
          node release-pipeline/kgg_patient_runtime_progress_playwright.js
          node release-pipeline/kgg_patient_pain_vertical_playwright.js
          node release-pipeline/kgg_patient_preview_first_load_smoke.js "$GITHUB_WORKSPACE/preview/previews/$REQUEST_ID"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: kgg-patient-preview-${{ env.REQUEST_ID }}
          path: |
            preview/previews/${{ env.REQUEST_ID }}/
            CHANGELOG_PATIENT_APP.md
          if-no-files-found: error
          retention-days: 7

      - name: Publish isolated patient preview
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/preview"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews
          if ! git diff --cached --quiet; then
            git commit -m "publish patient preview $REQUEST_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          {
            echo "Patient preview: ${{ steps.gate.outputs.preview_url }}"
            echo "Recovery preview: ${{ steps.gate.outputs.recovery_url }}"
            echo "Patch hash: ${{ steps.gate.outputs.patch_hash }}"
            echo "Patient version: v${{ steps.gate.outputs.patient_version }}"
          } >> "$GITHUB_STEP_SUMMARY"
