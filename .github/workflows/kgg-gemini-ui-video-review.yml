name: KGG Gemini UI Video Review

# Trusted second stage. Do not checkout/execute pull-request code with API secrets.
on:
  workflow_run:
    workflows: ['KGG Patient UI Legacy React Parity']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  gemini-advisory:
    name: Gemini review of synthetic Legacy vs React videos
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          vars.KGG_GEMINI_VIDEO_AUTOREVIEW == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: kgg-gemini-video-review
    steps:
      - name: Checkout trusted reviewer from main ONLY
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download data-only parity artifacts from the successful CI run
        uses: actions/download-artifact@v4
        with:
          name: kgg-patient-ui-parity-chromium-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/patient-ui-parity
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Gemini compares two synthetic UI recordings (advisory)
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KGG_GEMINI_VIDEO_UPLOAD_APPROVED: ${{ vars.KGG_GEMINI_VIDEO_UPLOAD_APPROVED }}
          KGG_GEMINI_EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          KGG_GEMINI_VIDEO_MODEL: ${{ vars.KGG_GEMINI_VIDEO_MODEL || 'gemini-3.5-flash-lite' }}
        run: node release-pipeline/kgg_gemini_ui_video_review.mjs "${{ runner.temp }}/patient-ui-parity"
      - name: Publish small Gemini findings, without re-uploading videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgg-gemini-review-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/patient-ui-parity/gemini-review.json
            ${{ runner.temp }}/patient-ui-parity/gemini-review.md
          if-no-files-found: warn
          retention-days: 7
