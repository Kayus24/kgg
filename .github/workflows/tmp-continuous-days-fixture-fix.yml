name: Temporary continuous day fixture persistence fix
on:
  push:
    branches: [fix/patient-continuous-training-days-v75]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make seeded day state survive pagehide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('release-pipeline/kgg_patient_continuous_days_playwright.js')
          s=p.read_text(encoding='utf-8')
          old="""async function seedCurrent(page,doneDays,lastOpenDay){
  await page.evaluate(({doneDays,lastOpenDay})=>{
    localStorage.setItem(dk(),JSON.stringify(doneDays));
    localStorage.setItem(mk(),JSON.stringify({lastOpenDay,lastCompletedDay:doneDays.length?doneDays[doneDays.length-1]:0,storageVersion:6}));
  },{doneDays,lastOpenDay});
  await page.reload({waitUntil:'domcontentloaded'});
  await waitForRuntime(page);
}"""
          new="""async function seedCurrent(page,doneDays,lastOpenDay){
  await page.evaluate(({doneDays,lastOpenDay})=>{
    done=Array.from(doneDays||[],Number);
    d=Number(lastOpenDay)||1;
    save();
  },{doneDays,lastOpenDay});
  await page.reload({waitUntil:'domcontentloaded'});
  await waitForRuntime(page);
}"""
          if old not in s: raise SystemExit('seedCurrent anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile patientProduction
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Commit fixture fix and resources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-pipeline/kgg_patient_continuous_days_playwright.js docs/kgg-patient-* docs/kgg-custom-gpt-resource-manifest.json docs/kgg-patient-custom-gpt-editor-snapshot.json
          git commit -m 'test(patient): persist continuous day fixtures through pagehide'
          git push origin HEAD:fix/patient-continuous-training-days-v75
