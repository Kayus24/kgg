name: Temporary Exact Operation Inventory Fix

on:
  push:
    branches:
      - phase1-admin-editor-sync-candidate

permissions:
  contents: write

jobs:
  exact-inventory-fix:
    if: "github.event.head_commit.message == 'chore(gpt): trigger exact operation inventory fix'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-admin-editor-sync-candidate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch exact canonical operation inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('release-pipeline/test_kgg_brain_relay_worker.py')
          text = path.read_text(encoding='utf-8')

          old_ops = '                "getKggPreviewGateJobs", "getKggPreviewGateArtifacts", "submitKggPatientPreviewFromAdmin",\n'
          new_ops = (
              '                "getKggPreviewGateJobs", "getKggPreviewGateArtifacts", "submitKggAdminEditorSyncPreflight",\n'
              '                "submitKggAdminEditorSyncSnapshotPr", "submitKggPatientPreviewFromAdmin",\n'
          )
          if text.count(old_ops) != 1:
              raise SystemExit('expected exact Admin API inventory insertion point exactly once')
          text = text.replace(old_ops, new_ops, 1)

          old_count = 'self.assertEqual(26, len(expected["docs/kgg-custom-gpt-action-api-openapi.yaml"]), "Admin API operations")'
          new_count = 'self.assertEqual(28, len(expected["docs/kgg-custom-gpt-action-api-openapi.yaml"]), "Admin API operations")'
          if text.count(old_count) != 1:
              raise SystemExit('expected exact Admin API operation count assertion exactly once')
          text = text.replace(old_count, new_count, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run targeted operation inventory test
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest release-pipeline/test_kgg_brain_relay_worker.py -k test_operation_id_inventories_remain_unchanged -v

      - name: Run full critical KGG test battery
        shell: bash
        run: |
          set -euo pipefail
          python release-pipeline/kgg_test_battery.py --level critical

      - name: Run all Admin editor sync phase tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            release-pipeline/test_kgg_custom_gpt_resource_audit.py \
            release-pipeline/test_kgg_admin_editor_sync_candidate.py \
            release-pipeline/test_kgg_admin_editor_sync_preflight.py \
            release-pipeline/test_kgg_admin_editor_sync_pr_gate.py \
            release-pipeline/test_kgg_admin_editor_sync_action_surface.py \
            -v

      - name: Verify Resource Contract target mode
        shell: bash
        run: |
          set -euo pipefail
          python release-pipeline/kgg_custom_gpt_resource_audit.py \
            --check \
            --editor-snapshot docs/kgg-custom-gpt-editor-snapshot.json \
            --profile production

      - name: Enforce exact write scope and commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only)"
          test "$actual" = 'release-pipeline/test_kgg_brain_relay_worker.py'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- release-pipeline/test_kgg_brain_relay_worker.py
          staged="$(git diff --cached --name-only)"
          test "$staged" = 'release-pipeline/test_kgg_brain_relay_worker.py'
          git commit -m 'test(gpt): accept intentional admin sync operation ids'
          git push origin HEAD:phase1-admin-editor-sync-candidate
