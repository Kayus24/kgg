name: KGG Pain Settled Layout Test Temp

on:
  push:
    branches:
      - feat/patient-vertical-pain-scale-v74
    paths:
      - .github/workflows/kgg-pain-layout-settle-test-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-vertical-pain-scale-v74
          fetch-depth: 0
      - name: Wait for card animation before modal baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('release-pipeline/kgg_patient_pain_vertical_playwright.js')
          text=path.read_text(encoding='utf-8')
          old='''    await page.evaluate(()=>window.scrollTo(0,Math.min(250,document.documentElement.scrollHeight-window.innerHeight)));
              const before=await page.evaluate(()=>{'''
          new='''    await page.evaluate(()=>window.scrollTo(0,Math.min(250,document.documentElement.scrollHeight-window.innerHeight)));
              await page.waitForTimeout(380);
              const before=await page.evaluate(()=>{'''
          if old not in text: raise SystemExit('baseline insertion target not found')
          text=text.replace(old,new,1)
          text=text.replace('''    assert(before.firstHeight===after.firstHeight,"opening modal changed exercise-card height");
              assert(before.secondLayoutTop===after.secondLayoutTop,"opening modal shifted following exercise");''','''    assert(before.firstHeight===after.firstHeight,`opening modal changed exercise-card height: ${JSON.stringify({before,after})}`);
              assert(before.secondLayoutTop===after.secondLayoutTop,`opening modal shifted following exercise: ${JSON.stringify({before,after})}`);''',1)
          path.write_text(text,encoding='utf-8',newline='\n')
          PY
          node --check release-pipeline/kgg_patient_pain_vertical_playwright.js
      - name: Commit correction and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/kgg-pain-layout-settle-test-temp.yml
          git add release-pipeline/kgg_patient_pain_vertical_playwright.js
          git commit -m "test(patient): measure modal after card layout settles"
          git push origin HEAD:feat/patient-vertical-pain-scale-v74
