name: Temporary Admin Editor Sync PR Regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  admin-editor-sync-regression:
    if: github.event.pull_request.head.ref == 'phase1-admin-editor-sync-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Targeted operation inventory test
        run: python -m unittest release-pipeline/test_kgg_brain_relay_worker.py -k test_operation_id_inventories_remain_unchanged -v

      - name: Full critical KGG test battery
        run: python release-pipeline/kgg_test_battery.py --level critical

      - name: Phase 1, 2A, 2B and 3 Admin editor sync tests
        run: |
          python -m unittest \
            release-pipeline/test_kgg_custom_gpt_resource_audit.py \
            release-pipeline/test_kgg_admin_editor_sync_candidate.py \
            release-pipeline/test_kgg_admin_editor_sync_preflight.py \
            release-pipeline/test_kgg_admin_editor_sync_pr_gate.py \
            release-pipeline/test_kgg_admin_editor_sync_action_surface.py \
            -v

      - name: Canonical Admin Resource Audit
        run: |
          python release-pipeline/kgg_custom_gpt_resource_audit.py \
            --check \
            --editor-snapshot docs/kgg-custom-gpt-editor-snapshot.json \
            --profile production
