name: KGG Pain Layout Test Fix Temp

on:
  push:
    branches:
      - feat/patient-vertical-pain-scale-v74
    paths:
      - .github/workflows/kgg-pain-layout-test-fix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-vertical-pain-scale-v74
          fetch-depth: 0
      - name: Correct document-layout measurement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('release-pipeline/kgg_patient_pain_vertical_playwright.js')
          text = path.read_text(encoding='utf-8')
          old = '''    const before=await page.evaluate(()=>({scrollY:window.scrollY,first:document.querySelectorAll("#list .ex")[0].getBoundingClientRect(),second:document.querySelectorAll("#list .ex")[1].getBoundingClientRect()}));
              await openModal(toggle,modal);
              const after=await page.evaluate(()=>({scrollY:window.scrollY,first:document.querySelectorAll("#list .ex")[0].getBoundingClientRect(),second:document.querySelectorAll("#list .ex")[1].getBoundingClientRect(),bodyPosition:getComputedStyle(document.body).position}));
              assert(Math.abs(before.first.height-after.first.height)<1,"opening modal changed exercise-card height");
              assert(Math.abs(before.second.top-after.second.top)<1,"opening modal shifted following exercise");'''
          new = '''    const before=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll("#list .ex")];
              const layoutTop=element=>{let top=0;for(let node=element;node;node=node.offsetParent)top+=node.offsetTop;return top};
              return{scrollY:window.scrollY,firstHeight:cards[0].offsetHeight,secondLayoutTop:layoutTop(cards[1])};
            });
              await openModal(toggle,modal);
              const after=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll("#list .ex")];
              const layoutTop=element=>{let top=0;for(let node=element;node;node=node.offsetParent)top+=node.offsetTop;return top};
              return{firstHeight:cards[0].offsetHeight,secondLayoutTop:layoutTop(cards[1]),bodyPosition:getComputedStyle(document.body).position};
            });
              assert(before.firstHeight===after.firstHeight,"opening modal changed exercise-card height");
              assert(before.secondLayoutTop===after.secondLayoutTop,"opening modal shifted following exercise");'''
          if old not in text:
              raise SystemExit('target layout assertion block not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          node --check release-pipeline/kgg_patient_pain_vertical_playwright.js
      - name: Commit correction and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/kgg-pain-layout-test-fix-temp.yml
          git add release-pipeline/kgg_patient_pain_vertical_playwright.js
          git commit -m "test(patient): measure modal layout independently of scroll lock"
          git push origin HEAD:feat/patient-vertical-pain-scale-v74
