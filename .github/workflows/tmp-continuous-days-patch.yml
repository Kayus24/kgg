name: Temporary continuous day patch
on:
  push:
    branches: [fix/patient-continuous-training-days-v75]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply continuous training day runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')
          def rep(path, old, new, count=1):
              text=read(path)
              actual=text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}')
              text=text.replace(old,new,count)
              write(path,text)

          # Core day semantics: p.days is a horizon for continuous plans, not a hard max.
          rep('index.html',
              "function save(){if(!p)return;localStorage[sk()]=JSON.stringify(v);localStorage[dk()]=JSON.stringify(done);localStorage[mk()]=JSON.stringify({lastSavedAt:new Date().toISOString(),lastOpenDay:d,lastCompletedDay:done.length?Math.max(...done):0,storageVersion:6})}",
              "function save(){if(!p)return;localStorage[sk()]=JSON.stringify(v);localStorage[dk()]=JSON.stringify(done);localStorage[mk()]=JSON.stringify({lastSavedAt:new Date().toISOString(),lastOpenDay:resumeDay(),lastCompletedDay:maxCompletedDay(),storageVersion:6})}")
          rep('index.html',
              "function next(){return done.length?Math.min(Math.max(...done)+1,p.days):1}function restoreDay(){try{let m=JSON.parse(localStorage[mk()]||'{}'),o=Number(m.lastOpenDay)||0;if(o>=1&&o<=p.days&&!done.includes(o)){d=o;setStatus('Offenes Training T'+d+' wiederhergestellt.','ok');return true}}catch(e){}d=next();return false}",
              "function isContinuousPlan(){return !!p&&p.extendDays!==false}function maxCompletedDay(list=done){let m=0;for(const value of Array.isArray(list)?list:[]){const n=Number(value);if(Number.isInteger(n)&&n>m)m=n}return m}function dayAllowed(value){const n=Number(value);return Number.isInteger(n)&&n>=1&&(isContinuousPlan()||n<=Number(p.days||1))}function normalizeDoneDays(list){const seen=new Set(),out=[];for(const value of Array.isArray(list)?list:[]){const n=Number(value);if(dayAllowed(n)&&!seen.has(n)){seen.add(n);out.push(n)}}return out.sort((a,b)=>a-b)}function next(){if(!done.length)return 1;const candidate=maxCompletedDay()+1;return isContinuousPlan()?candidate:Math.min(candidate,Number(p.days)||1)}function resumeDay(){return Math.max(Number(d)||1,next())}function restoreDay(){const front=next();try{let m=JSON.parse(localStorage[mk()]||'{}'),o=Number(m.lastOpenDay)||0;if(dayAllowed(o)&&o>=front&&!done.includes(o)){d=o;setStatus('Offenes Training T'+d+' wiederhergestellt.','ok');return true}}catch(e){}d=front;return false}function dayPlanMeta(){let en=false;try{en=localStorage.getItem('kggPatientLang')==='en'}catch(e){}const count=p.ex.length+' '+(en?'exercises':'Übungen');return count+' · '+(isContinuousPlan()?(en?'continuous training plan':'fortlaufender Trainingsplan'):(p.days+' '+(en?'training days':'Trainingstage')))}window.KGGPatientDayFlow={isContinuousPlan,maxCompletedDay,dayAllowed,normalizeDone:normalizeDoneDays,next,restoreDay,resumeDay}")
          rep('index.html',
              "done=read(dk(),'[]').map(Number).filter(n=>n>=1&&n<=p.days);",
              "done=normalizeDoneDays(read(dk(),'[]'));"
          )
          rep('index.html',
              "$('meta').textContent=p.ex.length+' Übungen · '+p.days+' Trainingstage';",
              "$('meta').textContent=dayPlanMeta();"
          )
          rep('index.html',
              "$('extendBtn').classList.toggle('hide',!p.extendDays);$('extendBtn').textContent='+ '+p.stepDays+' weitere Tage hinzufügen';",
              "$('extendBtn').classList.add('hide');$('extendBtn').textContent='+ '+p.stepDays+' weitere Tage hinzufügen';"
          )
          old_show="function showQr(finalize){if(finalize){if(!done.includes(d))done.push(d);done.sort((a,b)=>a-b)}save();let payload='KGGD1:'+enc(JSON.stringify({v:1,i:p.id,d,e:rows(d),final:!!finalize}));$('qr').dataset.payload=payload;$('qr').innerHTML=makeQr(payload)+'<button class=\"btn2\" onclick=\"copyQrPayload()\">QR-Code kopieren</button>'; $('sum').textContent=text(d)||'Keine Werte eingetragen.';$('endTitle').textContent=finalize?`Training T${d} beendet`:`Aktuelle Werte T${d}`;$('endInfo').textContent=finalize?'Training wurde als abgeschlossen markiert. Zeige diesen QR dem Therapeuten.':'Zwischenstand: Dieser QR beendet das Training nicht. Danach kannst du weiter eintragen.';$('end').classList.remove('hide');$('end').scrollIntoView({behavior:'smooth'});render()}"
          new_show="function showQr(finalize){const qrDay=Number(d)||1,frontBefore=next();if(finalize){if(!done.includes(qrDay))done.push(qrDay);done=normalizeDoneDays(done)}save();let payload='KGGD1:'+enc(JSON.stringify({v:1,i:p.id,d:qrDay,e:rows(qrDay),final:!!finalize}));$('qr').dataset.payload=payload;$('qr').innerHTML=makeQr(payload)+'<button class=\"btn2\" onclick=\"copyQrPayload()\">QR-Code kopieren</button>'; $('sum').textContent=text(qrDay)||'Keine Werte eingetragen.';$('endTitle').textContent=finalize?`Training T${qrDay} beendet`:`Aktuelle Werte T${qrDay}`;$('endInfo').textContent=finalize?'Training wurde als abgeschlossen markiert. Zeige diesen QR dem Therapeuten.':'Zwischenstand: Dieser QR beendet das Training nicht. Danach kannst du weiter eintragen.';if(finalize&&qrDay===frontBefore){d=next();save()}$('end').classList.remove('hide');$('end').scrollIntoView({behavior:'smooth'});render()}"
          rep('index.html', old_show, new_show)

          # Day-history UI: current day follows next(); history is paged, not bounded by p.days.
          rep('patient-day-history.js', "const VERSION='v5_plan_dialog_title_desc';", "const VERSION='v6_continuous_days_history';")
          rep('patient-day-history.js', "let switching=false;", "let switching=false;\n  let historyLimit=30;")
          rep('patient-day-history.js',
              "const cur=Number(d)||1,total=Number(safe(()=>p.days))||6,arr=multiPlans();",
              "const cur=Number(d)||1,total=Math.max(cur,today()),arr=multiPlans();"
          )
          rep('patient-day-history.js',
              "function closeHistory(){const list=$('kggHistoryList'),bd=$('kggHistoryBackdrop');if(list)list.hidden=true;if(bd)bd.hidden=true;const btn=$('kggHistoryToggle');if(btn)btn.textContent=T('Frühere Trainings anzeigen','Show previous trainings')}",
              "function closeHistory(){const list=$('kggHistoryList'),bd=$('kggHistoryBackdrop');if(list)list.hidden=true;if(bd)bd.hidden=true;historyLimit=30;const btn=$('kggHistoryToggle');if(btn)btn.textContent=T('Frühere Trainings anzeigen','Show previous trainings')}"
          )
          old_hist="function renderHistory(total,cur){const list=$('kggHistoryList');if(!list)return;const days=[];for(let day=1;day<=total;day++){if(day===cur)continue;if(day<cur||dayHasData(day))days.push(day)}if(!days.length){list.innerHTML=`<div class=\"kggEmptyHist\">${T('Noch keine früheren Trainings vorhanden.','No previous trainings yet.')}</div>`;return}list.innerHTML=days.map(day=>`<button type=\"button\" class=\"kggDayCard ${dayDone(day)?'done':''}\" data-day=\"${day}\"><div class=\"kggDayHead\"><b>${T('Tag','Day')} ${day}</b><span class=\"kggDayPill\">${T('öffnen','open')}</span></div><div class=\"kggDayExerciseList\">${dayCards(day)}</div></button>`).join('');list.querySelectorAll('.kggDayCard').forEach(btn=>btn.onclick=()=>openDay(Number(btn.dataset.day)||1))}"
          new_hist="function renderHistory(total,cur){const list=$('kggHistoryList');if(!list)return;const upper=Math.max(1,Number(cur)||1),start=Math.max(1,upper-historyLimit),days=[];for(let day=start;day<upper;day++)days.push(day);if(!days.length){list.innerHTML=`<div class=\"kggEmptyHist\">${T('Noch keine früheren Trainings vorhanden.','No previous trainings yet.')}</div>`;return}const more=start>1?`<button type=\"button\" id=\"kggHistoryMore\" class=\"kggDayCard\"><div class=\"kggDayHead\"><b>${T('Ältere Trainings anzeigen','Show older trainings')}</b><span class=\"kggDayPill\">+30</span></div></button>`:'';list.innerHTML=more+days.map(day=>`<button type=\"button\" class=\"kggDayCard ${dayDone(day)?'done':''}\" data-day=\"${day}\"><div class=\"kggDayHead\"><b>${T('Tag','Day')} ${day}</b><span class=\"kggDayPill\">${T('öffnen','open')}</span></div><div class=\"kggDayExerciseList\">${dayCards(day)}</div></button>`).join('');list.querySelectorAll('.kggDayCard[data-day]').forEach(btn=>btn.onclick=()=>openDay(Number(btn.dataset.day)||1));const moreBtn=$('kggHistoryMore');if(moreBtn)moreBtn.onclick=()=>{historyLimit+=30;renderHistory(total,cur)}}"
          rep('patient-day-history.js', old_hist, new_hist)

          # Multi-plan and delete flows must restore each plan's own day and keep T13+ done entries.
          rep('patient-multiplan-db.js',
              "function loadValuesForPlan(){safe(()=>{v=read(sk(),'{}')});safe(()=>{done=read(dk(),'[]').map(Number).filter(n=>n>=1&&n<=p.days)})}",
              "function loadValuesForPlan(){safe(()=>{v=read(sk(),'{}')});safe(()=>{const flow=window.KGGPatientDayFlow;done=flow&&typeof flow.normalizeDone==='function'?flow.normalizeDone(read(dk(),'[]')):read(dk(),'[]').map(Number).filter(n=>n>=1&&(p.extendDays!==false||n<=p.days))})}"
          )
          rep('patient-multiplan-db.js',
              "writeState(s);p=runtimeFromRaw(raw);persistCurrent(raw);loadValuesForPlan();safe(()=>save());safe(()=>render());",
              "writeState(s);p=runtimeFromRaw(raw);persistCurrent(raw);loadValuesForPlan();safe(()=>typeof restoreDay==='function'&&restoreDay());safe(()=>save());safe(()=>render());"
          )
          rep('patient-plan-delete.js',
              "safe(()=>{window.v=read(sk(),'{}')});safe(()=>{window.done=read(dk(),'[]').map(Number).filter(n=>n>=1&&n<=p.days)});\n    safe(()=>save());safe(()=>render());",
              "safe(()=>{window.v=read(sk(),'{}')});safe(()=>{const flow=window.KGGPatientDayFlow;window.done=flow&&typeof flow.normalizeDone==='function'?flow.normalizeDone(read(dk(),'[]')):read(dk(),'[]').map(Number).filter(n=>n>=1&&(p.extendDays!==false||n<=p.days))});\n    safe(()=>typeof restoreDay==='function'&&restoreDay());safe(()=>save());safe(()=>render());"
          )
          rep('patient-start-values-day1.js',
              "if(Number(p.days||0)>=2)d=2;else d=1;",
              "if(p.extendDays!==false||Number(p.days||0)>=2)d=2;else d=1;"
          )

          # Patient v75 identity and cache-busting for changed runtime modules.
          sw=read('service-worker.js')
          replacements={
              "const CACHE_NAME = 'kgg-handyplan-v74-vertical-exercise-pain';":"const CACHE_NAME = 'kgg-handyplan-v75-continuous-days';",
              "const APP_VERSION = '74';":"const APP_VERSION = '75';",
              "./patient-version-label.js?v=74":"./patient-version-label.js?v=75",
              "./patient-multiplan-db.js?v=lossless-media-plans-1":"./patient-multiplan-db.js?v=continuous-days-1",
              "./patient-plan-delete.js?v=plan-delete-1-safe":"./patient-plan-delete.js?v=continuous-days-1",
              "./patient-start-values-day1.js?v=start-values-day1-1":"./patient-start-values-day1.js?v=continuous-days-1",
              "./patient-day-history.js?v=plan-dialog-title-1":"./patient-day-history.js?v=continuous-days-1",
          }
          for old,new in replacements.items():
              if old not in sw: raise SystemExit(f'service-worker.js missing {old}')
              sw=sw.replace(old,new)
          write('service-worker.js',sw)
          rep('patient-version-label.js', "const RELEASE='74';", "const RELEASE='75';")
          rep('update-recovery.html', "const RELEASE='74';", "const RELEASE='75';")

          # Changelog note.
          changelog=Path('CHANGELOG_PATIENT_APP.md')
          if changelog.exists():
              text=changelog.read_text(encoding='utf-8')
              note="\n## v75 – Fortlaufende Trainingstage\n- Fortlaufende Pläne wechseln nach Abschluss automatisch auf den nächsten Trainingstag und sind nicht mehr durch den ursprünglichen Planhorizont begrenzt.\n- T13+ bleiben über Reload, Planwechsel und Plan-Löschen erhalten; feste Pläne mit `extendDays:false` bleiben begrenzt.\n- Die Trainingshistorie lädt ältere Tage in 30er-Schritten statt unbegrenzt DOM-Karten aufzubauen.\n"
              if '## v75 – Fortlaufende Trainingstage' not in text:
                  changelog.write_text(note+text,encoding='utf-8',newline='\n')
          PY
      - name: Commit runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html patient-day-history.js patient-multiplan-db.js patient-plan-delete.js patient-start-values-day1.js service-worker.js patient-version-label.js update-recovery.html CHANGELOG_PATIENT_APP.md
          git commit -m 'fix(patient): allow continuous training days'
          git push origin HEAD:fix/patient-continuous-training-days-v75
