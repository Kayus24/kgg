name: KGG Pain Lifecycle Remount Temp

on:
  push:
    branches:
      - feat/patient-vertical-pain-scale-v74
    paths:
      - .github/workflows/kgg-pain-lifecycle-remount-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-vertical-pain-scale-v74
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden day and plan rerender lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('patient-pain-vertical-scale.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace("const VERSION='vertical-pain-v4-floating-modal';","const VERSION='vertical-pain-v5-lifecycle-remount';",1)
          old="""    document.addEventListener('click',event=>{if(!modal||modal.overlay.hidden)return;const target=event.target&&event.target.closest?event.target.closest('#days button,#kggBubblePlans,#kggBubbleAdd,#kggBubbleReplace,#kggPlanScanBtn,#qr img'):null;if(target)closeModal({returnFocus:false})},true);
              addEventListener('resize',()=>scheduleMount(80),{passive:true});"""
          new="""    const refreshAfterLifecycleChange=()=>[0,80,250].forEach(delay=>setTimeout(()=>{observe();mountAll()},delay));
              document.addEventListener('click',event=>{
                const target=event.target&&event.target.closest?event.target.closest('#days button,#kggDayHub button,#kggBubblePlans,#kggBubbleAdd,#kggBubbleReplace,#kggPlanScanBtn,#qr img'):null;
                if(!target)return;
                if(modal&&!modal.overlay.hidden)closeModal({returnFocus:false});
                refreshAfterLifecycleChange()
              },true);
              addEventListener('resize',()=>scheduleMount(80),{passive:true});"""
          if old not in text: raise SystemExit('lifecycle handler target not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          node --check patient-pain-vertical-scale.js
      - name: Regenerate patient resources
        shell: bash
        run: |
          set -euo pipefail
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('docs/kgg-custom-gpt-resource-manifest.json').read_text(encoding='utf-8'))
          path=Path('docs/kgg-patient-custom-gpt-editor-snapshot.json')
          snapshot=json.loads(path.read_text(encoding='utf-8'))
          profile=manifest['patientProduction']
          snapshot['instructionsSha256']=profile['editorBootstrap']['sha256']
          snapshot['knowledgeSha256']=[item['sha256'] for item in profile['knowledge']]
          snapshot['actionSha256']=[item['sha256'] for item in profile['actions']]
          path.write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Commit fix and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/kgg-pain-lifecycle-remount-temp.yml
          git add patient-pain-vertical-scale.js docs/kgg-patient-gpt-context.md docs/kgg-patient-gpt-source-index.json docs/kgg-patient-gpt-source docs/kgg-patient-custom-gpt-knowledge-architecture.md docs/kgg-patient-custom-gpt-knowledge-operations.md docs/kgg-patient-custom-gpt-knowledge-safety.md docs/kgg-patient-custom-gpt-knowledge-testing.md docs/kgg-custom-gpt-resource-manifest.json docs/kgg-patient-custom-gpt-editor-snapshot.json
          git commit -m "fix(patient): remount pain control after day and plan renders"
          git push origin HEAD:feat/patient-vertical-pain-scale-v74
