name: KGG Patient Progression Legacy React Parity

on:
  pull_request:
    branches:
      - main
      - feat/patient-react-padgrid-p8-20261014
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/kgg-patient-progression-parity.yml'
      - 'release-pipeline/kgg_ticket_015_browser_smoke.js'
      - 'patient-set-summary-groups.js'
      - 'patient-react-dist/**'
      - 'patient-ui/**'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: kgg-progression-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  progression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    name: Progression ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: release-pipeline/package-lock.json
      - name: Syntax-check reused progression test
        run: node --check release-pipeline/kgg_ticket_015_browser_smoke.js
      - name: Install pinned Playwright and browser
        shell: bash
        run: |
          cd release-pipeline
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify Legacy, React P7 and React P8 progression journeys
        shell: bash
        env:
          KGG_PROGRESSION_BROWSER: ${{ matrix.browser }}
          KGG_PROGRESSION_PARITY: '1'
          KGG_PROGRESSION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node release-pipeline/kgg_ticket_015_browser_smoke.js | tee progression-parity.log
          count=$(grep -c '^KGG_PROGRESSION_PARITY_PASS ' progression-parity.log)
          if [ "$count" -ne 3 ]; then
            echo "Progression comparator missing modes: $count/3"
            exit 1
          fi
          grep -q '"mode":"react-p8"' progression-parity.log
