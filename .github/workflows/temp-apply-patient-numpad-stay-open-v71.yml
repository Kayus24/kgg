name: Temp apply patient numpad stay-open v71

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/patient-numpad-stay-open-v71'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply isolated v71 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)} for {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8',newline='\n')

          path='patient-numpad-visibility-fix.js'
          replace_once(path,"const VERSION='numpad-visibility-v9-commit-on-leave';","const VERSION='numpad-visibility-v10-stay-open-switch';")
          replace_once(path,"function commitEditing(){if(!open()||!editingInput||typeof window.closePad!=='function')return false;try{window.closePad(true);return true}catch(e){return false}}","function commitEditingInPlace(){if(!open()||!editingInput||!editingMeta||typeof window.put!=='function')return false;const value=padValue()||'0';try{editingInput.value=value;window.put(editingMeta.ei,editingMeta.s,editingMeta.side,editingMeta.key,value);return true}catch(e){return false}}")
          replace_once(path,"function patch(){if(window.__kggNumpadVisibilityPatchedV9)return;window.__kggNumpadVisibilityPatchedV9=1;if(typeof window.openPad==='function'){const oldOpen=window.openPad;window.openPad=function(input,meta){if(open()&&editingInput&&input&&input!==editingInput)commitEditing();editingInput=input||document.activeElement;editingMeta=meta||editingMeta;activeInput=editingInput;activeMeta=editingMeta;padSession+=1;const r=oldOpen.apply(this,arguments);space();if(largeUi())placeZoom(activeInput,true);ensure();return r}}if(typeof window.closePad==='function'){const oldClose=window.closePad;window.closePad=function(){const closedSession=padSession;const r=oldClose.apply(this,arguments);clearSoon(closedSession);return r}}if(typeof window.padUseLast==='function'){const oldLast=window.padUseLast;window.padUseLast=function(){const r=oldLast.apply(this,arguments);closeAfterLast();return r}}}","function patch(){if(window.__kggNumpadVisibilityPatchedV10)return;window.__kggNumpadVisibilityPatchedV10=1;if(typeof window.openPad==='function'){const oldOpen=window.openPad;window.openPad=function(input,meta){const switching=!!(open()&&editingInput&&input&&input!==editingInput);if(switching&&!commitEditingInPlace()&&typeof window.closePad==='function'){try{window.closePad(true)}catch(e){}}editingInput=input||document.activeElement;editingMeta=meta||editingMeta;activeInput=editingInput;activeMeta=editingMeta;padSession+=1;const r=oldOpen.apply(this,arguments);space();if(largeUi())placeZoom(activeInput,!switching);ensure();return r}}if(typeof window.closePad==='function'){const oldClose=window.closePad;window.closePad=function(){const closedSession=padSession;const r=oldClose.apply(this,arguments);clearSoon(closedSession);return r}}if(typeof window.padUseLast==='function'){const oldLast=window.padUseLast;window.padUseLast=function(){const r=oldLast.apply(this,arguments);closeAfterLast();return r}}}")
          replace_once(path,"document.addEventListener('pointerdown',e=>{if(!open())return;const t=e.target;if(isInputTarget(t)){if(editingInput&&t!==editingInput)commitEditing();return}if(isPadTarget(t))return;closeByOutsideTap()},true);","document.addEventListener('pointerdown',e=>{if(!open())return;const t=e.target;if(isInputTarget(t))return;if(isPadTarget(t))return;closeByOutsideTap()},true);")
          replace_once(path,"if(window.__KGG_TEST__)window.__kggNumpadCommitTest={open,commitEditing,getEditingInput:()=>editingInput,getSession:()=>padSession};","if(window.__KGG_TEST__)window.__kggNumpadCommitTest={open,commitEditingInPlace,getEditingInput:()=>editingInput,getSession:()=>padSession};")

          replace_once('service-worker.js',"const CACHE_NAME = 'kgg-handyplan-v70-numpad-commit-on-leave';","const CACHE_NAME = 'kgg-handyplan-v71-numpad-stay-open';")
          replace_once('service-worker.js',"const APP_VERSION = '70';","const APP_VERSION = '71';")
          replace_once('service-worker.js',"const VERSION_LABEL_SCRIPT = './patient-version-label.js?v=70';","const VERSION_LABEL_SCRIPT = './patient-version-label.js?v=71';")
          replace_once('service-worker.js',"const NUMPAD_VISIBILITY_SCRIPT = './patient-numpad-visibility-fix.js?v=commit-on-leave-1';","const NUMPAD_VISIBILITY_SCRIPT = './patient-numpad-visibility-fix.js?v=stay-open-switch-1';")
          replace_once('service-worker.js','<script src="./patient-numpad-visibility-fix.js?v=commit-on-leave-1"></script>','<script src="./patient-numpad-visibility-fix.js?v=stay-open-switch-1"></script>')
          replace_once('service-worker.js','<script src="./patient-version-label.js?v=70"></script>','<script src="./patient-version-label.js?v=71"></script>')
          replace_once('patient-version-label.js',"const RELEASE='70';","const RELEASE='71';")
          replace_once('update-recovery.html',"const RELEASE='70';","const RELEASE='71';")

          replace_once('release-pipeline/kgg_pwa_contract_smoke.py','VERSION="70"','VERSION="71"')
          replace_once('release-pipeline/kgg_pwa_contract_smoke.py','kgg-handyplan-v70-numpad-commit-on-leave','kgg-handyplan-v71-numpad-stay-open')
          replace_once('release-pipeline/kgg_pwa_contract_smoke.py',"const APP_VERSION = '70';","const APP_VERSION = '71';")
          replace_once('release-pipeline/kgg_pwa_contract_smoke.py','./patient-version-label.js?v=70','./patient-version-label.js?v=71')
          replace_once('release-pipeline/kgg_pwa_contract_smoke.py','./patient-numpad-visibility-fix.js?v=commit-on-leave-1','./patient-numpad-visibility-fix.js?v=stay-open-switch-1')
          replace_once('release-pipeline/kgg_pwa_contract_smoke.py',"const RELEASE='70';","const RELEASE='71';")
          replace_once('release-pipeline/kgg_update_recovery_smoke.py',"const RELEASE='70';","const RELEASE='71';")
          replace_once('release-pipeline/kgg_update_recovery_smoke.py','kgg-handyplan-v70-numpad-commit-on-leave','kgg-handyplan-v71-numpad-stay-open')
          replace_once('release-pipeline/kgg_update_recovery_smoke.py',"const APP_VERSION = '70';","const APP_VERSION = '71';")

          test=r'''#!/usr/bin/env node
          'use strict';

          const fs=require('fs');
          const path=require('path');
          const vm=require('vm');

          const ROOT=path.resolve(__dirname,'..');
          const source=fs.readFileSync(path.join(ROOT,'patient-numpad-visibility-fix.js'),'utf8');
          function assert(condition,message){if(!condition)throw new Error(message)}

          function classList(initial=[]){
            const values=new Set(initial);
            return {add(...xs){xs.forEach(x=>values.add(x))},remove(...xs){xs.forEach(x=>values.delete(x))},contains(x){return values.has(x)},toggle(x,on){if(on===undefined)on=!values.has(x);on?values.add(x):values.delete(x);return on}};
          }
          function input(name){return {name,value:'',placeholder:'kg',classList:classList(),matches(sel){return sel==='input.num'},closest(){return null},getBoundingClientRect(){return {left:20,top:100,right:140,bottom:150,width:120,height:50}}}}

          const timers=[];
          const listeners={};
          const padBox={getBoundingClientRect(){return {left:0,top:600,right:400,bottom:800,width:400,height:200}}};
          const pad={classList:classList(['hide']),querySelector(sel){return sel==='.padBox'?padBox:null}};
          const padVal={textContent:'0'};
          const main={style:{}};
          const body={classList:classList(),appendChild(){}};
          const document={
            readyState:'complete',activeElement:null,body,head:{appendChild(){}},documentElement:{clientWidth:400},
            getElementById(id){if(id==='pad')return pad;if(id==='padVal')return padVal;return null},
            querySelector(sel){return sel==='main'?main:null},querySelectorAll(){return []},
            createElement(){return {id:'',style:{},classList:classList(),remove(){},querySelector(){return null}}},
            addEventListener(type,fn){(listeners[type]||(listeners[type]=[])).push(fn)}
          };
          function fire(type,target){for(const fn of listeners[type]||[])fn({target})}
          function flush(maxDelay=Infinity){const ready=timers.filter(t=>t.delay<=maxDelay);for(const t of ready)timers.splice(timers.indexOf(t),1);ready.sort((a,b)=>a.delay-b.delay).forEach(t=>t.fn())}

          const commits=[];
          const closeCalls=[];
          let baseActive=null;
          const outside={matches(){return false},closest(){return null}};
          const context={console,document,MutationObserver:function(){this.observe=()=>{};this.disconnect=()=>{}},getComputedStyle(){return {fontSize:'16px',borderRadius:'12px'}},requestAnimationFrame(fn){fn()},addEventListener(){},setTimeout(fn,delay=0){timers.push({fn,delay});return timers.length},clearTimeout(){},window:{
            __KGG_TEST__:true,innerWidth:400,innerHeight:800,scrollBy(){},
            put(ei,s,side,key,value){commits.push({ei,s,side,key,value})},
            openPad(el,meta){baseActive={el,meta};document.activeElement=el;pad.classList.remove('hide');padVal.textContent=el.value||'0'},
            closePad(ok){closeCalls.push(ok);if(ok&&baseActive){const value=padVal.textContent||'0';baseActive.el.value=value;const m=baseActive.meta;context.window.put(m.ei,m.s,m.side,m.key,value)}pad.classList.add('hide');baseActive=null},
            padUseLast(){padVal.textContent='9'}
          }};
          context.window.window=context.window;context.window.document=document;context.globalThis=context;
          vm.createContext(context);vm.runInContext(source,context,{filename:'patient-numpad-visibility-fix.js'});

          const a=input('A'),b=input('B'),c=input('C'),d=input('D'),e=input('E'),f=input('F');
          const ma={ei:0,s:1,side:'B',key:'a'},mb={ei:0,s:1,side:'B',key:'b'},mc={ei:0,s:2,side:'B',key:'a'};
          context.window.openPad(a,ma);padVal.textContent='12';
          fire('pointerdown',b);
          assert(commits.length===0,'pointerdown committed before the target field opened');
          context.window.openPad(b,mb);
          assert(commits.length===1&&commits[0].value==='12'&&a.value==='12','field A was not saved during the in-place switch');
          assert(closeCalls.length===0,'field switch called closePad and caused a visible blink');
          assert(!pad.classList.contains('hide'),'numpad closed during A to B switch');
          assert(context.window.__kggNumpadCommitTest.getEditingInput()===b,'field B did not become the active editor');

          padVal.textContent='20';
          context.window.openPad(c,mc);
          assert(commits.length===2&&commits[1].value==='20'&&b.value==='20','field B was not saved during the next in-place switch');
          assert(closeCalls.length===0&&!pad.classList.contains('hide'),'numpad blinked during B to C switch');
          flush(120);
          assert(context.window.__kggNumpadCommitTest.getEditingInput()===c,'delayed cleanup cleared the open field C');

          padVal.textContent='30';
          fire('pointerdown',outside);
          assert(closeCalls.length===1&&closeCalls[0]===true,'outside tap did not close with save');
          assert(commits.length===3&&commits[2].value==='30','outside tap did not save field C');
          flush(120);
          assert(context.window.__kggNumpadCommitTest.getEditingInput()===null,'closed editor was not cleaned after outside save');

          context.window.openPad(d,ma);padVal.textContent='44';
          fire('pointerdown',d);
          assert(commits.length===3,'same-field pointerdown caused an unnecessary save');
          context.window.closePad(false);flush(120);
          assert(commits.length===3,'cancel path saved field D');

          context.window.openPad(e,ma);padVal.textContent='55';
          context.window.openPad(f,mb);
          assert(commits.length===4&&commits[3].value==='55','programmatic field switch did not save field E');
          assert(closeCalls.length===2&&closeCalls[1]===false,'programmatic switch unexpectedly closed the numpad');
          assert(!pad.classList.contains('hide'),'numpad was not left open after programmatic switch');

          console.log('Patient numpad stay-open switch smoke: OK');
          '''
          lines=[line[10:] if line.startswith('          ') else line for line in test.splitlines()]
          Path('release-pipeline/kgg_patient_numpad_commit_smoke.js').write_text('\n'.join(lines).rstrip()+'\n',encoding='utf-8',newline='\n')
          PY

          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --write || true
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path=Path('docs/kgg-custom-gpt-resource-manifest.json')
          snapshot_path=Path('docs/kgg-patient-custom-gpt-editor-snapshot.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          snapshot=json.loads(snapshot_path.read_text(encoding='utf-8'))
          snapshot['knowledgeSha256']=[item['sha256'] for item in manifest['patientProduction']['knowledge']]
          snapshot_path.write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_custom_gpt_resource_audit.py --write
          rm .github/workflows/temp-apply-patient-numpad-stay-open-v71.yml
      - name: Commit v71 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep patient numpad open while switching fields (v71)'
          git push origin HEAD:${{ github.head_ref }}
