name: KGG Patient Resource Contract Finalize

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: kgg-patient-resource-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild manifest and patient editor snapshot from audit source of truth
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root=Path.cwd()
          script=root/'release-pipeline/kgg_custom_gpt_resource_audit.py'
          spec=importlib.util.spec_from_file_location('kgg_resource_audit',script)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected=module.expected_manifest()
          module.OUTPUT.write_text(module.normalize(expected),encoding='utf-8',newline='\n')

          snapshot_path=root/'docs/kgg-patient-custom-gpt-editor-snapshot.json'
          snapshot=json.loads(snapshot_path.read_text(encoding='utf-8'))
          patient=expected['patientProduction']
          snapshot['profileVersion']=patient['profileVersion']
          snapshot['bootstrapVersion']=patient['editorBootstrap']['version']
          snapshot['instructionsSha256']=patient['editorBootstrap']['sha256']
          snapshot['knowledgeSha256']=[item['sha256'] for item in patient['knowledge']]
          snapshot['actionSha256']=[item['sha256'] for item in patient['actions']]
          snapshot_path.write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Remove finalizer and commit exact contract files
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/kgg-patient-resource-contract-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kgg-custom-gpt-resource-manifest.json \
            docs/kgg-patient-custom-gpt-editor-snapshot.json \
            .github/workflows/kgg-patient-resource-contract-finalize.yml
          git diff --cached --check
          git commit -m "Refresh patient GPT resource contract"
          git push origin "HEAD:${HEAD_BRANCH}"
