name: KGG Patient Settings Side Legacy React Parity

on:
  pull_request:
    branches:
      - main
      - feat/patient-react-padgrid-p8-20261014
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/kgg-patient-settings-side-parity.yml'
      - 'release-pipeline/kgg_patient_settings_side_parity_playwright.js'
      - 'patient-card-settings.js'
      - 'patient-ui/**'
      - 'patient-react-dist/**'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: kgg-settings-side-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    name: Settings side-copy ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: release-pipeline/package-lock.json
      - name: Validate synthetic parity script
        run: node --check release-pipeline/kgg_patient_settings_side_parity_playwright.js
      - name: Install pinned Playwright and browser
        shell: bash
        run: |
          cd release-pipeline
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Require real Legacy, P7 and P8 settings parity
        shell: bash
        env:
          KGG_SETTINGS_BROWSER: ${{ matrix.browser }}
          KGG_SETTINGS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node release-pipeline/kgg_patient_settings_side_parity_playwright.js | tee settings-side.log
          count=$(grep -c '^KGG_PATIENT_SETTINGS_PARITY_PASS ' settings-side.log)
          if [ "$count" -ne 3 ]; then
            echo "Expected 3 passed modes, got $count"
            exit 1
          fi
          grep -q "KGG patient settings-side parity: PASS ${{ matrix.browser }} (3 modes)" settings-side.log
