name: KGG Pain Pointer Test Finalize

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: kgg-pain-pointer-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Replace unsupported CDP touch driver with DOM PointerEvents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('release-pipeline/kgg_patient_pain_vertical_playwright.js')
          text = path.read_text(encoding='utf-8')
          old = '''async function touchDrag(cdp, x, startY, endY, steps=8) {
            const point = y => ({ x:Math.round(x), y:Math.round(y), radiusX:8, radiusY:8, force:1, id:1 });
            await cdp.send("Input.dispatchTouchEvent", { type:"touchStart", touchPoints:[point(startY)] });
            for (let step=1; step<=steps; step+=1) {
              const y=startY+(endY-startY)*(step/steps);
              await cdp.send("Input.dispatchTouchEvent", { type:"touchMove", touchPoints:[point(y)] });
            }
            await cdp.send("Input.dispatchTouchEvent", { type:"touchEnd", touchPoints:[] });
          }'''.replace('          ','')
          new = '''async function pointerDrag(stage, x, startY, endY, steps=8) {
            await stage.evaluate((element, gesture) => {
              const dispatch=(type,y,buttons)=>element.dispatchEvent(new PointerEvent(type,{
                bubbles:true,cancelable:true,composed:true,pointerId:91,pointerType:"touch",
                isPrimary:true,button:0,buttons,clientX:gesture.x,clientY:y
              }));
              dispatch("pointerdown",gesture.startY,1);
              for(let step=1;step<=gesture.steps;step+=1){
                const y=gesture.startY+(gesture.endY-gesture.startY)*(step/gesture.steps);
                dispatch("pointermove",y,1);
              }
              dispatch("pointerup",gesture.endY,0);
            },{x,startY,endY,steps});
          }'''.replace('          ','')
          if old not in text:
              raise SystemExit('touchDrag helper anchor missing')
          text = text.replace(old,new,1)
          old = '''  const page=await context.newPage();
            const cdp=await context.newCDPSession(page);
            await cdp.send("Emulation.setTouchEmulationEnabled",{enabled:true,maxTouchPoints:1});'''.replace('          ','')
          new = '  const page=await context.newPage();'
          if old not in text:
              raise SystemExit('CDP setup anchor missing')
          text = text.replace(old,new,1)
          old = '    await touchDrag(cdp,box.x+35,box.y+box.height-22,box.y+22,8);'
          new = '    await pointerDrag(stage,box.x+35,box.y+box.height-22,box.y+22,8);'
          if old not in text:
              raise SystemExit('touch drag invocation anchor missing')
          text = text.replace(old,new,1)
          old = '    assert(dragState.current==="10/10",`touch drag did not commit 10: ${JSON.stringify(dragState)}`);'
          new = '''    const pointerTypes=dragState.pointerLog.map(event=>event.type);
            assert(pointerTypes[0]==="pointerdown"&&pointerTypes.includes("pointermove")&&pointerTypes.at(-1)==="pointerup",`pointer drag sequence is incomplete: ${JSON.stringify(dragState)}`);
            assert(dragState.current==="10/10",`pointer drag did not commit 10: ${JSON.stringify(dragState)}`);'''.replace('          ','')
          if old not in text:
              raise SystemExit('drag assertion anchor missing')
          text = text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Remove finalizer and commit test driver
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/kgg-pain-pointer-test-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-pipeline/kgg_patient_pain_vertical_playwright.js .github/workflows/kgg-pain-pointer-test-finalize.yml
          git diff --cached --check
          git commit -m "Test pain dragging through PointerEvents"
          git push origin "HEAD:${HEAD_BRANCH}"
