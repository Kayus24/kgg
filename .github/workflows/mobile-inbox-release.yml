name: KGG Mobile Inbox Release

on:
  push:
    branches:
      - mobile-inbox
    paths:
      - 'mobile-inbox/*.html'
      - 'mobile-inbox/**/*.html'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kgg-mobile-inbox-release
  cancel-in-progress: false

jobs:
  build-release-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout uploaded inbox branch
        uses: actions/checkout@v4
        with:
          path: upload
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Checkout main release source
        uses: actions/checkout@v4
        with:
          path: base
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select uploaded HTML
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          cd upload
          mapfile -t changed_html < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -Ei '^mobile-inbox/.*\.html$' || true
          )
          if [[ "${#changed_html[@]}" -gt 1 ]]; then
            echo "Expected exactly one changed HTML file below mobile-inbox/." >&2
            printf '%s\n' "${changed_html[@]}" >&2
            exit 1
          fi
          if [[ "${#changed_html[@]}" -eq 1 ]]; then
            candidate="${changed_html[0]}"
          else
            mapfile -t html_files < <(find mobile-inbox -type f -iname '*.html' | sort)
            if [[ "${#html_files[@]}" -ne 1 ]]; then
              echo "Expected exactly one changed HTML file below mobile-inbox/." >&2
              printf '%s\n' "${html_files[@]}" >&2
              exit 1
            fi
            candidate="${html_files[0]}"
          fi
          echo "candidate=$PWD/$candidate" >> "$GITHUB_OUTPUT"

      - name: Validate mobile HTML and create release inbox
        id: mobile
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/mobile_inbox.py \
            --candidate '${{ steps.candidate.outputs.candidate }}' \
            --release-json release-inbox/release.json \
            --copy-to release-inbox/admin.html \
            --github-output "$GITHUB_OUTPUT"

      - name: Build immutable Admin and colleague artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/release_pipeline.py prepare \
            --candidate release-inbox/admin.html \
            --release-json release-inbox/release.json
          rm -f release-inbox/admin.html release-inbox/release.json

      - name: Refresh generated GPT release context
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_gpt_context.py --write
          python release-pipeline/kgg_bug_knowledge.py --write
          python release-pipeline/kgg_gpt_source_context.py --write
          python release-pipeline/kgg_custom_gpt_knowledge_pack.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile production

      - name: Run release contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python -m unittest release-pipeline/test_release_pipeline.py
          node release-pipeline/check_html_scripts.js kgg-update/index.html therapist-app/releases/web/*/*.html

      - name: Stage release artifacts and reject secrets
        shell: bash
        run: |
          set -euo pipefail
          cd base
          git add -A -- release-inbox therapist-app/android_update_manifest.json therapist-app/kgg_update_manifest.json therapist-app/releases/web
          git add -A -- docs/kgg-gpt-context.md docs/kgg-gpt-bug-index.json docs/kgg-gpt-bug-lessons.md docs/kgg-gpt-patch-patterns.md docs/kgg-gpt-source-index.json docs/kgg-gpt-area-routes.md docs/kgg-gpt-area-routes.json docs/kgg-gpt-source docs/kgg-custom-gpt-knowledge-pack.md docs/kgg-custom-gpt-eval-knowledge.md docs/kgg-custom-gpt-knowledge-architecture.md docs/kgg-custom-gpt-knowledge-operations.md docs/kgg-custom-gpt-knowledge-safety.md docs/kgg-custom-gpt-knowledge-testing.md docs/kgg-custom-gpt-resource-manifest.json docs/kgg-custom-gpt-editor-snapshot.json
          python release-pipeline/kgg_secret_scan.py

      - name: Create draft release PR for external review
        shell: bash
        run: |
          set -euo pipefail
          cd base
          branch="mobile/admin-${{ steps.mobile.outputs.release_id }}-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A release-inbox therapist-app/android_update_manifest.json therapist-app/kgg_update_manifest.json therapist-app/releases/web
          git add -A -- docs/kgg-gpt-context.md docs/kgg-gpt-bug-index.json docs/kgg-gpt-bug-lessons.md docs/kgg-gpt-patch-patterns.md docs/kgg-gpt-source-index.json docs/kgg-gpt-area-routes.md docs/kgg-gpt-area-routes.json docs/kgg-gpt-source docs/kgg-custom-gpt-knowledge-pack.md docs/kgg-custom-gpt-eval-knowledge.md docs/kgg-custom-gpt-knowledge-architecture.md docs/kgg-custom-gpt-knowledge-operations.md docs/kgg-custom-gpt-knowledge-safety.md docs/kgg-custom-gpt-knowledge-testing.md docs/kgg-custom-gpt-resource-manifest.json docs/kgg-custom-gpt-editor-snapshot.json
          git commit -m "mobile inbox admin beta ${{ steps.mobile.outputs.release_id }}"
          git push -u origin "$branch"
          body="$(mktemp)"
          cat > "$body" <<'BODY'
          Automatisch aus der KGG Mobile-Inbox erzeugt.

          - HTML wurde gegen den aktuellen KGG-Vertrag validiert.
          - Admin- und Kolleg:innen-Artefakte wurden aus derselben geprueften Quelle erzeugt.
          - GPT-Kontext, Knowledge und Resource-Zielartefakte wurden deterministisch aktualisiert.
          - Dieser GITHUB_TOKEN-Lauf startet oder bewertet keine PR-Checks.
          - Keine direkte Aenderung an main; Draft auf "Ready for review" setzen, normale Checks abwarten und erst dann extern mergen.
          BODY
          url="$(gh pr create --draft --base main --head "$branch" \
            --title "[admin-beta] ${{ steps.mobile.outputs.release_id }} ${{ steps.mobile.outputs.version_name }}" \
            --body-file "$body")"
          {
            echo "## Draft-PR erzeugt"
            echo ""
            echo "- PR: $url"
            echo "- Checks: von diesem GITHUB_TOKEN-Lauf weder gestartet noch als gruen bewertet"
            echo "- Naechster Schritt: extern auf Ready for review setzen, Required Gate abwarten und nur bei gruenen Checks mergen"
          } >> "$GITHUB_STEP_SUMMARY"
