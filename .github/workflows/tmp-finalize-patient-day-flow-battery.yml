name: TEMP finalize patient day flow battery

on:
  push:
    branches:
      - fix/patient-continuous-training-days-v75
    paths:
      - .github/workflows/tmp-finalize-patient-day-flow-battery.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch battery and stage required gate copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          battery_path = Path('release-pipeline/kgg_test_battery.py')
          battery = battery_path.read_text(encoding='utf-8')

          marker = '''def run_admin_camera_qr() -> None:\n'''
          if 'def run_patient_day_flow_browser() -> None:' not in battery:
              insert = '''def run_patient_day_flow_smoke() -> None:\n    log("== Patient continuous day-flow critical smoke ==")\n    run([node_executable(), "release-pipeline/kgg_patient_continuous_days_smoke.js"])\n\n\ndef run_patient_day_flow_browser() -> None:\n    global PATIENT_SCAN_PREPARED\n    npm = npm_executable()\n    if not npm:\n        raise BatteryError("npm not found. Install npm or set KGG_NPM for the patient day-flow browser battery.")\n    if not PATIENT_SCAN_PREPARED:\n        run([npm, "--prefix", "release-pipeline", "ci", "--ignore-scripts"])\n        if os.environ.get("KGG_SKIP_PLAYWRIGHT_INSTALL") != "1":\n            run([node_executable(), "release-pipeline/node_modules/playwright/cli.js", "install", "--with-deps", "chromium"])\n        PATIENT_SCAN_PREPARED = True\n    log("== Patient continuous day-flow browser regression ==")\n    run([node_executable(), "release-pipeline/kgg_patient_continuous_days_playwright.js"])\n\n\n'''
              if marker not in battery:
                  raise SystemExit('battery insertion marker missing')
              battery = battery.replace(marker, insert + marker, 1)

          registry_marker = '''    {\n        "id": "selftest-gate-critical",\n'''
          if '"id": "patient-continuous-days-critical"' not in battery:
              entries = '''    {\n        "id": "patient-continuous-days-critical",\n        "level": "critical",\n        "suite": "patient-day-flow",\n        "reason": "Continuous patient plans must advance beyond their original day horizon without dropping T13+ state.",\n        "run": run_patient_day_flow_smoke,\n    },\n'''
              if registry_marker not in battery:
                  raise SystemExit('critical registry marker missing')
              battery = battery.replace(registry_marker, entries + registry_marker, 1)

          regression_marker = '''    {\n        "id": "patient-scan-camera-regression",\n'''
          if '"id": "patient-continuous-days-regression"' not in battery:
              entry = '''    {\n        "id": "patient-continuous-days-regression",\n        "level": "regression",\n        "suite": "patient-day-flow",\n        "reason": "Training completion, QR day identity, reload, paged history and per-plan day state must work together in a real browser.",\n        "run": run_patient_day_flow_browser,\n    },\n'''
              if regression_marker not in battery:
                  raise SystemExit('regression registry marker missing')
              battery = battery.replace(regression_marker, entry + regression_marker, 1)

          old_choices = 'choices=["all", "hygiene", "mobile-inbox", "sync", "native-sync", "textblocks", "pdf", "patient-qr", "patient-scan", "camera-qr", "ui-stability", "syntax", "security", "release", "android", "gpt"],'
          new_choices = 'choices=["all", "hygiene", "mobile-inbox", "sync", "native-sync", "textblocks", "pdf", "patient-qr", "patient-day-flow", "patient-scan", "camera-qr", "ui-stability", "syntax", "security", "release", "android", "gpt"],'
          if old_choices in battery:
              battery = battery.replace(old_choices, new_choices, 1)
          elif new_choices not in battery:
              raise SystemExit('suite choices marker missing')
          battery_path.write_text(battery, encoding='utf-8', newline='\n')

          gate = Path('.github/workflows/kgg-required-gate.yml').read_text(encoding='utf-8')
          if 'patient_day_flow=false' not in gate:
              gate = gate.replace('          patient_runtime=false\n', '          patient_runtime=false\n          patient_day_flow=false\n', 1)
          scope_line = "          if grep -Eq '^service-worker\\.js$|^patient-version-label\\.js$|^update-recovery\\.html$|^patient-card-progress\\.js$|^collapse-cards\\.js$|^release-pipeline/kgg_patient_(card_progress_smoke|runtime_progress_playwright|pain_vertical_(smoke|playwright))\\.js$|^patient-pain-vertical-scale\\.js$|^release-pipeline/package(-lock)?\\.json$|^\\.github/workflows/kgg-required-gate\\.yml$' \"$changed_file\"; then patient_runtime=true; fi\n"
          day_scope = "          if grep -Eq '^index\\.html$|^patient-(day-history|multiplan-db|plan-delete|start-values-day1|card-settings)\\.js$|^release-pipeline/kgg_patient_continuous_days_(smoke|playwright)\\.js$|^release-pipeline/kgg_test_battery\\.py$|^\\.github/workflows/kgg-required-gate\\.yml$' \"$changed_file\"; then patient_day_flow=true; fi\n"
          if 'then patient_day_flow=true; fi' not in gate:
              if scope_line not in gate:
                  raise SystemExit('required gate patient_runtime scope marker missing')
              gate = gate.replace(scope_line, scope_line + day_scope, 1)
          if 'echo "patient_day_flow=$patient_day_flow"' not in gate:
              gate = gate.replace('          echo "patient_runtime=$patient_runtime" >> "$GITHUB_OUTPUT"\n', '          echo "patient_runtime=$patient_runtime" >> "$GITHUB_OUTPUT"\n          echo "patient_day_flow=$patient_day_flow" >> "$GITHUB_OUTPUT"\n', 1)
          old_install = "        if: steps.scope.outputs.patient_gpt == 'true' || steps.scope.outputs.patient_runtime == 'true'\n"
          new_install = "        if: steps.scope.outputs.patient_gpt == 'true' || steps.scope.outputs.patient_runtime == 'true' || steps.scope.outputs.patient_day_flow == 'true'\n"
          if old_install in gate:
              gate = gate.replace(old_install, new_install, 1)
          elif new_install not in gate:
              raise SystemExit('browser install condition marker missing')
          step_marker = '''      - name: Run patient runtime and progress Playwright smoke\n'''
          if 'Run permanent patient continuous day-flow regression' not in gate:
              new_step = '''      - name: Run permanent patient continuous day-flow regression\n        if: steps.scope.outputs.patient_day_flow == 'true'\n        shell: bash\n        env:\n          KGG_SKIP_PLAYWRIGHT_INSTALL: '1'\n        run: python release-pipeline/kgg_test_battery.py --suite patient-day-flow --level regression\n'''
              if step_marker not in gate:
                  raise SystemExit('required gate browser step marker missing')
              gate = gate.replace(step_marker, new_step + step_marker, 1)
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/kgg-required-gate-day-flow.yml').write_text(gate, encoding='utf-8', newline='\n')
          PY
          python -m py_compile release-pipeline/kgg_test_battery.py
          node release-pipeline/kgg_patient_continuous_days_smoke.js
          python release-pipeline/kgg_test_battery.py --list --suite patient-day-flow --level regression
      - name: Commit staged non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-pipeline/kgg_test_battery.py
          git add -f tmp/kgg-required-gate-day-flow.yml
          git commit -m 'test: make continuous patient days a permanent battery' || exit 0
          git push origin HEAD:fix/patient-continuous-training-days-v75
