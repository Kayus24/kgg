name: Temporary integrate PR150 pain patch onto current main

on:
  push:
    branches:
      - integration/pr150-pain-v74-current-main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr150-pain-v74-current-main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate approved patient pain runtime and resources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/patient-vertical-pain-scale-v74
          git checkout origin/feat/patient-vertical-pain-scale-v74 -- \
            patient-pain-vertical-scale.js \
            patient-version-label.js \
            service-worker.js \
            update-recovery.html \
            release-pipeline/kgg_patient_pain_vertical_smoke.js \
            release-pipeline/kgg_patient_pain_vertical_playwright.js

          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile patientProduction
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
          node release-pipeline/kgg_patient_pain_vertical_smoke.js

          git add patient-pain-vertical-scale.js patient-version-label.js service-worker.js update-recovery.html \
            release-pipeline/kgg_patient_pain_vertical_smoke.js \
            release-pipeline/kgg_patient_pain_vertical_playwright.js \
            docs/kgg-patient-gpt-context.md docs/kgg-patient-gpt-source-index.json \
            docs/kgg-patient-gpt-source docs/kgg-patient-custom-gpt-knowledge-architecture.md \
            docs/kgg-patient-custom-gpt-knowledge-operations.md docs/kgg-patient-custom-gpt-knowledge-safety.md \
            docs/kgg-patient-custom-gpt-knowledge-testing.md docs/kgg-patient-custom-gpt-editor-snapshot.json \
            docs/kgg-custom-gpt-resource-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rebase patient pain modal onto current main'
          git push origin HEAD:integration/pr150-pain-v74-current-main
