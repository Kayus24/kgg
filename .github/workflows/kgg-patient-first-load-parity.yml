name: KGG Patient First Load Legacy React Parity

on:
  pull_request:
    branches:
      - main
      - feat/patient-react-padgrid-p8-20261014
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/kgg-patient-first-load-parity.yml'
      - 'release-pipeline/kgg_patient_preview_first_load_smoke.js'
      - 'patient-react-dist/**'
      - 'patient-ui/**'
      - 'patient-start-scan.js'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: kgg-firstload-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    name: First-load ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: release-pipeline/package-lock.json
      - name: Verify reused first-load test syntax
        run: node --check release-pipeline/kgg_patient_preview_first_load_smoke.js
      - name: Install pinned browser and Playwright
        shell: bash
        run: |
          cd release-pipeline
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Require first-load and rescue in Legacy, P7 and P8
        shell: bash
        env:
          KGG_FIRST_LOAD_BROWSER: ${{ matrix.browser }}
          KGG_FIRST_LOAD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          : > firstload-parity.log
          for mode in legacy react-p7 react-p8; do
            KGG_FIRST_LOAD_MODE="$mode" node release-pipeline/kgg_patient_preview_first_load_smoke.js . | tee -a firstload-parity.log
          done
          count=$(grep -c '"status":"PASS"' firstload-parity.log)
          [ "$count" -eq 3 ] || { echo "First-load cases missing: $count/3"; exit 1; }
          for mode in legacy react-p7 react-p8; do
            grep -q '"mode":"'"$mode"'"' firstload-parity.log
          done
