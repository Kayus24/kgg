name: KGG Patient UI Legacy React Parity

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Full integrated acceptance or temporary scanner diagnostics
        type: choice
        required: true
        default: integrated
        options: [integrated, scan-diagnostics]
  pull_request:
    branches: [main, feat/patient-react-padgrid-p8-20261014]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'patient-*.js'
      - 'patient-ui/**'
      - 'patient-react-dist/**'
      - 'release-pipeline/kgg_patient_*'
      - 'release-pipeline/kgg_ticket_015_browser_smoke.js'
      - 'release-pipeline/patient-integrated-suites.json'
      - 'docs/quality/patient-react-*'
      - '.github/workflows/kgg-patient-ui-parity.yml'
permissions:
  contents: read
concurrency:
  group: patient-integrated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    name: ${{ matrix.browser }} ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'scan-diagnostics' && 'scanner diagnostics (4 required replays)' || 'integrated Legacy P7 P8 acceptance' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: release-pipeline/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify report rejection contracts before running browsers
        run: |
          python -m py_compile release-pipeline/kgg_patient_integrated_acceptance.py
          node --test release-pipeline/kgg_patient_full_acceptance_report.test.mjs
          node --check release-pipeline/kgg_patient_ui_parity_capture.js
      - name: Install pinned browser dependencies
        shell: bash
        run: |
          cd release-pipeline
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }} chromium
      - name: Require one immutable combined acceptance candidate
        if: github.event_name != 'workflow_dispatch' || inputs.profile != 'scan-diagnostics'
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python release-pipeline/kgg_patient_integrated_acceptance.py \
            --engine ${{ matrix.browser }} \
            --out "$RUNNER_TEMP/kgg-integrated-${{ matrix.browser }}/patient-ui-parity"
      - name: Diagnose scanner on four required fresh replays
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'scan-diagnostics'
        shell: bash
        env:
          KGG_SCAN_FALLBACK_BROWSER: ${{ matrix.browser }}
          KGG_SCAN_FALLBACK_HEAD_SHA: ${{ github.sha }}
          KGG_SCAN_FALLBACK_DIAGNOSTICS: '1'
          DEBUG: pw:browser
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = diagnostic/patient-webkit-scan-20261018
          test "$(git rev-parse HEAD)" = "$KGG_SCAN_FALLBACK_HEAD_SHA"
          for attempt in 1 2 3 4; do
            out="$RUNNER_TEMP/kgg-integrated-${{ matrix.browser }}/patient-ui-parity/attempt-$attempt"
            test ! -e "$out"
            mkdir -p "$out"
            KGG_SCAN_FALLBACK_DIAGNOSTIC_ATTEMPT="$attempt" \
              node release-pipeline/kgg_patient_scan_fallback_parity_playwright.js 2>&1 | tee "$out/process.log"
          done
          echo "SCAN_DIAGNOSTICS_4_OF_4_PASS $KGG_SCAN_FALLBACK_BROWSER $KGG_SCAN_FALLBACK_HEAD_SHA"
      - name: Keep complete evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-patient-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/kgg-integrated-${{ matrix.browser }}/patient-ui-parity
          retention-days: 7
          if-no-files-found: error
