name: KGG Pain Mode Source Temp

on:
  push:
    branches:
      - feat/patient-vertical-pain-scale-v74
    paths:
      - .github/workflows/kgg-pain-mode-source-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-vertical-pain-scale-v74
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pain mode from runtime data before DOM enhancement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('patient-pain-vertical-scale.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace("const VERSION='vertical-pain-v5-lifecycle-remount';","const VERSION='vertical-pain-v6-mode-source';",1)
          marker="""  function mountRoot(root,ei){
              const card=root.closest('.ex');
              const setMode=Boolean(card&&card.querySelector('.kggSetPain'))||root.classList.contains('kggHiddenGlobalPain')||root.style.display==='none';"""
          replacement="""  function exercisePainMode(ei){
              const ex=safe(()=>p&&Array.isArray(p.ex)?p.ex[ei]:null);
              const runtimeMode=String(ex&&ex.painMode||'').toLowerCase();
              if(runtimeMode)return runtimeMode;
              const settings=safe(()=>JSON.parse(localStorage.getItem('kggPatientExerciseSettingsV1')||'{}'))||{};
              const planId=String(safe(()=>p.id)||'plan'),name=String(ex&&ex.n||'exercise');
              const saved=settings[(planId+'|'+name).toLowerCase()];
              return String(saved&&saved.painMode||'exercise').toLowerCase()
            }
            function mountRoot(root,ei){
              const card=root.closest('.ex');
              const setMode=exercisePainMode(ei)==='set'||Boolean(card&&card.querySelector('.kggSetPain'))||root.classList.contains('kggHiddenGlobalPain')||root.style.display==='none';"""
          if marker not in text: raise SystemExit('mountRoot marker not found')
          path.write_text(text.replace(marker,replacement,1),encoding='utf-8',newline='\n')
          PY
          node --check patient-pain-vertical-scale.js
      - name: Regenerate patient resources
        shell: bash
        run: |
          set -euo pipefail
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('docs/kgg-custom-gpt-resource-manifest.json').read_text(encoding='utf-8'))
          path=Path('docs/kgg-patient-custom-gpt-editor-snapshot.json')
          snapshot=json.loads(path.read_text(encoding='utf-8'))
          profile=manifest['patientProduction']
          snapshot['instructionsSha256']=profile['editorBootstrap']['sha256']
          snapshot['knowledgeSha256']=[item['sha256'] for item in profile['knowledge']]
          snapshot['actionSha256']=[item['sha256'] for item in profile['actions']]
          path.write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Commit fix and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/kgg-pain-mode-source-temp.yml
          git add patient-pain-vertical-scale.js docs/kgg-patient-gpt-context.md docs/kgg-patient-gpt-source-index.json docs/kgg-patient-gpt-source docs/kgg-patient-custom-gpt-knowledge-architecture.md docs/kgg-patient-custom-gpt-knowledge-operations.md docs/kgg-patient-custom-gpt-knowledge-safety.md docs/kgg-patient-custom-gpt-knowledge-testing.md docs/kgg-custom-gpt-resource-manifest.json docs/kgg-patient-custom-gpt-editor-snapshot.json
          git commit -m "fix(patient): suppress exercise pain trigger from pain mode data"
          git push origin HEAD:feat/patient-vertical-pain-scale-v74
