name: KGG GPT Preview Gate
run-name: KGG GPT Preview Gate | ${{ inputs.mode }} | ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: validate_only, publish_preview, publish_device_test, create_pr or publish_admin_beta
        required: true
        type: choice
        options:
          - validate_only
          - publish_preview
          - publish_device_test
          - create_pr
          - publish_admin_beta
      request_id:
        description: Stable GPT request id
        required: true
        type: string
      payload_json:
        description: Guarded GPT patch payload JSON
        required: true
        type: string
      ui_stability:
        description: Run UI stability regression
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      approval_phrase:
        description: Exact final Max approval; required only for PR or Admin/Main modes
        required: false
        default: ""
        type: string
      source_sha:
        description: Exact pushed source commit; required only for publish_device_test
        required: false
        default: ""
        type: string
      device_test_profile:
        description: Physical dual-device test profile
        required: false
        default: quick
        type: choice
        options:
          - quick
          - full
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      request_id:
        required: true
        type: string
      payload_json:
        required: true
        type: string
      ui_stability:
        required: false
        default: "false"
        type: string
      approval_phrase:
        required: false
        default: ""
        type: string
      source_sha:
        required: false
        default: ""
        type: string
      device_test_profile:
        required: false
        default: quick
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: kgg-gpt-preview-${{ (inputs.mode == 'publish_preview' || inputs.mode == 'publish_device_test') && 'publish' || inputs.request_id }}
  cancel-in-progress: false

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PAYLOAD_JSON: ${{ inputs.payload_json }}
    steps:
      - name: Checkout canonical main source or pinned device-test source
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ inputs.mode == 'publish_device_test' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Pin dual-device source commit
        if: inputs.mode == 'publish_device_test'
        shell: bash
        env:
          KGG_SOURCE_SHA: ${{ inputs.source_sha }}
          KGG_DEVICE_PROFILE: ${{ inputs.device_test_profile }}
          KGG_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ ! "$KGG_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! "$KGG_REQUEST_ID" =~ ^[a-z0-9][a-z0-9-]{5,63}$ ]]; then
            echo "request_id contains unsupported characters" >&2
            exit 1
          fi
          actual="$(git -C base rev-parse HEAD)"
          test "$actual" = "$KGG_SOURCE_SHA"
          test "$KGG_DEVICE_PROFILE" = 'quick' -o "$KGG_DEVICE_PROFILE" = 'full'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout complete canonical Admin editor sync contract
        if: inputs.mode != 'validate_only' && inputs.mode != 'publish_device_test'
        uses: actions/checkout@v4
        with:
          path: editor-contract
          ref: main

      - name: Require verified Admin GPT editor sync for Preview or release writes
        if: inputs.mode != 'validate_only' && inputs.mode != 'publish_device_test'
        shell: bash
        run: |
          set -euo pipefail
          python editor-contract/release-pipeline/kgg_custom_gpt_resource_audit.py \
            --check \
            --editor-snapshot editor-contract/docs/kgg-custom-gpt-editor-snapshot.json \
            --profile production \
            --require-live-synced

      - uses: actions/setup-java@v4
        if: inputs.mode == 'publish_preview' || inputs.mode == 'publish_device_test'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: inputs.mode == 'publish_preview' || inputs.mode == 'publish_device_test'

      - uses: gradle/actions/setup-gradle@v4
        if: inputs.mode == 'publish_preview' || inputs.mode == 'publish_device_test'
        with:
          gradle-version: "8.11.1"

      - name: Install Poppler for PDF readability smoke
        if: inputs.mode != 'validate_only'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftoppm -v
          pdfinfo -v

      - name: Write dispatch payload
        if: inputs.mode != 'publish_device_test'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          payload = os.environ["PAYLOAD_JSON"]
          path = Path(os.environ["RUNNER_TEMP"]) / "kgg-gpt-payload.json"
          path.write_text(payload, encoding="utf-8", newline="\n")
          print(path)
          PY

      - name: Prepare preview branch checkout
        if: inputs.mode != 'validate_only'
        shell: bash
        run: |
          set -euo pipefail
          repo_url="https://github.com/${{ github.repository }}.git"
          auth_repo_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$repo_url" refs/heads/gpt-preview >/dev/null 2>&1; then
            git clone --branch gpt-preview "$repo_url" preview
            cd preview
            git remote set-url origin "$auth_repo_url"
          else
            mkdir preview
            cd preview
            git init
            git remote add origin "$auth_repo_url"
            git checkout --orphan gpt-preview
          fi

      - name: Preflight guarded GPT payload
        if: inputs.mode != 'publish_device_test'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_gpt_payload_preflight.py \
            --payload-file "$RUNNER_TEMP/kgg-gpt-payload.json"

      - name: Apply guarded GPT payload
        id: gate
        if: inputs.mode != 'publish_device_test'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_gpt_write_gate.py \
            --mode '${{ inputs.mode }}' \
            --payload-file "$RUNNER_TEMP/kgg-gpt-payload.json" \
            --preview-root "$GITHUB_WORKSPACE/preview" \
            --approval-phrase '${{ inputs.approval_phrase }}' \
            --github-output "$GITHUB_OUTPUT"

      - name: Build deterministic Preview context
        if: inputs.mode == 'publish_preview'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_preview_context.py \
            --request-id '${{ inputs.request_id }}' \
            --patch-hash '${{ steps.gate.outputs.patch_hash }}' \
            --base-sha "$(git rev-parse HEAD)" \
            --commit-sha "$(git rev-parse HEAD)" \
            --preview-version '0.2.14-v404-dual-device-qr-test' \
            --payload-file "$RUNNER_TEMP/kgg-gpt-payload.json" \
            --output "$RUNNER_TEMP/kgg-preview-context.json"

      - name: Build bounded dual-device job and Preview context
        id: device_job
        if: inputs.mode == 'publish_device_test'
        shell: bash
        env:
          KGG_SOURCE_SHA: ${{ inputs.source_sha }}
          KGG_REQUEST_ID: ${{ inputs.request_id }}
          KGG_DEVICE_PROFILE: ${{ inputs.device_test_profile }}
        run: |
          set -euo pipefail
          source_sha="$KGG_SOURCE_SHA"
          request_id="$KGG_REQUEST_ID"
          profile="$KGG_DEVICE_PROFILE"
          session_id="kgg-test-$(openssl rand -hex 16)"
          patch_hash="$(printf '%s' "v404|$request_id|$source_sha|$profile" | sha256sum | cut -d' ' -f1)"
          patient_pwa_url='https://kayus24.github.io/kgg-patient-preview/device-test/'
          job_url="https://raw.githubusercontent.com/Kayus24/kgg/gpt-preview/device-tests/$request_id/job.json"
          cd base
          node release-pipeline/kgg_dual_device_job.js \
            --request-id "$request_id" \
            --source-sha "$source_sha" \
            --patch-hash "$patch_hash" \
            --session-id "$session_id" \
            --profile "$profile" \
            --patient-pwa-url "$patient_pwa_url" \
            --output "$RUNNER_TEMP/kgg-device-test-job.json"
          job_hash="$(jq -r .jobHash "$RUNNER_TEMP/kgg-device-test-job.json")"
          python release-pipeline/kgg_preview_context.py \
            --request-id "$request_id" \
            --patch-hash "$patch_hash" \
            --base-sha "$source_sha" \
            --commit-sha "$source_sha" \
            --preview-version '0.2.14-v404-dual-device-qr-test' \
            --required-test critical \
            --required-test patient-qr \
            --required-test patient-scan \
            --device-test-session-id "$session_id" \
            --device-test-job-hash "$job_hash" \
            --device-test-job-url "$job_url" \
            --patient-pwa-url "$patient_pwa_url" \
            --device-test-profile "$profile" \
            --output "$RUNNER_TEMP/kgg-preview-context.json"
          node release-pipeline/kgg_dual_device_package.js \
            --source-sha "$source_sha" \
            --job-file "$RUNNER_TEMP/kgg-device-test-job.json" \
            --output "$RUNNER_TEMP/kgg-device-test-pwa"
          {
            echo "session_id=$session_id"
            echo "job_hash=$job_hash"
            echo "patch_hash=$patch_hash"
            echo "job_url=$job_url"
            echo "patient_pwa_url=$patient_pwa_url"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh generated GPT context files for PR mode
        if: inputs.mode == 'create_pr' || inputs.mode == 'publish_admin_beta'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_gpt_context.py --write
          python release-pipeline/kgg_bug_knowledge.py --write
          python release-pipeline/kgg_gpt_source_context.py --write
          python release-pipeline/kgg_custom_gpt_knowledge_pack.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile production

      - name: Run critical KGG test battery
        if: inputs.mode != 'validate_only'
        shell: bash
        env:
          KGG_ALLOW_RELEASE_DRIFT: "1"
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_test_battery.py --level critical

      - name: Run UI stability regression when requested
        if: inputs.mode != 'validate_only' && (inputs.mode == 'publish_device_test' || inputs.ui_stability == 'true' || steps.gate.outputs.run_ui_stability == 'true')
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_test_battery.py --suite ui-stability --level regression

      - name: Run Admin camera and patient QR regression
        if: inputs.mode != 'validate_only' && steps.gate.outputs.run_camera_qr == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_test_battery.py --suite camera-qr --level regression

      - name: Run patient scanner compatibility regression
        if: inputs.mode != 'validate_only' && steps.gate.outputs.run_patient_scan == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          python release-pipeline/kgg_test_battery.py --suite patient-scan --level regression

      - name: Run dual-device QR contracts and scanner regressions
        if: inputs.mode == 'publish_device_test'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          node release-pipeline/kgg_dual_device_job.js --self-test
          node release-pipeline/kgg_dual_device_package.js --self-test
          python release-pipeline/test_kgg_dual_device_v404.py
          python release-pipeline/kgg_test_battery.py --suite patient-scan --level regression
          node release-pipeline/kgg_device_test_station_browser_smoke.js
          python release-pipeline/kgg_test_battery.py --suite camera-qr --level regression

      - name: Verify pinned main is still current before device-test publication
        if: inputs.mode == 'publish_device_test'
        shell: bash
        env:
          KGG_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git -C base fetch --no-tags origin main:refs/remotes/origin/main
          checked_out="$(git -C base rev-parse HEAD)"
          main_sha="$(git -C base rev-parse origin/main)"
          test "$checked_out" = "$KGG_SOURCE_SHA"
          if [ "$main_sha" != "$KGG_SOURCE_SHA" ]; then
            echo "Main drift detected: pinned=$KGG_SOURCE_SHA current=$main_sha" >&2
            exit 1
          fi

      - name: Stage exact pinned Admin HTML into persistent Preview channel
        id: existing_main_preview
        if: inputs.mode == 'publish_device_test'
        shell: bash
        env:
          KGG_SOURCE_SHA: ${{ inputs.source_sha }}
          KGG_REQUEST_ID: ${{ inputs.request_id }}
          KGG_PATCH_HASH: ${{ steps.device_job.outputs.patch_hash }}
        run: |
          set -euo pipefail
          python base/release-pipeline/kgg_existing_main_preview.py \
            --source-html base/kgg-update/index.html \
            --version-json base/kgg-update/version.json \
            --preview-root preview \
            --request-id "$KGG_REQUEST_ID" \
            --source-sha "$KGG_SOURCE_SHA" \
            --patch-hash "$KGG_PATCH_HASH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build fixed Preview APK
        if: inputs.mode == 'publish_preview' || inputs.mode == 'publish_device_test'
        shell: bash
        run: |
          set -euo pipefail
          cd base/android-wrapper
          gradle -PKGG_PREVIEW_CONTEXT_FILE="$RUNNER_TEMP/kgg-preview-context.json" assemblePreviewDebug

      - name: Checkout public patient test PWA repository
        if: inputs.mode == 'publish_device_test'
        uses: actions/checkout@v4
        with:
          repository: Kayus24/kgg-patient-preview
          token: ${{ secrets.KGG_PATIENT_AUTOMATION_TOKEN }}
          path: patient-preview
          fetch-depth: 0

      - name: Stage public synthetic-only device test files
        if: inputs.mode == 'publish_device_test'
        shell: bash
        env:
          KGG_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          mkdir -p "preview/device-tests/$KGG_REQUEST_ID"
          cp "$RUNNER_TEMP/kgg-device-test-job.json" "preview/device-tests/$KGG_REQUEST_ID/job.json"
          rm -rf patient-preview/device-test
          mkdir -p patient-preview/device-test
          cp -R "$RUNNER_TEMP/kgg-device-test-pwa/." patient-preview/device-test/

      - name: Upload dual-device APK, PWA, job and pinned HTML artifacts
        if: inputs.mode == 'publish_device_test'
        uses: actions/upload-artifact@v4
        with:
          name: kgg-dual-device-${{ inputs.request_id }}
          path: |
            base/android-wrapper/app/build/outputs/apk/preview/debug/app-preview-debug.apk
            ${{ runner.temp }}/kgg-device-test-pwa
            ${{ runner.temp }}/kgg-device-test-job.json
            ${{ runner.temp }}/kgg-preview-context.json
            preview/previews/${{ inputs.request_id }}/admin.html
            preview/previews/${{ inputs.request_id }}/meta.json

      - name: Upload Preview APK and HTML artifacts
        if: inputs.mode == 'publish_preview'
        uses: actions/upload-artifact@v4
        with:
          name: kgg-preview-${{ inputs.request_id }}
          path: |
            base/android-wrapper/app/build/outputs/apk/preview/debug/app-preview-debug.apk
            preview/previews/${{ inputs.request_id }}/admin.html
            preview/previews/${{ inputs.request_id }}/meta.json

      - name: Publish preview channel
        if: inputs.mode == 'publish_preview'
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews
          if git diff --cached --quiet; then
            echo "No preview changes to publish."
            exit 0
          fi
          git commit -m "publish gpt preview ${{ inputs.request_id }}"
          if git ls-remote --exit-code origin refs/heads/gpt-preview >/dev/null 2>&1; then
            git pull --rebase origin gpt-preview
          fi
          git push origin HEAD:gpt-preview
          {
            echo "Preview HTML: ${{ steps.gate.outputs.preview_url }}"
            echo "Patch hash: ${{ steps.gate.outputs.patch_hash }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish persistent device-test Preview channel
        if: inputs.mode == 'publish_device_test'
        shell: bash
        env:
          KGG_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          cd preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews "device-tests/$KGG_REQUEST_ID/job.json"
          if git diff --cached --quiet; then
            echo "Device-test Preview channel is already current."
            exit 0
          fi
          git commit -m "publish persistent device test $KGG_REQUEST_ID"
          if git ls-remote --exit-code origin refs/heads/gpt-preview >/dev/null 2>&1; then
            git pull --rebase origin gpt-preview
          fi
          git push origin HEAD:gpt-preview
          {
            echo "Preview HTML: ${{ steps.existing_main_preview.outputs.preview_url }}"
            echo "Pinned source SHA: ${{ steps.existing_main_preview.outputs.preview_source_sha }}"
            echo "Preview rollout: ${{ steps.existing_main_preview.outputs.preview_rollout_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public token-free patient test PWA
        if: inputs.mode == 'publish_device_test'
        shell: bash
        env:
          KGG_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          cd patient-preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add device-test
          if git diff --cached --quiet; then
            echo "Patient test PWA is already current."
          else
            git commit -m "publish patient device test $KGG_REQUEST_ID"
            git pull --rebase origin "$(git branch --show-current)"
            git push origin HEAD
          fi
          {
            echo "Patient test PWA: ${{ steps.device_job.outputs.patient_pwa_url }}"
            echo "Device job: ${{ steps.device_job.outputs.job_url }}"
            echo "Session: ${{ steps.device_job.outputs.session_id }}"
            echo "Job hash: ${{ steps.device_job.outputs.job_hash }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create guarded PR from accepted preview
        if: inputs.mode == 'create_pr'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          branch="gpt-write/${{ inputs.request_id }}-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kgg-update/src kgg-update/index.html kgg-update/version.json release-inbox release-pipeline/gpt-regressions docs/kgg-gpt-context.md docs/kgg-gpt-bug-index.json docs/kgg-gpt-bug-lessons.md docs/kgg-gpt-patch-patterns.md docs/kgg-gpt-source-index.json docs/kgg-gpt-area-routes.md docs/kgg-gpt-area-routes.json docs/kgg-gpt-source docs/kgg-custom-gpt-playbook.md docs/kgg-custom-gpt-action-schema.md docs/kgg-custom-gpt-negative-examples.md docs/kgg-custom-gpt-preview-runbook.md docs/kgg-custom-gpt-preview-report-template.md docs/kgg-custom-gpt-test-prompts.md docs/kgg-custom-gpt-expected-results.md docs/kgg-custom-gpt-test-report.md docs/kgg-custom-gpt-cycle-report.md docs/kgg-custom-gpt-knowledge-pack.md docs/kgg-custom-gpt-knowledge-architecture.md docs/kgg-custom-gpt-knowledge-operations.md docs/kgg-custom-gpt-knowledge-safety.md docs/kgg-custom-gpt-knowledge-testing.md docs/kgg-custom-gpt-resource-manifest.json docs/kgg-custom-gpt-editor-snapshot.json release-pipeline/kgg_gpt_context.py release-pipeline/kgg_gpt_source_context.py release-pipeline/kgg_gpt_payload_preflight.py release-pipeline/kgg_gpt_eval.py release-pipeline/kgg_gpt_stabilize.py release-pipeline/kgg_custom_gpt_knowledge_pack.py release-pipeline/kgg_custom_gpt_resource_audit.py release-pipeline/kgg_android_preview_probe.py
          git commit -m "gpt write gate ${{ inputs.request_id }}"
          git push -u origin "$branch"
          body="$(mktemp)"
          cat > "$body" <<BODY
          Guarded Custom GPT patch.

          - Preview request: \`${{ inputs.request_id }}\`
          - Patch hash: \`${{ steps.gate.outputs.patch_hash }}\`
          - Version: \`${{ steps.gate.outputs.version_name }}\`
          - Release inbox: \`${{ steps.gate.outputs.release_id }}\`

          This PR was created only after a matching preview existed on the \`gpt-preview\` branch.
          BODY
          url="$(gh pr create --base main --head "$branch" --title "[gpt-patch] ${{ inputs.request_id }}" --body-file "$body")"
          echo "PR: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish guarded Admin beta from accepted preview
        if: inputs.mode == 'publish_admin_beta'
        shell: bash
        run: |
          set -euo pipefail
          cd base
          branch="gpt-admin-beta/${{ inputs.request_id }}-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kgg-update/src kgg-update/index.html kgg-update/version.json release-inbox release-pipeline/gpt-regressions docs/kgg-gpt-context.md docs/kgg-gpt-bug-index.json docs/kgg-gpt-bug-lessons.md docs/kgg-gpt-patch-patterns.md docs/kgg-gpt-source-index.json docs/kgg-gpt-area-routes.md docs/kgg-gpt-area-routes.json docs/kgg-gpt-source docs/kgg-custom-gpt-knowledge-pack.md docs/kgg-custom-gpt-knowledge-architecture.md docs/kgg-custom-gpt-knowledge-operations.md docs/kgg-custom-gpt-knowledge-safety.md docs/kgg-custom-gpt-knowledge-testing.md docs/kgg-custom-gpt-resource-manifest.json docs/kgg-custom-gpt-editor-snapshot.json
          git commit -m "admin beta ${{ inputs.request_id }}"
          git push -u origin "$branch"
          body="$(mktemp)"
          cat > "$body" <<BODY
          Guarded Custom GPT Admin beta.

          - Preview request: \`${{ inputs.request_id }}\`
          - Patch hash: \`${{ steps.gate.outputs.patch_hash }}\`
          - Version: \`${{ steps.gate.outputs.version_name }}\`
          - Release inbox: \`${{ steps.gate.outputs.release_id }}\`

          This Admin beta is allowed only after the matching Preview/Test-APK result was accepted.
          BODY
          url="$(gh pr create --base main --head "$branch" --title "[admin-beta] ${{ steps.gate.outputs.release_id }} ${{ steps.gate.outputs.version_name }}" --body-file "$body")"
          gh label create kgg-auto-merge \
            --description 'Allows guarded KGG admin beta auto-merge after required checks' \
            --color 0E8A16 || true
          gh pr edit "$url" --add-label kgg-auto-merge
          gh pr checks "$url" --required --watch --fail-fast
          gh pr merge "$url" --squash
          echo "PR: $url" >> "$GITHUB_STEP_SUMMARY"
