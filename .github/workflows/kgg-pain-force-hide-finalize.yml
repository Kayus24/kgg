name: KGG Pain Legacy Hide Finalize

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: kgg-pain-force-hide-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix legacy pain-row priority and regenerate resources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('patient-pain-vertical-scale.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("const VERSION='vertical-pain-v1-exercise-only';", "const VERSION='vertical-pain-v2-force-hide-legacy';")
          old = "state.row=row;state.rowHidden=row.hidden;state.rowAria=row.getAttribute('aria-hidden');state.rowInert=Boolean(row.inert);"
          new = "state.row=row;state.rowHidden=row.hidden;state.rowAria=row.getAttribute('aria-hidden');state.rowInert=Boolean(row.inert);state.rowDisplay=row.style.getPropertyValue('display');state.rowDisplayPriority=row.style.getPropertyPriority('display');"
          if old not in text:
              raise SystemExit('legacy row state anchor missing')
          text = text.replace(old, new, 1)
          old = "row.hidden=true;row.inert=true;row.setAttribute('aria-hidden','true');"
          new = "row.hidden=true;row.inert=true;row.setAttribute('aria-hidden','true');row.style.setProperty('display','none','important');"
          if old not in text:
              raise SystemExit('legacy row hide anchor missing')
          text = text.replace(old, new, 1)
          old = "row.hidden=Boolean(state.rowHidden);row.inert=Boolean(state.rowInert);"
          new = "row.hidden=Boolean(state.rowHidden);row.inert=Boolean(state.rowInert);if(state.rowDisplay)row.style.setProperty('display',state.rowDisplay,state.rowDisplayPriority||'');else row.style.removeProperty('display');"
          if old not in text:
              raise SystemExit('legacy row restore anchor missing')
          text = text.replace(old, new, 1)
          old = "rowHidden:false,rowAria:null,rowInert:false};"
          new = "rowHidden:false,rowAria:null,rowInert:false,rowDisplay:'',rowDisplayPriority:''};"
          if old not in text:
              raise SystemExit('state shape anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python release-pipeline/kgg_patient_gpt_resources.py --write
      - name: Remove finalizer and commit exact fix
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/kgg-pain-force-hide-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patient-pain-vertical-scale.js \
            docs/kgg-patient-gpt-context.md \
            docs/kgg-patient-gpt-source-index.json \
            docs/kgg-patient-gpt-source \
            docs/kgg-patient-custom-gpt-knowledge-architecture.md \
            docs/kgg-patient-custom-gpt-knowledge-operations.md \
            docs/kgg-patient-custom-gpt-knowledge-safety.md \
            docs/kgg-patient-custom-gpt-knowledge-testing.md \
            .github/workflows/kgg-pain-force-hide-finalize.yml
          git diff --cached --check
          git commit -m "Force-hide legacy pain row under vertical control"
          git push origin "HEAD:${HEAD_BRANCH}"
