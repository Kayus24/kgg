name: Temporary continuous day changelog fix
on:
  push:
    branches: [fix/patient-continuous-training-days-v75]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix changelog structure and refresh patient resources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG_PATIENT_APP.md')
          s=p.read_text(encoding='utf-8')
          bad="\n## v75 – Fortlaufende Trainingstage\n- Fortlaufende Pläne wechseln nach Abschluss automatisch auf den nächsten Trainingstag und sind nicht mehr durch den ursprünglichen Planhorizont begrenzt.\n- T13+ bleiben über Reload, Planwechsel und Plan-Löschen erhalten; feste Pläne mit `extendDays:false` bleiben begrenzt.\n- Die Trainingshistorie lädt ältere Tage in 30er-Schritten statt unbegrenzt DOM-Karten aufzubauen.\n# Patient App Changelog\n"
          good="# Patient App Changelog\n\n## 2026-08-13 – Fortlaufende Trainingstage v75\n\n### Changed\n- Fortlaufende Pläne wechseln nach Abschluss automatisch auf den nächsten Trainingstag und sind nicht mehr durch den ursprünglichen Planhorizont begrenzt.\n- T13+ bleiben über Reload, Planwechsel und Plan-Löschen erhalten; feste Pläne mit `extendDays:false` bleiben begrenzt.\n- Die Trainingshistorie lädt ältere Tage in 30er-Schritten statt unbegrenzt DOM-Karten aufzubauen.\n\n### Safety\n- QR-Payload bleibt beim Abschluss auf dem tatsächlich beendeten Tag; Plan-, Schmerz-, Numpad-, Kamera- und Medienlogik bleiben unverändert.\n"
          if bad not in s: raise SystemExit('unexpected changelog preamble')
          p.write_text(s.replace(bad,good,1),encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile patientProduction
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
          python release-pipeline/kgg_patient_gpt_write_gate.py --self-test --self-test-preview-root "$RUNNER_TEMP/kgg-patient-preview-smoke"
      - name: Commit changelog and generated resources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG_PATIENT_APP.md docs/kgg-patient-* docs/kgg-custom-gpt-resource-manifest.json docs/kgg-patient-custom-gpt-editor-snapshot.json
          git commit -m 'docs(patient): align v75 changelog contract'
          git push origin HEAD:fix/patient-continuous-training-days-v75
