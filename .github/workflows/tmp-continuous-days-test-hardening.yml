name: Temporary continuous day test hardening
on:
  push:
    branches: [fix/patient-continuous-training-days-v75]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-continuous-training-days-v75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden continuous-day browser driver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('release-pipeline/kgg_patient_continuous_days_playwright.js')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("async function main(){\n  const server=http.createServer", "async function main(){\n  const watchdog=setTimeout(()=>{console.error('KGG patient continuous days Playwright FAIL: global 150s watchdog');process.exit(1)},150000);\n  const mark=message=>console.log('[continuous-days] '+message);\n  const server=http.createServer"),
            ("  const page=await context.newPage();\n  const errors=[];page.on('pageerror',e=>errors.push(e.message));", "  const page=await context.newPage();\n  page.setDefaultTimeout(8000);page.setDefaultNavigationTimeout(15000);\n  const errors=[];page.on('pageerror',e=>errors.push(e.message));"),
            ("    await page.goto(url,{waitUntil:'domcontentloaded'});await waitForRuntime(page);", "    mark('boot continuous fixture');\n    await page.goto(url,{waitUntil:'domcontentloaded'});await waitForRuntime(page);"),
            ("    await seedCurrent(page,[1,2,3,4,5,6],7);", "    mark('T7 to T8');\n    await seedCurrent(page,[1,2,3,4,5,6],7);"),
            ("    await seedCurrent(page,Array.from({length:12},(_,i)=>i+1),13);", "    mark('T12 to T13 and reload');\n    await seedCurrent(page,Array.from({length:12},(_,i)=>i+1),13);"),
            ("    await seedCurrent(page,Array.from({length:99},(_,i)=>i+1),100);", "    mark('T99 to T100 and paged history');\n    await seedCurrent(page,Array.from({length:99},(_,i)=>i+1),100);"),
            ("    await page.evaluate(()=>{d=4;render()});", "    mark('historical finalize preserves front');\n    await page.evaluate(()=>{d=4;render()});"),
            ("    // Two plans keep independent resume days.\n    await page.evaluate(({planA,planB})=>{", "    // Two plans keep independent resume days.\n    mark('multi-plan independent days');\n    await page.evaluate(({planA,planB})=>{"),
            ("    // Explicit fixed plans keep their hard end.\n    const fixed=", "    // Explicit fixed plans keep their hard end.\n    mark('fixed plan hard end');\n    const fixed="),
            ("    assert(errors.length===0,`continuous-day browser raised page errors: ${errors.join(' | ')}`);", "    mark('final assertions');\n    assert(errors.length===0,`continuous-day browser raised page errors: ${errors.join(' | ')}`);"),
            ("  }finally{await context.close();await browser.close();await new Promise(resolve=>server.close(resolve))}\n}", "  }finally{clearTimeout(watchdog);await context.close().catch(()=>{});await browser.close().catch(()=>{});if(typeof server.closeAllConnections==='function')server.closeAllConnections();await Promise.race([new Promise(resolve=>server.close(()=>resolve())),new Promise(resolve=>setTimeout(resolve,2000))])}\n}"),
          ]
          for old,new in pairs:
              if old not in s:
                  raise SystemExit('missing playwright anchor: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')

          w=Path('.github/workflows/kgg-continuous-days-pr-check.yml')
          t=w.read_text(encoding='utf-8')
          old="      - name: Run continuous-day browser contract\n        run: node release-pipeline/kgg_patient_continuous_days_playwright.js\n"
          new="      - name: Run continuous-day browser contract\n        run: timeout 180s node release-pipeline/kgg_patient_continuous_days_playwright.js\n"
          if old not in t:
              raise SystemExit('missing continuous check browser step')
          w.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          python release-pipeline/kgg_patient_gpt_resources.py --write
          python release-pipeline/kgg_custom_gpt_resource_audit.py --refresh-target-profile patientProduction
          python release-pipeline/kgg_patient_gpt_resources.py --check
          python release-pipeline/kgg_custom_gpt_resource_audit.py --check
      - name: Commit hardened test and refreshed resources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/kgg-continuous-days-pr-check.yml release-pipeline/kgg_patient_continuous_days_playwright.js docs/kgg-patient-* docs/kgg-custom-gpt-resource-manifest.json docs/kgg-patient-custom-gpt-editor-snapshot.json
          git commit -m 'test(patient): bound continuous day browser regression'
          git push origin HEAD:fix/patient-continuous-training-days-v75
